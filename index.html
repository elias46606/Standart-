  <style>
    :root {
      --bg: #08090d;
      --panel: rgba(28, 31, 40, 0.55);
      --panel-2: rgba(40, 44, 56, 0.6);
      --line: rgba(200, 208, 224, 0.14);
      --line-bright: rgba(220, 228, 244, 0.4);
      --text: #eef1f7;
      --muted: #9aa3b5;
      --silver-1: #8b919c;
      --silver-2: #e7ecf4;
      --silver-3: #c2c8d4;
      --gold: #d8b964;
      --gold-soft: #f0d68f;
      --live: #ff4d5e;
      --green: #46e0a0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      padding: 30px 16px 80px; position: relative; overflow-x: hidden;
    }

    /* Edler, metallischer Hintergrund */
    .bg-fx {
      position: fixed; inset: 0; z-index: -3;
      background:
        radial-gradient(50vw 50vw at 12% -8%, rgba(216,185,100,0.10), transparent 60%),
        radial-gradient(55vw 55vw at 90% 0%, rgba(200,208,224,0.10), transparent 60%),
        radial-gradient(70vw 60vw at 50% 115%, rgba(160,170,190,0.10), transparent 60%),
        linear-gradient(160deg, #0b0c11 0%, #0e1016 50%, #090a0e 100%);
    }
    /* feiner Lichtschimmer / „Brushed metal" */
    .sheen-fx {
      position: fixed; inset: 0; z-index: -2; opacity: 0.5;
      background: repeating-linear-gradient(115deg,
        rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 2px,
        transparent 2px, transparent 6px);
      mask-image: radial-gradient(ellipse at 50% 0%, #000 20%, transparent 70%);
    }
    .stars-fx { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .spark { position: absolute; background: #fff; border-radius: 50%;
      opacity: 0.5; animation: twinkle 3s infinite alternate; }
    @keyframes twinkle { from { opacity: 0.12; } to { opacity: 0.7; } }

    .wrap { max-width: 980px; margin: 0 auto; position: relative; }

    /* ===== Header ===== */
    header { text-align: center; margin-bottom: 30px; }
    .crest { font-size: 2.4rem; letter-spacing: 6px; margin-bottom: 6px;
      filter: drop-shadow(0 4px 14px rgba(216,185,100,0.35)); }
    .kicker {
      font-family: "Cinzel", serif; font-size: 0.74rem; letter-spacing: 6px;
      text-transform: uppercase; color: var(--gold-soft); margin-bottom: 12px;
    }
    h1 {
      font-family: "Cinzel", serif; font-size: clamp(2rem, 6vw, 3.6rem);
      font-weight: 900; line-height: 1.02; letter-spacing: 2px;
      background: linear-gradient(115deg, #8a8f98 0%, #e9eef5 22%, #ffffff 38%,
                  #c2c8d2 55%, #9aa0aa 72%, #f3f6fb 100%);
      background-size: 220% auto;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: shimmer 6s linear infinite;
      filter: drop-shadow(0 2px 18px rgba(220,228,244,0.18));
    }
    @keyframes shimmer { to { background-position: 220% center; } }
    .underline { width: 120px; height: 2px; margin: 14px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .subtitle { color: var(--muted); margin-top: 14px; font-size: 1rem; font-weight: 500; }
    .status-bar {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 16px;
      font-size: 0.78rem; color: var(--muted); padding: 7px 16px; border-radius: 999px;
      background: var(--panel); border: 1px solid var(--line);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      letter-spacing: 1px; font-weight: 600;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 12px var(--green); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }

    /* ===== Controls ===== */
    .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
      justify-content: space-between; margin-bottom: 22px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab {
      background: var(--panel); border: 1px solid var(--line); color: var(--muted);
      padding: 9px 16px; border-radius: 11px; cursor: pointer;
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 0.9rem;
      letter-spacing: 0.3px; transition: all 0.2s;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .tab:hover { color: var(--text); border-color: var(--line-bright); transform: translateY(-1px); }
    .tab.active {
      color: #15171d; border-color: transparent; font-weight: 700;
      background: linear-gradient(120deg, var(--silver-3), var(--silver-2), var(--silver-3));
      box-shadow: 0 4px 18px rgba(220,228,244,0.25);
    }
    input[type="search"] {
      background: var(--panel); border: 1px solid var(--line); color: var(--text);
      padding: 10px 16px; border-radius: 11px; font-size: 0.95rem;
      font-family: "Inter", sans-serif; min-width: 170px; flex: 1 1 170px; max-width: 260px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    input[type="search"]::placeholder { color: var(--muted); }
    input[type="search"]:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 16px rgba(216,185,100,0.25); }

    /* ===== Month head ===== */
    .month-head {
      margin: 28px 0 12px; font-family: "Cinzel", serif; font-size: 0.86rem;
      font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
      color: var(--silver-2); display: flex; align-items: center; gap: 14px;
    }
    .month-head::after { content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, var(--line-bright), transparent); }

    /* ===== Match card ===== */
    .match {
      position: relative; background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; padding: 16px 18px; margin-bottom: 12px;
      display: grid; grid-template-columns: 84px 1fr auto; gap: 16px; align-items: center;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; overflow: hidden;
    }
    .match::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(var(--silver-2), var(--silver-1)); opacity: 0.6; }
    .match.is-wm::before { background: linear-gradient(var(--gold-soft), var(--gold)); }
    .match.is-live::before { background: var(--live); opacity: 1; box-shadow: 0 0 16px var(--live); }
    .match:hover { transform: translateY(-2px); border-color: var(--line-bright);
      box-shadow: 0 10px 34px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06); }
    /* Deutschland-Hervorhebung (Schwarz-Rot-Gold) */
    .match.is-fav { background: linear-gradient(100deg, rgba(216,185,100,0.10), var(--panel) 55%);
      border-color: rgba(216,185,100,0.35); }
    .match.is-fav::before { background: linear-gradient(#1a1a1a, #d00, #d8b964); opacity: 1; width: 4px; }
    .fav-star { color: var(--gold-soft); margin-left: 4px; }
    tr.is-fav td { background: rgba(216,185,100,0.10); }
    tr.is-fav td.t { color: #fff; }

    .when { text-align: center; font-size: 0.74rem; color: var(--muted);
      line-height: 1.45; font-weight: 600; letter-spacing: 0.4px; }
    .when .day { font-family: "Cinzel", serif; font-size: 1.5rem; font-weight: 700; color: var(--text); }

    .teams { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .team { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .team.winner { font-weight: 700; color: #fff; }
    .flag { width: 28px; height: 20px; object-fit: cover; border-radius: 3px; flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.12); }
    .flag-fallback { width: 28px; height: 20px; border-radius: 3px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--silver-1), transparent);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); }
    .meta { font-size: 0.76rem; color: var(--muted); margin-top: 3px;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-weight: 500; }

    .result { text-align: right; min-width: 70px; }
    .score { font-family: "Cinzel", serif; font-size: 1.55rem; font-weight: 700;
      letter-spacing: 1px; font-variant-numeric: tabular-nums; color: var(--silver-2); }
    .vs { color: var(--muted); font-size: 0.9rem; font-family: "Cinzel", serif; letter-spacing: 2px; }
    .tag { display: inline-block; font-size: 0.64rem; font-weight: 700; letter-spacing: 0.8px;
      padding: 3px 9px; border-radius: 6px; margin-top: 5px; text-transform: uppercase; }
    .tag.live { background: var(--live); color: #fff; box-shadow: 0 0 14px rgba(255,77,94,0.6); animation: pulse 1.4s infinite; }
    .tag.ft { background: rgba(200,208,224,0.1); color: var(--muted); }
    .tag.grp { background: rgba(216,185,100,0.16); color: var(--gold-soft); border: 1px solid rgba(216,185,100,0.4); }
    .tag.ko { background: rgba(231,236,244,0.12); color: var(--silver-2); border: 1px solid rgba(231,236,244,0.3); }
    .tag.test { background: rgba(70,224,160,0.12); color: var(--green); border: 1px solid rgba(70,224,160,0.3); }

    /* ===== Gruppentabellen ===== */
    .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
    .group-card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .group-title { font-family: "Cinzel", serif; font-size: 1.05rem; font-weight: 700;
      letter-spacing: 2px; color: var(--gold-soft); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px; }
    table.standings { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.standings th { color: var(--muted); font-weight: 600; font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.5px; text-align: center; padding: 4px 3px; }
    table.standings th.t { text-align: left; }
    table.standings td { padding: 7px 3px; text-align: center; border-top: 1px solid var(--line);
      font-variant-numeric: tabular-nums; }
    table.standings td.t { text-align: left; font-weight: 600; }
    table.standings td.pts { font-family: "Cinzel", serif; font-weight: 700; color: var(--silver-2); }
    .rankcell { display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 6px; font-size: 0.72rem; font-weight: 700;
      background: rgba(200,208,224,0.12); margin-right: 7px; }
    tr.qualified .rankcell { background: rgba(216,185,100,0.22); color: var(--gold-soft); }
    .team-cell { display: inline-flex; align-items: center; gap: 8px; }
    .team-cell .flag, .team-cell .flag-fallback { width: 22px; height: 16px; }
    .form { display: inline-flex; gap: 3px; }
    .form span { width: 15px; height: 15px; border-radius: 3px; font-size: 0.58rem;
      display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #0c0d10; }
    .form .w { background: var(--green); }
    .form .d { background: var(--gold); }
    .form .l { background: var(--live); color: #fff; }
    .legend { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 6px 0 18px; }
    .legend b { color: var(--gold-soft); }

    .empty, .loading, .error { text-align: center; color: var(--muted);
      padding: 56px 16px; font-size: 1rem; font-weight: 500; }
    .error { color: #ffb0b0; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 16px; border: 3px solid var(--line);
      border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 46px; font-weight: 500; line-height: 1.7; }
    footer a { color: var(--gold-soft); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ===== klickbare Karte ===== */
    .match { cursor: pointer; }
    .match .chevron { position: absolute; right: 12px; bottom: 10px; color: var(--muted);
      font-size: 0.9rem; opacity: 0.5; transition: opacity .2s, transform .2s; }
    .match:hover .chevron { opacity: 1; transform: translateX(2px); }

    /* ===== Torschützenliste ===== */
    .scorers { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 8px 16px 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    table.scorers-tbl { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    table.scorers-tbl th { color: var(--muted); font-weight: 600; font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.5px; text-align: center; padding: 8px 4px; }
    table.scorers-tbl th.t { text-align: left; }
    table.scorers-tbl td { padding: 9px 4px; text-align: center; border-top: 1px solid var(--line);
      font-variant-numeric: tabular-nums; }
    table.scorers-tbl td.t { text-align: left; font-weight: 600; }
    table.scorers-tbl td.g { font-family: "Cinzel", serif; font-weight: 700; color: var(--gold-soft); font-size: 1.05rem; }

    /* ===== Modal ===== */
    .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
      justify-content: center; padding: 16px; }
    .modal[hidden] { display: none; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(4,5,9,0.72);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade .2s ease; }
    @keyframes fade { from { opacity: 0; } }
    .modal-card { position: relative; width: min(560px, 100%); max-height: 88vh; overflow-y: auto;
      background: linear-gradient(160deg, #14161d, #0c0d12); border: 1px solid var(--line-bright);
      border-radius: 18px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      animation: pop .22s cubic-bezier(.2,.8,.2,1); }
    @keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } }
    .modal-close { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px;
      border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--text);
      cursor: pointer; font-size: 0.9rem; }
    .modal-close:hover { border-color: var(--line-bright); }

    .md-stage { text-align: center; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase;
      color: var(--gold-soft); font-weight: 700; }
    .md-meta { text-align: center; color: var(--muted); font-size: 0.82rem; margin-top: 4px; }
    .md-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
      margin: 18px 0 6px; }
    .md-team { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
    .md-team .flag, .md-team .flag-fallback { width: 56px; height: 38px; }
    .md-team span { font-weight: 600; font-size: 1.02rem; }
    .md-result { font-family: "Cinzel", serif; font-size: 2.2rem; font-weight: 700; color: var(--silver-2);
      text-align: center; font-variant-numeric: tabular-nums; }
    .md-ht { text-align: center; color: var(--muted); font-size: 0.8rem; margin-bottom: 14px; }
    .md-h { font-family: "Cinzel", serif; font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase;
      color: var(--silver-2); margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
    .md-h::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-bright), transparent); }
    .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
    .goals .side { display: flex; flex-direction: column; gap: 6px; }
    .goals .side.away { text-align: right; }
    .goal { font-size: 0.92rem; color: var(--text); }
    .goal .min { color: var(--gold-soft); font-weight: 700; font-variant-numeric: tabular-nums; }
    .goal .gnote { color: var(--muted); font-size: 0.78rem; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 0.9rem; }
    .facts .k { color: var(--muted); }
    .facts .v { font-weight: 600; text-align: right; }
    .md-note { background: rgba(216,185,100,0.08); border: 1px solid rgba(216,185,100,0.22);
      color: var(--muted); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; line-height: 1.5; }
    .md-note b { color: var(--gold-soft); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }

    @media (max-width: 520px) {
      .match { grid-template-columns: 64px 1fr auto; gap: 11px; padding: 13px; }
      .team { font-size: 0.95rem; } .score { font-size: 1.3rem; }
      .groups-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-fx"></div>
  <div class="sheen-fx"></div>
  <div class="stars-fx" id="stars"></div>

  <div class="wrap">
    <header>
      <div class="crest">🏆</div>
      <div class="kicker">🇨🇦 🇺🇸 🇲🇽 · FIFA World Cup</div>
      <h1>WM 2026</h1>
      <div class="underline"></div>
      <div class="subtitle">Spielplan · Gruppen · Tabellen &amp; Testspiele der A-Nationalmannschaften</div>
      <div class="status-bar"><span class="dot"></span><span id="status">Lade Spiele…</span></div>
    </header>

    <div class="controls">
      <div class="tabs">
        <button class="tab active" data-filter="all">Alle</button>
        <button class="tab" data-filter="groups">Gruppen</button>
        <button class="tab" data-filter="scorers">Torschützen</button>
        <button class="tab" data-filter="wm">WM-Endrunde</button>
        <button class="tab" data-filter="test">Testspiele</button>
        <button class="tab" data-filter="live">Live</button>
        <button class="tab" data-filter="upcoming">Kommend</button>
      </div>
      <input type="search" id="search" placeholder="Team / Gruppe suchen…" autocomplete="off">
    </div>

    <div id="list"><div class="loading"><div class="spinner"></div>Spiele werden geladen…</div></div>

    <footer>
      WM-Daten: <a href="https://github.com/openfootball/worldcup.json" target="_blank" rel="noopener">openfootball</a> (gemeinfrei) ·
      Testspiele &amp; Live: <a href="https://www.thesportsdb.com" target="_blank" rel="noopener">TheSportsDB</a> ·
      Flaggen: <a href="https://flagcdn.com" target="_blank" rel="noopener">flagcdn</a><br>
      Automatische Aktualisierung alle 60&nbsp;Sekunden · Stand: <span id="updated">–</span>
    </footer>
  </div>

  <!-- Spiel-Detail-Overlay -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Spieldetails">
      <button class="modal-close" data-close aria-label="Schließen">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // ====== Konfiguration ======================================================
    // WM 2026: openfootball (gemeinfrei, kein Key) – mehrere Quellen als Fallback.
    const WM_SOURCES = [
      "https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json",
      "https://cdn.jsdelivr.net/gh/openfootball/worldcup.json@master/2026/worldcup.json",
    ];
    // Testspiele (A-Länderspiele) + Live-Notfall-Fallback: TheSportsDB
    const TSDB = "https://www.thesportsdb.com/api/v1/json/123";
    const TEST_LEAGUE = "4562", WM_LEAGUE_TSDB = "4429", TEST_SEASON = "2026";

    // Zeitfenster rund um die WM
    const WINDOW_START = new Date("2026-05-15T00:00:00");
    const WINDOW_END   = new Date("2026-07-31T23:59:59");

    const REFRESH_MS = 60_000;
    const CACHE_KEY = "wm2026-cache-v3";

    // Lieblingsteam hervorheben (DFB). Name wie in den Daten ("Germany").
    const FAV_TEAM = "Germany";
    const isFav = name => name === FAV_TEAM;

    // FIFA-3-Buchstaben-Code -> ISO-3166 alpha-2 (für Flaggen via flagcdn)
    const FIFA2ISO = {
      USA:"us",CAN:"ca",MEX:"mx",
      GER:"de",FRA:"fr",ENG:"gb-eng",ESP:"es",POR:"pt",NED:"nl",BEL:"be",ITA:"it",CRO:"hr",
      SUI:"ch",SRB:"rs",DEN:"dk",POL:"pl",AUT:"at",UKR:"ua",SWE:"se",CZE:"cz",WAL:"gb-wls",
      SCO:"gb-sct",NOR:"no",TUR:"tr",GRE:"gr",HUN:"hu",ROU:"ro",SVK:"sk",SVN:"si",IRL:"ie",
      ISL:"is",FIN:"fi",ALB:"al",BIH:"ba",NIR:"gb-nir",RUS:"ru",
      BRA:"br",ARG:"ar",URU:"uy",COL:"co",CHI:"cl",PER:"pe",ECU:"ec",PAR:"py",VEN:"ve",BOL:"bo",
      CRC:"cr",JAM:"jm",PAN:"pa",HON:"hn",SLV:"sv",HAI:"ht",CUW:"cw",TRI:"tt",GUA:"gt",
      SEN:"sn",MAR:"ma",NGA:"ng",CMR:"cm",GHA:"gh",EGY:"eg",ALG:"dz",TUN:"tn",CIV:"ci",MLI:"ml",
      RSA:"za",COD:"cd",BFA:"bf",CPV:"cv",GAB:"ga",ANG:"ao",ZAM:"zm",GUI:"gn",
      JPN:"jp",KOR:"kr",IRN:"ir",KSA:"sa",AUS:"au",QAT:"qa",IRQ:"iq",UAE:"ae",UZB:"uz",CHN:"cn",
      JOR:"jo",OMA:"om",BHR:"bh",NZL:"nz",IDN:"id",PRK:"kp",THA:"th",VIE:"vn",IND:"in"
    };
    // Ländername (engl./dt.) -> ISO-2 (Fallback, falls kein Code vorhanden)
    const NAME2ISO = {
      "usa":"us","united states":"us","vereinigte staaten":"us","canada":"ca","kanada":"ca",
      "mexico":"mx","mexiko":"mx","germany":"de","deutschland":"de","france":"fr","frankreich":"fr",
      "spain":"es","spanien":"es","portugal":"pt","netherlands":"nl","niederlande":"nl",
      "belgium":"be","belgien":"be","italy":"it","italien":"it","croatia":"hr","kroatien":"hr",
      "switzerland":"ch","schweiz":"ch","serbia":"rs","serbien":"rs","denmark":"dk","dänemark":"dk",
      "poland":"pl","polen":"pl","austria":"at","österreich":"at","ukraine":"ua","sweden":"se",
      "schweden":"se","czech republic":"cz","czechia":"cz","tschechien":"cz","wales":"gb-wls",
      "scotland":"gb-sct","schottland":"gb-sct","england":"gb-eng","norway":"no","norwegen":"no",
      "turkey":"tr","türkei":"tr","türkiye":"tr","greece":"gr","griechenland":"gr","hungary":"hu",
      "ungarn":"hu","romania":"ro","rumänien":"ro","slovakia":"sk","slowakei":"sk","slovenia":"si",
      "slowenien":"si","ireland":"ie","irland":"ie","iceland":"is","island":"is","finland":"fi",
      "finnland":"fi","albania":"al","albanien":"al","bosnia & herzegovina":"ba",
      "bosnia and herzegovina":"ba","bosnien":"ba",
      "brazil":"br","brasilien":"br","argentina":"ar","argentinien":"ar","uruguay":"uy",
      "colombia":"co","kolumbien":"co","chile":"cl","peru":"pe","ecuador":"ec","paraguay":"py",
      "venezuela":"ve","bolivia":"bo","bolivien":"bo",
      "costa rica":"cr","jamaica":"jm","jamaika":"jm","panama":"pa","honduras":"hn",
      "el salvador":"sv","haiti":"ht","curacao":"cw","curaçao":"cw","trinidad and tobago":"tt",
      "guatemala":"gt",
      "senegal":"sn","morocco":"ma","marokko":"ma","nigeria":"ng","cameroon":"cm","kamerun":"cm",
      "ghana":"gh","egypt":"eg","ägypten":"eg","algeria":"dz","algerien":"dz","tunisia":"tn",
      "tunesien":"tn","ivory coast":"ci","cote d'ivoire":"ci","elfenbeinküste":"ci","mali":"ml",
      "south africa":"za","südafrika":"za","cape verde":"cv","kap verde":"cv",
      "dr congo":"cd","dr kongo":"cd","congo dr":"cd",
      "japan":"jp","south korea":"kr","korea republic":"kr","südkorea":"kr","iran":"ir",
      "saudi arabia":"sa","saudi-arabien":"sa","australia":"au","australien":"au","qatar":"qa",
      "katar":"qa","iraq":"iq","irak":"iq","uzbekistan":"uz","usbekistan":"uz","jordan":"jo",
      "jordanien":"jo","new zealand":"nz","neuseeland":"nz","china":"cn","china pr":"cn"
    };

    // ====== Status ============================================================
    let allMatches = [], standingsRows = [], teamGroup = {};
    let currentFilter = "all", searchTerm = "";
    const $list = document.getElementById("list"), $status = document.getElementById("status");
    const $updated = document.getElementById("updated"), $search = document.getElementById("search");

    // ====== Helpers ===========================================================
    async function fetchJSON(url, tries = 2) {
      for (let i = 0; i < tries; i++) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          return await res.json();
        } catch (err) { if (i === tries - 1) throw err; await new Promise(r => setTimeout(r, 800 * (i + 1))); }
      }
    }
    const pad = n => String(n).padStart(2, "0");
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const isLiveStatus = s => s ? /^(1h|2h|ht|et|live|in play|\d{1,3}'?)$/i.test(s.trim()) : false;

    function isoFor(code, name) {
      if (code && FIFA2ISO[code.toUpperCase()]) return FIFA2ISO[code.toUpperCase()];
      if (name && NAME2ISO[name.trim().toLowerCase()]) return NAME2ISO[name.trim().toLowerCase()];
      return "";
    }
    function flagUrl(code, name) {
      const iso = isoFor(code, name);
      return iso ? `https://flagcdn.com/w40/${iso}.png` : "";
    }
    function parseGroup(raw) {
      if (raw == null) return null;
      const str = typeof raw === "object" ? (raw.name || raw.key || "") : String(raw);
      let m = str.match(/\b([A-L])\b/i); if (m) return m[1].toUpperCase();
      if (/^\d+$/.test(str.trim())) { const n = +str; if (n >= 1 && n <= 12) return String.fromCharCode(64 + n); }
      return null;
    }
    function detectStage(text) {
      const s = String(text || "").toLowerCase();
      if (/third|3rd|platz 3|play.?off f/.test(s)) return "Spiel um Platz 3";
      if (/\bfinal\b|finale/.test(s) && !/semi|quarter|halb|viertel/.test(s)) return "Finale";
      if (/semi|halbfinale/.test(s)) return "Halbfinale";
      if (/quarter|viertelfinale/.test(s)) return "Viertelfinale";
      if (/round of 16|last 16|achtelfinale/.test(s)) return "Achtelfinale";
      if (/round of 32|sechzehntel/.test(s)) return "Sechzehntelfinale";
      return null;
    }

    // ====== openfootball (WM) parsen =========================================
    const teamName = t => typeof t === "string" ? t : (t?.name || t?.key || "");
    const teamCode = t => typeof t === "object" ? (t.code || t.fifa || "") : "";

    // Anstoßzeit inkl. Zeitzone parsen, z. B. "13:00 UTC-6" oder "19:00"
    function parseKickoff(dateStr, timeStr) {
      if (!dateStr) return null;
      if (!timeStr) return new Date(`${dateStr}T00:00:00`);
      const m = String(timeStr).match(/(\d{1,2}):(\d{2})\s*(?:UTC\s*([+-]\d{1,2})(?::?(\d{2}))?)?/i);
      if (!m) return new Date(`${dateStr}T00:00:00`);
      const hh = m[1].padStart(2, "0"), mm = m[2];
      if (m[3] != null) {
        const sign = m[3][0];
        const oh = String(Math.abs(parseInt(m[3], 10))).padStart(2, "0");
        const om = (m[4] || "00").padStart(2, "0");
        return new Date(`${dateStr}T${hh}:${mm}:00${sign}${oh}:${om}`);
      }
      return new Date(`${dateStr}T${hh}:${mm}:00`);
    }

    function parseOpenFootball(data) {
      // Spiele flach sammeln (Format mit "matches" ODER "rounds[].matches")
      let list = [];
      if (Array.isArray(data.matches)) list = data.matches.map(m => ({ ...m }));
      else if (Array.isArray(data.rounds))
        list = data.rounds.flatMap(r => (r.matches || []).map(m => ({ ...m, round: m.round || r.name })));
      else return [];

      return list.map((m, i) => {
        const group = parseGroup(m.group);
        const stage = group ? null : detectStage(m.round || m.group);
        const h = teamName(m.team1), a = teamName(m.team2);
        const hc = teamCode(m.team1), ac = teamCode(m.team2);
        // Score: {ft:[a,b]} ODER score1/score2
        let hs = null, as = null;
        if (m.score && Array.isArray(m.score.ft)) { hs = m.score.ft[0]; as = m.score.ft[1]; }
        else if (m.score1 != null && m.score2 != null) { hs = m.score1; as = m.score2; }
        const date = parseKickoff(m.date, m.time);
        const finished = hs != null && as != null;
        const norm = arr => (Array.isArray(arr) ? arr : []).map(g => ({
          name: g.name || g.player || "", minute: g.minute ?? g.offset ?? null,
          penalty: !!g.penalty, owngoal: !!(g.owngoal || g.og), assist: g.assist || null,
        }));
        return {
          id: "of-" + (m.num ?? `${m.date}-${h}-${a}-${i}`), name: `${h} – ${a}`,
          home: h, away: a, homeBadge: flagUrl(hc, h), awayBadge: flagUrl(ac, a),
          homeScore: hs, awayScore: as, date,
          htScore: (m.score && Array.isArray(m.score.ht)) ? m.score.ht : null,
          homeGoals: norm(m.goals1), awayGoals: norm(m.goals2),
          venue: (m.ground || m.stadium?.name || m.city || ""),
          status: "", live: false, finished, kind: "wm", group, stage,
        };
      });
    }

    // ====== TheSportsDB parsen ===============================================
    function normalizeTSDB(ev, kind) {
      const ts = ev.strTimestamp ? new Date(ev.strTimestamp.replace(" ", "T") + "Z")
               : ev.dateEvent ? new Date(ev.dateEvent + "T" + (ev.strTime || "00:00:00") + "Z") : null;
      const status = (ev.strStatus || "").trim();
      const live = isLiveStatus(status);
      const finished = /finish|ft|aet|full|after|pen/i.test(status) ||
        (ev.intHomeScore != null && ev.intAwayScore != null && !live && ts && ts < new Date());
      const home = (ev.strHomeTeam || "").trim(), away = (ev.strAwayTeam || "").trim();
      return {
        id: ev.idEvent, name: ev.strEvent, home, away,
        homeBadge: flagUrl("", home) || ev.strHomeTeamBadge || "",
        awayBadge: flagUrl("", away) || ev.strAwayTeamBadge || "",
        homeScore: ev.intHomeScore, awayScore: ev.intAwayScore,
        date: ts, venue: ev.strVenue || "", status, live, finished,
        kind, group: kind === "wm" ? parseGroup(ev.strGroup) : null,
        stage: kind === "wm" ? detectStage(ev.strGroup || ev.strEvent) : null,
      };
    }

    const inWindow = m => m.date && m.date >= WINDOW_START && m.date <= WINDOW_END;

    // ====== Laden =============================================================
    async function loadWM() {
      for (const url of WM_SOURCES) {
        try {
          const data = await fetchJSON(url, 1);
          const parsed = parseOpenFootball(data);
          if (parsed.length) return parsed;
        } catch { /* nächste Quelle */ }
      }
      // Fallback: TheSportsDB
      try {
        const out = [];
        for (const u of [`${TSDB}/eventsseason.php?id=${WM_LEAGUE_TSDB}&s=2026`,
                         `${TSDB}/eventsnextleague.php?id=${WM_LEAGUE_TSDB}`,
                         `${TSDB}/eventspastleague.php?id=${WM_LEAGUE_TSDB}`]) {
          try { const d = await fetchJSON(u, 1); (d.events || []).forEach(e => out.push(normalizeTSDB(e, "wm"))); } catch {}
        }
        return out;
      } catch { return []; }
    }

    async function loadTests() {
      const out = [];
      for (const u of [`${TSDB}/eventsseason.php?id=${TEST_LEAGUE}&s=${TEST_SEASON}`,
                       `${TSDB}/eventsnextleague.php?id=${TEST_LEAGUE}`,
                       `${TSDB}/eventspastleague.php?id=${TEST_LEAGUE}`]) {
        try { const d = await fetchJSON(u, 1); (d.events || []).forEach(e => out.push(normalizeTSDB(e, "test"))); } catch {}
      }
      return out;
    }

    async function loadAll() {
      try {
        const [wm, tests] = await Promise.all([loadWM(), loadTests()]);
        let merged = wm.concat(tests);
        if (!merged.length) throw new Error("Keine Daten verfügbar");

        // Fenster + Dubletten + Sortierung (WM ohne Datum trotzdem behalten)
        merged = merged.filter(m => m.kind === "wm" ? (!m.date || inWindow(m)) : inWindow(m));
        const seen = new Set();
        merged = merged.filter(m => m.id && !seen.has(m.id) && seen.add(m.id));
        merged.sort((a, b) => (a.date?.getTime() || Infinity) - (b.date?.getTime() || Infinity));

        // Gruppen-Zuordnung
        const map = {};
        for (const m of merged) if (m.kind === "wm" && m.group) { map[m.home] = m.group; map[m.away] = m.group; }
        for (const m of merged) if (m.kind === "wm" && !m.group && !m.stage)
          m.group = map[m.home] || map[m.away] || null;

        allMatches = merged; teamGroup = map;
        localStorage.setItem(CACHE_KEY, JSON.stringify(
          merged.map(s => ({ ...s, date: s.date ? s.date.toISOString() : null }))));
        render(); setUpdated();
        const wmCount = merged.filter(m => m.kind === "wm").length;
        $status.textContent = `${merged.length} SPIELE · ${wmCount} WM`;
      } catch (err) {
        const c = loadCache();
        if (c) { allMatches = c; render(); $status.textContent = "OFFLINE · CACHE"; }
        else { $list.innerHTML = `<div class="error">⚠️ Spiele konnten nicht geladen werden.<br>
          (${esc(err.message)})</div>`; $status.textContent = "FEHLER"; }
      }
    }
    function loadCache() {
      try {
        const raw = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        return raw ? raw.map(m => ({ ...m, date: m.date ? new Date(m.date) : null })) : null;
      } catch { return null; }
    }

    // ====== Gruppentabellen ===================================================
    function computeGroups() {
      const groups = {};
      const ensure = (g, name, badge) => {
        groups[g] = groups[g] || {};
        groups[g][name] = groups[g][name] ||
          { team: name, badge: badge || "", p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[] };
        if (badge && !groups[g][name].badge) groups[g][name].badge = badge;
        return groups[g][name];
      };
      for (const m of allMatches) if (m.kind === "wm" && m.group) {
        ensure(m.group, m.home, m.homeBadge); ensure(m.group, m.away, m.awayBadge);
      }
      const finished = allMatches.filter(m => m.kind === "wm" && m.group && m.finished
        && m.homeScore != null && m.awayScore != null)
        .sort((a, b) => (a.date?.getTime() || 0) - (b.date?.getTime() || 0));
      for (const m of finished) {
        const h = ensure(m.group, m.home, m.homeBadge), a = ensure(m.group, m.away, m.awayBadge);
        const hs = +m.homeScore, as = +m.awayScore;
        h.p++; a.p++; h.gf += hs; h.ga += as; a.gf += as; a.ga += hs;
        if (hs > as) { h.w++; a.l++; h.pts += 3; h.form.push("w"); a.form.push("l"); }
        else if (hs < as) { a.w++; h.l++; a.pts += 3; a.form.push("w"); h.form.push("l"); }
        else { h.d++; a.d++; h.pts++; a.pts++; h.form.push("d"); a.form.push("d"); }
      }
      const out = {};
      for (const g of Object.keys(groups).sort())
        out[g] = Object.values(groups[g]).sort((x, y) =>
          y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || x.team.localeCompare(y.team));
      return out;
    }

    // ====== Torschützenliste ==================================================
    function computeScorers() {
      const map = {}; // "name|team" -> stat
      const add = (g, team, badge) => {
        if (!g.name || g.owngoal) return; // Eigentore zählen nicht für den Schützen
        const key = g.name + "|" + team;
        const s = map[key] || (map[key] = { name: g.name, team, badge, goals: 0, pens: 0, assists: 0 });
        s.goals++; if (g.penalty) s.pens++;
      };
      const addAssist = (g, team, badge) => {
        if (!g.assist) return;
        const key = g.assist + "|" + team;
        const s = map[key] || (map[key] = { name: g.assist, team, badge, goals: 0, pens: 0, assists: 0 });
        s.assists++;
      };
      for (const m of allMatches) {
        if (m.kind !== "wm") continue;
        (m.homeGoals || []).forEach(g => { add(g, m.home, m.homeBadge); addAssist(g, m.home, m.homeBadge); });
        (m.awayGoals || []).forEach(g => { add(g, m.away, m.awayBadge); addAssist(g, m.away, m.awayBadge); });
      }
      return Object.values(map).sort((a, b) =>
        b.goals - a.goals || b.assists - a.assists || a.name.localeCompare(b.name));
    }

    function renderScorers() {
      let list = computeScorers();
      if (searchTerm) list = list.filter(s =>
        s.name.toLowerCase().includes(searchTerm) || s.team.toLowerCase().includes(searchTerm));
      const anyAssist = list.some(s => s.assists > 0);
      if (!list.length) {
        $list.innerHTML = `<div class="empty">Noch keine Tore.<br>
          Die Torschützenliste füllt sich automatisch, sobald gespielt wird.</div>`;
        return;
      }
      const rows = list.slice(0, 100).map((s, i) => `
        <tr>
          <td><span class="rankcell">${i + 1}</span></td>
          <td class="t"><span class="team-cell">${flag(s.badge)}<span>${esc(s.name)}${isFav(s.team) ? ' <span class="fav-star">★</span>' : ""}</span></span></td>
          <td class="t" style="color:var(--muted)">${esc(s.team)}</td>
          <td class="g">${s.goals}</td>
          <td>${s.pens || ""}</td>
          <td>${anyAssist ? (s.assists || "") : "–"}</td>
        </tr>`).join("");
      $list.innerHTML = `<div class="scorers"><table class="scorers-tbl">
        <thead><tr><th></th><th class="t">Spieler</th><th class="t">Team</th>
          <th>Tore</th><th>11m</th><th>Vorlagen</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
        ${anyAssist ? "" : `<div class="legend" style="margin-top:12px">Vorlagen sind in der freien Datenquelle nicht enthalten (Spalte bleibt leer).</div>`}`;
    }

    // ====== Rendering =========================================================
    const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli",
                    "August","September","Oktober","November","Dezember"];
    const WEEKDAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];

    function render() {
      if (currentFilter === "groups") return renderGroups();
      if (currentFilter === "scorers") return renderScorers();
      const matches = allMatches.filter(applyFilter);
      if (!matches.length) { $list.innerHTML = `<div class="empty">Keine Spiele für diese Auswahl.</div>`; return; }
      let html = "", lastMonth = "";
      for (const m of matches) {
        const monthKey = m.date ? `${MONTHS[m.date.getMonth()]} ${m.date.getFullYear()}` : "Termin offen";
        if (monthKey !== lastMonth) { html += `<div class="month-head">${monthKey}</div>`; lastMonth = monthKey; }
        html += renderMatch(m);
      }
      $list.innerHTML = html;
    }
    function applyFilter(m) {
      if (searchTerm) {
        const hay = `${m.home} ${m.away} ${m.group ? "gruppe " + m.group : ""}`.toLowerCase();
        if (!hay.includes(searchTerm)) return false;
      }
      switch (currentFilter) {
        case "wm":       return m.kind === "wm";
        case "test":     return m.kind === "test";
        case "live":     return m.live;
        case "upcoming": return !m.finished && !m.live && m.date && m.date >= new Date();
        default:         return true;
      }
    }
    function flag(url) {
      return url
        ? `<img class="flag" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;flag-fallback&quot;></span>'">`
        : `<span class="flag-fallback"></span>`;
    }
    function renderMatch(m) {
      const d = m.date;
      const when = d
        ? `<div class="day">${d.getDate()}</div>${WEEKDAYS[d.getDay()]}<br>${pad(d.getHours())}:${pad(d.getMinutes())}`
        : `<div class="day">?</div>offen`;
      const hasScore = m.homeScore != null && m.awayScore != null;
      const homeWin = hasScore && +m.homeScore > +m.awayScore;
      const awayWin = hasScore && +m.awayScore > +m.homeScore;
      const result = m.live
        ? `<div class="score">${m.homeScore ?? 0}:${m.awayScore ?? 0}</div><span class="tag live">● ${esc(m.status) || "LIVE"}</span>`
        : (m.finished && hasScore)
          ? `<div class="score">${m.homeScore}:${m.awayScore}</div><span class="tag ft">Beendet</span>`
          : `<div class="vs">VS</div>`;
      let kindTag;
      if (m.kind === "wm" && m.group) kindTag = `<span class="tag grp">Gruppe ${m.group}</span>`;
      else if (m.kind === "wm")       kindTag = `<span class="tag ko">${esc(m.stage) || "K.-o.-Phase"}</span>`;
      else                            kindTag = `<span class="tag test">Testspiel</span>`;
      const favH = isFav(m.home), favA = isFav(m.away);
      const star = `<span class="fav-star" title="Deutschland">★</span>`;
      const cls = `match ${m.kind === "wm" ? "is-wm" : ""} ${m.live ? "is-live" : ""} ${favH || favA ? "is-fav" : ""}`;
      return `
        <div class="${cls}" data-id="${esc(m.id)}" role="button" tabindex="0">
          <div class="when">${when}</div>
          <div class="teams">
            <div class="team ${homeWin ? "winner" : ""}">${flag(m.homeBadge)}<span>${esc(m.home)}</span>${favH ? star : ""}</div>
            <div class="team ${awayWin ? "winner" : ""}">${flag(m.awayBadge)}<span>${esc(m.away)}</span>${favA ? star : ""}</div>
            <div class="meta">${kindTag}${m.venue ? `<span>📍 ${esc(m.venue)}</span>` : ""}</div>
          </div>
          <div class="result">${result}</div>
          <span class="chevron">›</span>
        </div>`;
    }
    function renderGroups() {
      const groups = computeGroups();
      let keys = Object.keys(groups);
      if (searchTerm) keys = keys.filter(g => `gruppe ${g}`.includes(searchTerm) ||
        groups[g].some(t => t.team.toLowerCase().includes(searchTerm)));
      if (!keys.length) {
        $list.innerHTML = `<div class="empty">Gruppentabellen sind noch nicht verfügbar.<br>
          Sobald Gruppenspiele in den Daten stehen, erscheinen sie hier automatisch.</div>`; return;
      }
      let html = `<div class="legend">Je Gruppe ziehen die <b>ersten beiden</b> ins Sechzehntelfinale ein (zzgl. der acht besten Gruppendritten).</div><div class="groups-grid">`;
      for (const g of keys) {
        const rows = groups[g].map((t, i) => {
          const form = t.form.slice(-5).map(r =>
            `<span class="${r}">${r === "w" ? "S" : r === "d" ? "U" : "N"}</span>`).join("");
          return `<tr class="${i < 2 ? "qualified" : ""} ${isFav(t.team) ? "is-fav" : ""}">
            <td><span class="rankcell">${i + 1}</span></td>
            <td class="t"><span class="team-cell">${flag(t.badge)}<span>${esc(t.team)}${isFav(t.team) ? ' <span class="fav-star">★</span>' : ""}</span></span></td>
            <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
            <td>${t.gf}:${t.ga}</td><td>${t.gf - t.ga > 0 ? "+" : ""}${t.gf - t.ga}</td>
            <td class="pts">${t.pts}</td><td><span class="form">${form}</span></td>
          </tr>`;
        }).join("");
        html += `<div class="group-card"><div class="group-title">🏅 Gruppe ${g}</div>
          <table class="standings"><thead><tr>
            <th></th><th class="t">Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th>
            <th>Tore</th><th>Diff</th><th>Pkt</th><th>Form</th>
          </tr></thead><tbody>${rows}</tbody></table></div>`;
      }
      $list.innerHTML = html + `</div>`;
    }
    function setUpdated() {
      const n = new Date();
      $updated.textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
    }

    // ====== Spiel-Detail (Modal) =============================================
    const $modal = document.getElementById("modal");
    const $modalBody = document.getElementById("modal-body");

    function fullDate(d) {
      if (!d) return "Termin offen";
      return `${WEEKDAYS[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())} Uhr`;
    }
    function goalLine(g) {
      const notes = [];
      if (g.penalty) notes.push("Elfmeter");
      if (g.owngoal) notes.push("Eigentor");
      const note = notes.length ? ` <span class="gnote">(${notes.join(", ")})</span>` : "";
      const min = g.minute != null ? `<span class="min">${g.minute}'</span> ` : "";
      return `<div class="goal">⚽ ${min}${esc(g.name)}${note}</div>`;
    }

    function openMatch(id) {
      const m = allMatches.find(x => String(x.id) === String(id));
      if (!m) return;
      const hasScore = m.homeScore != null && m.awayScore != null;
      const phase = m.kind !== "wm" ? "Testspiel"
        : m.group ? `Gruppe ${m.group}` : (m.stage || "K.-o.-Phase");
      const hg = m.homeGoals || [], ag = m.awayGoals || [];
      const hasGoals = hg.length || ag.length;

      const scoreBlock = hasScore
        ? `<div class="md-result">${m.homeScore} : ${m.awayScore}</div>`
        : `<div class="md-result" style="font-size:1.4rem;color:var(--muted)">${m.date && m.date > new Date() ? "Anstoß " + pad(m.date.getHours()) + ":" + pad(m.date.getMinutes()) : "VS"}</div>`;
      const ht = (m.htScore && hasScore) ? `<div class="md-ht">Halbzeit: ${m.htScore[0]}:${m.htScore[1]}</div>` : "";

      const goalsBlock = hasGoals ? `
        <div class="md-h">Tore</div>
        <div class="goals">
          <div class="side home">${hg.map(goalLine).join("") || '<span class="gnote">–</span>'}</div>
          <div class="side away">${ag.map(goalLine).join("") || '<span class="gnote">–</span>'}</div>
        </div>` : (hasScore ? `<div class="md-h">Tore</div><div class="gnote">Keine Torschützen-Daten.</div>` : "");

      const facts = `
        <div class="md-h">Fakten</div>
        <div class="facts">
          <div class="k">Wettbewerb</div><div class="v">${m.kind === "wm" ? "WM 2026" : "Länderspiel"}</div>
          <div class="k">Phase</div><div class="v">${esc(phase)}</div>
          <div class="k">Anstoß</div><div class="v">${fullDate(m.date)}</div>
          <div class="k">Ort</div><div class="v">${esc(m.venue) || "–"}</div>
          ${hasScore ? `<div class="k">Endstand</div><div class="v">${m.homeScore}:${m.awayScore}</div>` : ""}
          ${ht ? `<div class="k">Halbzeit</div><div class="v">${m.htScore[0]}:${m.htScore[1]}</div>` : ""}
        </div>`;

      const note = `<div class="md-h">Aufstellung &amp; Statistik</div>
        <div class="md-note">⚠️ <b>Startelf</b>, <b>Vorlagen</b> und Detail-Statistiken (Ballbesitz, Schüsse)
        sind in der kostenlosen, gemeinfreien Datenquelle nicht enthalten und werden daher nicht angezeigt.</div>`;

      $modalBody.innerHTML = `
        <div class="md-stage">${esc(phase)}</div>
        <div class="md-meta">${fullDate(m.date)}${m.venue ? " · " + esc(m.venue) : ""}</div>
        <div class="md-score">
          <div class="md-team">${flag(m.homeBadge)}<span>${esc(m.home)}</span></div>
          ${scoreBlock}
          <div class="md-team">${flag(m.awayBadge)}<span>${esc(m.away)}</span></div>
        </div>
        ${ht}
        ${goalsBlock}
        ${facts}
        ${note}`;
      $modal.hidden = false;
      document.body.style.overflow = "hidden";
    }
    function closeModal() { $modal.hidden = true; document.body.style.overflow = ""; }
    $modal.addEventListener("click", e => { if (e.target.hasAttribute("data-close")) closeModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !$modal.hidden) closeModal(); });

    // ====== Sterne (Deko) =====================================================
    (function () {
      const c = document.getElementById("stars");
      for (let i = 0; i < 50; i++) {
        const s = document.createElement("div"); s.className = "spark";
        const sz = Math.random() * 2 + 1;
        s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;
        c.appendChild(s);
      }
    })();

    // ====== Events ============================================================
    document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
      document.querySelector(".tab.active")?.classList.remove("active");
      tab.classList.add("active"); currentFilter = tab.dataset.filter; render();
    }));
    let searchTimer;
    $search.addEventListener("input", e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { searchTerm = e.target.value.trim().toLowerCase(); render(); }, 200);
    });
    // Klick/Tastatur auf eine Spielkarte -> Detailansicht (Delegation)
    $list.addEventListener("click", e => {
      const card = e.target.closest(".match[data-id]");
      if (card) openMatch(card.dataset.id);
    });
    $list.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const card = e.target.closest(".match[data-id]");
      if (card) { e.preventDefault(); openMatch(card.dataset.id); }
    });

    // ====== Start & Auto-Refresh =============================================
    loadAll();
    setInterval(loadAll, REFRESH_MS);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll(); });

    // ====== PWA: Service Worker registrieren =================================
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => { /* offline egal */ });
      });
    }
  </script>
</body>
</html>
