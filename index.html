  <style>
    :root {
      --bg: #0F1115;
      --card: #171A21;
      --card-2: #1E2129;
      --line: rgba(255, 255, 255, 0.07);
      --line-bright: rgba(255, 255, 255, 0.15);
      --text: #FFFFFF;
      --muted: #A0A7B5;
      --muted-2: #6B7280;
      --silver-2: #E8ECF4;
      --silver-3: #C2C8D4;
      --gold: #D8B964;
      --gold-soft: #F0D68F;
      --live: #FF4D5E;
      --green: #34D399;
      --accent: #3B82F6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      padding: 0 16px 88px; overflow-x: hidden;
    }

    .wrap { max-width: 680px; margin: 0 auto; position: relative; }

    /* ===== App Header ===== */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0 14px; gap: 12px;
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      width: 44px; height: 44px; flex-shrink: 0;
      background: var(--card-2);
      border: 1px solid rgba(216,185,100,0.25);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
    }
    .header-text { display: flex; flex-direction: column; gap: 3px; }
    .header-title {
      font-family: "Cinzel", serif; font-size: 1.2rem; font-weight: 900;
      letter-spacing: 1px; line-height: 1; color: var(--text);
    }
    .header-phase {
      font-size: 0.67rem; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--muted);
      display: flex; align-items: center; gap: 5px;
    }
    .header-phase-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--green);
      animation: pulse 1.8s infinite; flex-shrink: 0;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card);
      color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.18s, color 0.18s;
    }
    .icon-btn:hover { border-color: var(--line-bright); color: var(--text); }
    .icon-btn.active { border-color: var(--gold); color: var(--gold-soft); }

    /* ===== Search bar (collapsible) ===== */
    .search-wrap {
      overflow: hidden; max-height: 0;
      transition: max-height 0.22s ease, opacity 0.22s ease;
      opacity: 0;
    }
    .search-wrap.open { max-height: 60px; opacity: 1; }
    .search-input {
      width: 100%; background: var(--card); border: 1px solid var(--line-bright);
      color: var(--text); padding: 12px 16px; border-radius: 16px;
      font-size: 0.95rem; font-family: "Inter", sans-serif;
      margin-bottom: 12px;
    }
    .search-input:focus { outline: none; border-color: var(--gold); }
    .search-input::placeholder { color: var(--muted-2); }

    /* ===== Filter tabs (horizontal scroll) ===== */
    .filter-tabs {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding-bottom: 14px; -ms-overflow-style: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; background: var(--card); border: 1px solid var(--line);
      color: var(--muted); padding: 8px 16px; border-radius: 999px;
      cursor: pointer; font-family: "Inter", sans-serif; font-weight: 600;
      font-size: 0.82rem; white-space: nowrap; transition: all 0.15s;
    }
    .tab:hover { color: var(--text); border-color: var(--line-bright); }
    .tab.active {
      color: var(--bg); border-color: transparent; font-weight: 700;
      background: var(--text);
    }

    /* ===== Section headers ===== */
    .section-head {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted);
      margin: 24px 0 10px;
    }
    .section-head::after {
      content: ""; flex: 1; height: 1px; background: var(--line);
    }
    .section-head.live { color: var(--live); }
    .section-head.upcoming { color: var(--silver-2); }
    .section-head.finished { color: var(--muted-2); }
    .sh-live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--live); animation: pulse 1.4s infinite; flex-shrink: 0;
    }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }

    /* ===== Live Match Card (score-first design) ===== */
    .match-live {
      position: relative; cursor: pointer; overflow: hidden;
      background: var(--card);
      border: 1px solid rgba(255,77,94,0.22); border-radius: 20px;
      padding: 16px 16px 14px; margin-bottom: 10px;
      transition: transform 0.2s;
    }
    .match-live::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--live); border-radius: 3px 0 0 3px;
    }
    .match-live:hover { transform: translateY(-2px); }

    .mlc-topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .mlc-phase {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--muted);
    }
    .mlc-status-pill {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.8px;
      color: var(--live); text-transform: uppercase;
    }
    .mlc-pulse {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--live); animation: pulse 1.2s infinite;
    }

    .mlc-body {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 12px;
    }
    .mlc-team {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .mlc-flag {
      width: 44px; height: 30px; object-fit: cover; border-radius: 6px;
    }
    .mlc-flag-fb {
      width: 44px; height: 30px; border-radius: 6px; background: var(--card-2);
    }
    .mlc-name {
      font-size: 0.82rem; font-weight: 600; color: var(--text);
      max-width: 90px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; text-align: center;
    }

    .mlc-score-block {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .mlc-score {
      font-family: "Cinzel", serif; font-size: 3.4rem; font-weight: 900;
      color: var(--text); letter-spacing: 4px; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .mlc-minute {
      font-size: 0.68rem; font-weight: 700; color: var(--live);
      letter-spacing: 0.5px;
    }

    .mlc-last-event {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 0.75rem; color: var(--muted);
      text-align: center; min-height: 22px;
    }

    /* ===== Upcoming/Finished match card ===== */
    .month-head {
      margin: 16px 0 8px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase; color: var(--muted-2);
    }

    .match {
      position: relative; background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 14px 16px; margin-bottom: 8px;
      display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center;
      transition: transform 0.18s; overflow: hidden; cursor: pointer;
    }
    .match::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--line-bright); border-radius: 3px 0 0 3px; }
    .match.is-wm::before { background: var(--gold); opacity: 0.6; }
    .match.is-live::before { background: var(--live); }
    .match:hover { transform: translateY(-1px); }
    .match.is-fav { border-color: rgba(216,185,100,0.22); }
    .match.is-fav::before { background: linear-gradient(var(--gold-soft), var(--gold)); opacity: 1; }
    .fav-star { color: var(--gold-soft); margin-left: 4px; }
    tr.is-fav td { background: rgba(216,185,100,0.06); }
    tr.is-fav td.t { color: var(--text); }

    .when { text-align: center; font-size: 0.7rem; color: var(--muted);
      line-height: 1.5; font-weight: 500; }
    .when .day { font-size: 1.35rem; font-weight: 700; color: var(--text); line-height: 1.1; }

    .teams { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .team { display: flex; align-items: center; gap: 9px; font-size: 0.97rem; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .team.winner { font-weight: 700; }
    .flag { width: 24px; height: 17px; object-fit: cover; border-radius: 3px; flex-shrink: 0; }
    .flag-fallback { width: 24px; height: 17px; border-radius: 3px; flex-shrink: 0;
      background: var(--card-2); }
    .meta { font-size: 0.7rem; color: var(--muted); margin-top: 2px;
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-weight: 500; }

    .result { text-align: right; min-width: 62px; }
    .score { font-family: "Cinzel", serif; font-size: 1.4rem; font-weight: 700;
      letter-spacing: 1px; font-variant-numeric: tabular-nums; color: var(--text); }
    .vs { color: var(--muted); font-size: 0.85rem; font-weight: 500; }
    .tag { display: inline-block; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.6px;
      padding: 3px 8px; border-radius: 6px; margin-top: 5px; text-transform: uppercase; }
    .tag.live { background: var(--live); color: #fff; animation: pulse 1.4s infinite; }
    .tag.ft { background: var(--card-2); color: var(--muted-2); }
    .tag.grp { background: rgba(216,185,100,0.12); color: var(--gold-soft); border: 1px solid rgba(216,185,100,0.3); }
    .tag.ko { background: rgba(255,255,255,0.06); color: var(--silver-2); border: 1px solid var(--line-bright); }
    .tag.test { background: rgba(52,211,153,0.1); color: var(--green); border: 1px solid rgba(52,211,153,0.25); }

    .match .chevron { position: absolute; right: 12px; bottom: 12px; color: var(--muted-2);
      font-size: 0.85rem; opacity: 0.5; transition: opacity .2s, transform .2s; }
    .match:hover .chevron { opacity: 1; transform: translateX(2px); }

    /* ===== Gruppentabellen ===== */
    .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    .group-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 16px;
    }
    .group-title { font-family: "Cinzel", serif; font-size: 0.95rem; font-weight: 700;
      letter-spacing: 1.5px; color: var(--gold-soft); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px; }
    table.standings { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.standings th { color: var(--muted-2); font-weight: 600; font-size: 0.65rem;
      text-transform: uppercase; letter-spacing: 0.5px; text-align: center; padding: 4px 3px; }
    table.standings th.t { text-align: left; }
    table.standings td { padding: 8px 3px; text-align: center; border-top: 1px solid var(--line);
      font-variant-numeric: tabular-nums; color: var(--text); }
    table.standings td.t { text-align: left; font-weight: 600; }
    table.standings td.pts { font-weight: 700; color: var(--text); }
    .rankcell { display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 6px; font-size: 0.7rem; font-weight: 700;
      background: var(--card-2); color: var(--muted); margin-right: 6px; }
    tr.qualified .rankcell { background: rgba(216,185,100,0.18); color: var(--gold-soft); }
    .team-cell { display: inline-flex; align-items: center; gap: 7px; }
    .team-cell .flag, .team-cell .flag-fallback { width: 20px; height: 14px; }
    .form { display: inline-flex; gap: 3px; }
    .form span { width: 15px; height: 15px; border-radius: 3px; font-size: 0.58rem;
      display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #0c0d10; }
    .form .w { background: var(--green); }
    .form .d { background: var(--gold); }
    .form .l { background: var(--live); color: #fff; }
    .legend { text-align: center; color: var(--muted-2); font-size: 0.78rem; margin: 6px 0 16px; }
    .legend b { color: var(--gold-soft); }

    .empty, .loading, .error { text-align: center; color: var(--muted);
      padding: 56px 16px; font-size: 1rem; font-weight: 500; }
    .error { color: #ffa0a0; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 16px; border: 3px solid var(--line);
      border-top-color: var(--text); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { text-align: center; color: var(--muted-2); font-size: 0.75rem; margin-top: 40px; font-weight: 500; line-height: 1.7; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    /* ===== Fixed Bottom Navigation ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: var(--card); border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-around;
      padding: 10px 0 max(10px, env(safe-area-inset-bottom));
    }
    .bnav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; padding: 4px 12px; border-radius: 12px;
      background: none; border: none; color: var(--muted-2);
      transition: color 0.15s; font-family: "Inter", sans-serif;
      min-width: 56px;
    }
    .bnav-item:hover, .bnav-item.active { color: var(--text); }
    .bnav-item.active .bnav-icon { color: var(--text); }
    .bnav-icon { font-size: 1.35rem; line-height: 1; }
    .bnav-label { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.3px; }

    /* ===== Torschützenliste ===== */
    .scorers { background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 8px 16px 12px; }
    table.scorers-tbl { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    table.scorers-tbl th { color: var(--muted-2); font-weight: 600; font-size: 0.65rem;
      text-transform: uppercase; letter-spacing: 0.5px; text-align: center; padding: 8px 4px; }
    table.scorers-tbl th.t { text-align: left; }
    table.scorers-tbl td { padding: 9px 4px; text-align: center; border-top: 1px solid var(--line);
      font-variant-numeric: tabular-nums; color: var(--text); }
    table.scorers-tbl td.t { text-align: left; font-weight: 600; }
    table.scorers-tbl td.g { font-weight: 700; color: var(--text); font-size: 1.05rem; }

    /* ===== Modal ===== */
    .modal { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-end;
      justify-content: center; }
    .modal[hidden] { display: none; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.6);
      animation: fade .2s ease; }
    @keyframes fade { from { opacity: 0; } }
    .modal-card { position: relative; width: min(560px, 100%); max-height: 92vh; overflow-y: auto;
      background: var(--card); border: 1px solid var(--line-bright);
      border-radius: 20px 20px 0 0; padding: 22px 20px max(22px, env(safe-area-inset-bottom));
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
      animation: slideUp .22s cubic-bezier(.2,.8,.2,1); }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } }
    .modal-close { position: absolute; top: 14px; right: 16px; width: 32px; height: 32px;
      border-radius: 50%; border: 1px solid var(--line); background: var(--card-2); color: var(--muted);
      cursor: pointer; font-size: 0.85rem; }
    .modal-close:hover { color: var(--text); }

    .md-stage { text-align: center; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase;
      color: var(--gold-soft); font-weight: 700; }
    .md-meta { text-align: center; color: var(--muted); font-size: 0.82rem; margin-top: 4px; }
    .md-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
      margin: 18px 0 6px; }
    .md-team { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
    .md-team .flag, .md-team .flag-fallback { width: 56px; height: 38px; }
    .md-team span { font-weight: 600; font-size: 1.02rem; }
    .md-result { font-family: "Cinzel", serif; font-size: 2.2rem; font-weight: 700; color: var(--silver-2);
      text-align: center; font-variant-numeric: tabular-nums; }
    .md-ht { text-align: center; color: var(--muted); font-size: 0.8rem; margin-bottom: 14px; }
    .md-h { font-family: "Cinzel", serif; font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase;
      color: var(--silver-2); margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
    .md-h::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-bright), transparent); }
    .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
    .goals .side { display: flex; flex-direction: column; gap: 6px; }
    .goals .side.away { text-align: right; }
    .goal { font-size: 0.92rem; color: var(--text); }
    .goal .min { color: var(--gold-soft); font-weight: 700; font-variant-numeric: tabular-nums; }
    .goal .gnote { color: var(--muted); font-size: 0.78rem; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 0.9rem; }
    .facts .k { color: var(--muted); }
    .facts .v { font-weight: 600; text-align: right; }
    .md-note { background: var(--card-2); border: 1px solid var(--line);
      color: var(--muted); border-radius: 12px; padding: 10px 12px; font-size: 0.82rem; line-height: 1.5; }
    .md-note b { color: var(--gold-soft); }
    .gnote { color: var(--muted); font-size: 0.82rem; }

    .af-lineups { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .af-team-h { font-weight: 700; font-size: 0.92rem; margin-bottom: 8px; color: var(--silver-2); }
    .af-team-h .form-txt { color: var(--gold-soft); font-weight: 600; }
    ol.lineup { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    ol.lineup li { display: flex; align-items: center; gap: 7px; font-size: 0.85rem; }
    ol.lineup .num { display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; border-radius: 5px; background: rgba(200,208,224,0.12);
      font-size: 0.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    ol.lineup .pos { margin-left: auto; color: var(--muted); font-size: 0.72rem; }
    .af-subs { margin-top: 8px; font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
    .af-subs b { color: var(--silver-2); }
    .af-stats { display: flex; flex-direction: column; gap: 9px; }
    .stat-row { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px;
      font-size: 0.82rem; }
    .stat-row .sv { font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat-row .sv:last-child { text-align: right; }
    .stat-row .sl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
      color: var(--muted); text-align: center; }
    .stat-row .bar { height: 5px; border-radius: 3px; background: rgba(200,208,224,0.12); overflow: hidden;
      display: flex; }

    @media (prefers-reduced-motion: reduce) {

  <script>
    // ====== Konfiguration ======================================================
    const WM_SOURCES = [
      "https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json",
      "https://cdn.jsdelivr.net/gh/openfootball/worldcup.json@master/2026/worldcup.json",
    ];
    const ESPN_BASE = "https://site.api.espn.com/apis/site/v2/sports/soccer";
    const ESPN_LEAGUE = { wm: "fifa.world", test: "fifa.friendly" };

    const WINDOW_START = new Date("2026-05-15T00:00:00");
    const WINDOW_END   = new Date("2026-07-31T23:59:59");

    const REFRESH_MS = 60_000;
    const CACHE_KEY = "wm2026-cache-v3";

    const FAV_TEAM = "Germany";
    const isFav = name => name === FAV_TEAM;

    const FIFA2ISO = {
      USA:"us",CAN:"ca",MEX:"mx",
      GER:"de",FRA:"fr",ENG:"gb-eng",ESP:"es",POR:"pt",NED:"nl",BEL:"be",ITA:"it",CRO:"hr",
      SUI:"ch",SRB:"rs",DEN:"dk",POL:"pl",AUT:"at",UKR:"ua",SWE:"se",CZE:"cz",WAL:"gb-wls",
      SCO:"gb-sct",NOR:"no",TUR:"tr",GRE:"gr",HUN:"hu",ROU:"ro",SVK:"sk",SVN:"si",IRL:"ie",
      ISL:"is",FIN:"fi",ALB:"al",BIH:"ba",NIR:"gb-nir",RUS:"ru",
      BRA:"br",ARG:"ar",URU:"uy",COL:"co",CHI:"cl",PER:"pe",ECU:"ec",PAR:"py",VEN:"ve",BOL:"bo",
      CRC:"cr",JAM:"jm",PAN:"pa",HON:"hn",SLV:"sv",HAI:"ht",CUW:"cw",TRI:"tt",GUA:"gt",
      SEN:"sn",MAR:"ma",NGA:"ng",CMR:"cm",GHA:"gh",EGY:"eg",ALG:"dz",TUN:"tn",CIV:"ci",MLI:"ml",
      RSA:"za",COD:"cd",BFA:"bf",CPV:"cv",GAB:"ga",ANG:"ao",ZAM:"zm",GUI:"gn",
      JPN:"jp",KOR:"kr",IRN:"ir",KSA:"sa",AUS:"au",QAT:"qa",IRQ:"iq",UAE:"ae",UZB:"uz",CHN:"cn",
      JOR:"jo",OMA:"om",BHR:"bh",NZL:"nz",IDN:"id",PRK:"kp",THA:"th",VIE:"vn",IND:"in"
    };
    const NAME2ISO = {
      "usa":"us","united states":"us","vereinigte staaten":"us","canada":"ca","kanada":"ca",
      "mexico":"mx","mexiko":"mx","germany":"de","deutschland":"de","france":"fr","frankreich":"fr",
      "spain":"es","spanien":"es","portugal":"pt","netherlands":"nl","niederlande":"nl",
      "belgium":"be","belgien":"be","italy":"it","italien":"it","croatia":"hr","kroatien":"hr",
      "switzerland":"ch","schweiz":"ch","serbia":"rs","serbien":"rs","denmark":"dk","dänemark":"dk",
      "poland":"pl","polen":"pl","austria":"at","österreich":"at","ukraine":"ua","sweden":"se",
      "schweden":"se","czech republic":"cz","czechia":"cz","tschechien":"cz","wales":"gb-wls",
      "scotland":"gb-sct","schottland":"gb-sct","england":"gb-eng","norway":"no","norwegen":"no",
      "turkey":"tr","türkei":"tr","türkiye":"tr","greece":"gr","griechenland":"gr","hungary":"hu",
      "ungarn":"hu","romania":"ro","rumänien":"ro","slovakia":"sk","slowakei":"sk","slovenia":"si",
      "slowenien":"si","ireland":"ie","irland":"ie","iceland":"is","island":"is","finland":"fi",
      "finnland":"fi","albania":"al","albanien":"al","bosnia & herzegovina":"ba",
      "bosnia and herzegovina":"ba","bosnien":"ba",
      "brazil":"br","brasilien":"br","argentina":"ar","argentinien":"ar","uruguay":"uy",
      "colombia":"co","kolumbien":"co","chile":"cl","peru":"pe","ecuador":"ec","paraguay":"py",
      "venezuela":"ve","bolivia":"bo","bolivien":"bo",
      "costa rica":"cr","jamaica":"jm","jamaika":"jm","panama":"pa","honduras":"hn",
      "el salvador":"sv","haiti":"ht","curacao":"cw","curaçao":"cw","trinidad and tobago":"tt",
      "guatemala":"gt",
      "senegal":"sn","morocco":"ma","marokko":"ma","nigeria":"ng","cameroon":"cm","kamerun":"cm",
      "ghana":"gh","egypt":"eg","ägypten":"eg","algeria":"dz","algerien":"dz","tunisia":"tn",
      "tunesien":"tn","ivory coast":"ci","cote d'ivoire":"ci","elfenbeinküste":"ci","mali":"ml",
      "south africa":"za","südafrika":"za","cape verde":"cv","kap verde":"cv",
      "dr congo":"cd","dr kongo":"cd","congo dr":"cd",
      "japan":"jp","south korea":"kr","korea republic":"kr","südkorea":"kr","iran":"ir",
      "saudi arabia":"sa","saudi-arabien":"sa","australia":"au","australien":"au","qatar":"qa",
      "katar":"qa","iraq":"iq","irak":"iq","uzbekistan":"uz","usbekistan":"uz","jordan":"jo",
      "jordanien":"jo","new zealand":"nz","neuseeland":"nz","china":"cn","china pr":"cn"
    };

    // ====== Status ============================================================
    let allMatches = [], standingsRows = [], teamGroup = {};
    let currentFilter = "all", searchTerm = "";
    const $list = document.getElementById("list");
    const $updated = document.getElementById("updated"), $search = document.getElementById("search");
    const $currentPhase = document.getElementById("currentPhase");

    // ====== Helpers ===========================================================
    async function fetchJSON(url, tries = 2) {
      for (let i = 0; i < tries; i++) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          return await res.json();
        } catch (err) { if (i === tries - 1) throw err; await new Promise(r => setTimeout(r, 800 * (i + 1))); }
      }
    }
    const pad = n => String(n).padStart(2, "0");
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const isLiveStatus = s => s ? /^(1h|2h|ht|et|live|in play|\d{1,3}'?)$/i.test(s.trim()) : false;

    function isoFor(code, name) {
      if (code && FIFA2ISO[code.toUpperCase()]) return FIFA2ISO[code.toUpperCase()];
      if (name && NAME2ISO[name.trim().toLowerCase()]) return NAME2ISO[name.trim().toLowerCase()];
      return "";
    }
    function flagUrl(code, name) {
      const iso = isoFor(code, name);
      return iso ? `https://flagcdn.com/w40/${iso}.png` : "";
    }
    function parseGroup(raw) {
      if (raw == null) return null;
      const str = typeof raw === "object" ? (raw.name || raw.key || "") : String(raw);
      let m = str.match(/\b([A-L])\b/i); if (m) return m[1].toUpperCase();
      if (/^\d+$/.test(str.trim())) { const n = +str; if (n >= 1 && n <= 12) return String.fromCharCode(64 + n); }
      return null;
    }
    function detectStage(text) {
      const s = String(text || "").toLowerCase();
      if (/third|3rd|platz 3|play.?off f/.test(s)) return "Spiel um Platz 3";
      if (/\bfinal\b|finale/.test(s) && !/semi|quarter|halb|viertel/.test(s)) return "Finale";
      if (/semi|halbfinale/.test(s)) return "Halbfinale";
      if (/quarter|viertelfinale/.test(s)) return "Viertelfinale";
      if (/round of 16|last 16|achtelfinale/.test(s)) return "Achtelfinale";
      if (/round of 32|sechzehntel/.test(s)) return "Sechzehntelfinale";
      return null;
    }

    // ====== openfootball parsen ===============================================
    const teamName = t => typeof t === "string" ? t : (t?.name || t?.key || "");
    const teamCode = t => typeof t === "object" ? (t.code || t.fifa || "") : "";

    function parseKickoff(dateStr, timeStr) {
      if (!dateStr) return null;
      if (!timeStr) return new Date(`${dateStr}T00:00:00`);
      const m = String(timeStr).match(/(\d{1,2}):(\d{2})\s*(?:UTC\s*([+-]\d{1,2})(?::?(\d{2}))?)?/i);
      if (!m) return new Date(`${dateStr}T00:00:00`);
      const hh = m[1].padStart(2, "0"), mm = m[2];
      if (m[3] != null) {
        const sign = m[3][0];
        const oh = String(Math.abs(parseInt(m[3], 10))).padStart(2, "0");
        const om = (m[4] || "00").padStart(2, "0");
        return new Date(`${dateStr}T${hh}:${mm}:00${sign}${oh}:${om}`);
      }
      return new Date(`${dateStr}T${hh}:${mm}:00`);
    }

    function parseOpenFootball(data) {
      let list = [];
      if (Array.isArray(data.matches)) list = data.matches.map(m => ({ ...m }));
      else if (Array.isArray(data.rounds))
        list = data.rounds.flatMap(r => (r.matches || []).map(m => ({ ...m, round: m.round || r.name })));
      else return [];

      return list.map((m, i) => {
        const group = parseGroup(m.group);
        const stage = group ? null : detectStage(m.round || m.group);
        const h = teamName(m.team1), a = teamName(m.team2);
        const hc = teamCode(m.team1), ac = teamCode(m.team2);
        let hs = null, as = null;
        if (m.score && Array.isArray(m.score.ft)) { hs = m.score.ft[0]; as = m.score.ft[1]; }
        else if (m.score1 != null && m.score2 != null) { hs = m.score1; as = m.score2; }
        const date = parseKickoff(m.date, m.time);
        const finished = hs != null && as != null;
        const norm = arr => (Array.isArray(arr) ? arr : []).map(g => ({
          name: g.name || g.player || "", minute: g.minute ?? g.offset ?? null,
          penalty: !!g.penalty, owngoal: !!(g.owngoal || g.og), assist: g.assist || null,
        }));
        return {
          id: "of-" + (m.num ?? `${m.date}-${h}-${a}-${i}`), name: `${h} – ${a}`,
          home: h, away: a, homeBadge: flagUrl(hc, h), awayBadge: flagUrl(ac, a),
          homeScore: hs, awayScore: as, date,
          htScore: (m.score && Array.isArray(m.score.ht)) ? m.score.ht : null,
          homeGoals: norm(m.goals1), awayGoals: norm(m.goals2),
          venue: (m.ground || m.stadium?.name || m.city || ""),
          status: "", live: false, finished, kind: "wm", group, stage,
        };
      });
    }

    // ====== ESPN ==============================================================
    const espnNorm = s => String(s || "").toLowerCase().normalize("NFD")
      .replace(/[̀-ͯ]/g, "").replace(/[^a-z]/g, "");
    const ESPN_ALIAS = {
      unitedstates: "usa", usa: "usa",
      korearepublic: "southkorea", southkorea: "southkorea",
      iriran: "iran", iran: "iran",
      cotedivoire: "ivorycoast", ivorycoast: "ivorycoast",
      caboverde: "capeverde", capeverde: "capeverde",
      czechrepublic: "czechia", czechia: "czechia",
      turkey: "turkiye", turkiye: "turkiye",
      congodr: "drcongo", drcongo: "drcongo",
    };
    const espnCanon = n => { const x = espnNorm(n); return ESPN_ALIAS[x] || x; };
    const ymd = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;

    async function espnJson(url) {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }
    async function espnScoreboard(league, yyyymmdd) {
      try {
        const d = await espnJson(`${ESPN_BASE}/${league}/scoreboard${yyyymmdd ? "?dates=" + yyyymmdd : ""}`);
        return d.events || [];
      } catch { return []; }
    }

    function normalizeESPN(ev, kind) {
      const c = ev.competitions?.[0]; if (!c) return null;
      const cs = c.competitors || [];
      const home = cs.find(x => x.homeAway === "home") || cs[0];
      const away = cs.find(x => x.homeAway === "away") || cs[1];
      if (!home?.team || !away?.team) return null;
      const st = c.status || ev.status || {};
      const state = st.type?.state;
      const hName = home.team.displayName || home.team.name || "";
      const aName = away.team.displayName || away.team.name || "";
      const hs = home.score != null ? parseInt(home.score, 10) : null;
      const as = away.score != null ? parseInt(away.score, 10) : null;
      return {
        id: "espn-" + ev.id, espnId: ev.id, espnLeague: ESPN_LEAGUE[kind] || ESPN_LEAGUE.test,
        name: `${hName} – ${aName}`, home: hName, away: aName,
        homeBadge: flagUrl("", hName) || home.team.logo || "",
        awayBadge: flagUrl("", aName) || away.team.logo || "",
        homeScore: state === "pre" ? null : hs, awayScore: state === "pre" ? null : as,
        date: ev.date ? new Date(ev.date) : null,
        venue: c.venue?.fullName || "",
        status: st.type?.shortDetail || st.type?.description || "",
        live: state === "in", finished: state === "post",
        kind, group: null, stage: null, homeGoals: [], awayGoals: [], htScore: null,
      };
    }

    const inWindow = m => m.date && m.date >= WINDOW_START && m.date <= WINDOW_END;

    // ====== Laden =============================================================
    async function loadWM() {
      for (const url of WM_SOURCES) {
        try {
          const data = await fetchJSON(url, 1);
          const parsed = parseOpenFootball(data);
          if (parsed.length) return parsed;
        } catch { }
      }
      return [];
    }
    async function loadTests() {
      const evs = await espnScoreboard(ESPN_LEAGUE.test);
      return evs.map(e => normalizeESPN(e, "test")).filter(Boolean);
    }

    async function loadAll() {
      try {
        const [wm, tests] = await Promise.all([loadWM(), loadTests()]);
        let merged = wm.concat(tests);
        if (!merged.length) throw new Error("Keine Daten verfügbar");

        merged = merged.filter(m => m.kind === "wm" ? (!m.date || inWindow(m)) : inWindow(m));
        const seen = new Set();
        merged = merged.filter(m => m.id && !seen.has(m.id) && seen.add(m.id));
        merged.sort((a, b) => (a.date?.getTime() || Infinity) - (b.date?.getTime() || Infinity));

        const map = {};
        for (const m of merged) if (m.kind === "wm" && m.group) { map[m.home] = m.group; map[m.away] = m.group; }
        for (const m of merged) if (m.kind === "wm" && !m.group && !m.stage)
          m.group = map[m.home] || map[m.away] || null;

        allMatches = merged; teamGroup = map;
        localStorage.setItem(CACHE_KEY, JSON.stringify(
          merged.map(s => ({ ...s, date: s.date ? s.date.toISOString() : null }))));
        render(); setUpdated();
        updatePhaseLabel();
      } catch (err) {
        const c = loadCache();
        if (c) { allMatches = c; render(); $currentPhase.textContent = "OFFLINE · CACHE"; }
        else { $list.innerHTML = `<div class="error">⚠️ Spiele konnten nicht geladen werden.<br>(${esc(err.message)})</div>`; $currentPhase.textContent = "FEHLER"; }
      }
    }
    function loadCache() {
      try {
        const raw = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        return raw ? raw.map(m => ({ ...m, date: m.date ? new Date(m.date) : null })) : null;
      } catch { return null; }
    }

    // ====== Phase Label =======================================================
    function updatePhaseLabel() {
      const now = new Date();
      const live = allMatches.filter(m => m.live);
      if (live.length) {
        const phases = [...new Set(live.map(m => matchPhaseLabel(m)))];
        $currentPhase.textContent = phases[0] || "Live";
        return;
      }
      // Find the most recent or next WM match to determine phase
      const wmMatches = allMatches.filter(m => m.kind === "wm" && m.date);
      const recent = wmMatches.filter(m => m.finished).slice(-3);
      const upcoming = wmMatches.filter(m => !m.finished && !m.live && m.date >= now).slice(0, 3);
      const candidates = [...recent, ...upcoming];
      if (!candidates.length) { $currentPhase.textContent = "WM 2026"; return; }
      // Prefer a stage label (KO) over group
      for (const m of candidates) {
        if (m.stage) { $currentPhase.textContent = m.stage; return; }
      }
      const hasGroup = candidates.some(m => m.group);
      if (hasGroup) { $currentPhase.textContent = "Gruppenphase"; return; }
      $currentPhase.textContent = "WM 2026";
    }

    function matchPhaseLabel(m) {
      if (m.stage) return m.stage;
      if (m.group) return `Gruppe ${m.group}`;
      if (m.kind === "test") return "Testspiel";
      return "WM 2026";
    }

    // ====== Gruppentabellen ===================================================
    function computeGroups() {
      const groups = {};
      const ensure = (g, name, badge) => {
        groups[g] = groups[g] || {};
        groups[g][name] = groups[g][name] ||
          { team: name, badge: badge || "", p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[] };
        if (badge && !groups[g][name].badge) groups[g][name].badge = badge;
        return groups[g][name];
      };
      for (const m of allMatches) if (m.kind === "wm" && m.group) {
        ensure(m.group, m.home, m.homeBadge); ensure(m.group, m.away, m.awayBadge);
      }
      const finished = allMatches.filter(m => m.kind === "wm" && m.group && m.finished
        && m.homeScore != null && m.awayScore != null)
        .sort((a, b) => (a.date?.getTime() || 0) - (b.date?.getTime() || 0));
      for (const m of finished) {
        const h = ensure(m.group, m.home, m.homeBadge), a = ensure(m.group, m.away, m.awayBadge);
        const hs = +m.homeScore, as = +m.awayScore;
        h.p++; a.p++; h.gf += hs; h.ga += as; a.gf += as; a.ga += hs;
        if (hs > as) { h.w++; a.l++; h.pts += 3; h.form.push("w"); a.form.push("l"); }
        else if (hs < as) { a.w++; h.l++; a.pts += 3; a.form.push("w"); h.form.push("l"); }
        else { h.d++; a.d++; h.pts++; a.pts++; h.form.push("d"); a.form.push("d"); }
      }
      const out = {};
      for (const g of Object.keys(groups).sort())
        out[g] = Object.values(groups[g]).sort((x, y) =>
          y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || x.team.localeCompare(y.team));
      return out;
    }

    // ====== Torschützenliste ==================================================
    function computeScorers() {
      const map = {};
      const add = (g, team, badge) => {
        if (!g.name || g.owngoal) return;
        const key = g.name + "|" + team;
        const s = map[key] || (map[key] = { name: g.name, team, badge, goals: 0, pens: 0, assists: 0 });
        s.goals++; if (g.penalty) s.pens++;
      };
      const addAssist = (g, team, badge) => {
        if (!g.assist) return;
        const key = g.assist + "|" + team;
        const s = map[key] || (map[key] = { name: g.assist, team, badge, goals: 0, pens: 0, assists: 0 });
        s.assists++;
      };
      for (const m of allMatches) {
        if (m.kind !== "wm") continue;
        (m.homeGoals || []).forEach(g => { add(g, m.home, m.homeBadge); addAssist(g, m.home, m.homeBadge); });
        (m.awayGoals || []).forEach(g => { add(g, m.away, m.awayBadge); addAssist(g, m.away, m.awayBadge); });
      }
      return Object.values(map).sort((a, b) =>
        b.goals - a.goals || b.assists - a.assists || a.name.localeCompare(b.name));
    }

    function renderScorers() {
      let list = computeScorers();
      if (searchTerm) list = list.filter(s =>
        s.name.toLowerCase().includes(searchTerm) || s.team.toLowerCase().includes(searchTerm));
      const anyAssist = list.some(s => s.assists > 0);
      if (!list.length) {
        $list.innerHTML = `<div class="empty">Noch keine Tore.<br>
          Die Torschützenliste füllt sich automatisch, sobald gespielt wird.</div>`;
        return;
      }
      const rows = list.slice(0, 100).map((s, i) => `
        <tr>
          <td><span class="rankcell">${i + 1}</span></td>
          <td class="t"><span class="team-cell">${flag(s.badge)}<span>${esc(s.name)}${isFav(s.team) ? ' <span class="fav-star">★</span>' : ""}</span></span></td>
          <td class="t" style="color:var(--muted)">${esc(s.team)}</td>
          <td class="g">${s.goals}</td>
          <td>${s.pens || ""}</td>
          <td>${anyAssist ? (s.assists || "") : "–"}</td>
        </tr>`).join("");
      $list.innerHTML = `<div class="scorers"><table class="scorers-tbl">
        <thead><tr><th></th><th class="t">Spieler</th><th class="t">Team</th>
          <th>Tore</th><th>11m</th><th>Vorlagen</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
        ${anyAssist ? "" : `<div class="legend" style="margin-top:12px">Vorlagen sind in der freien Datenquelle nicht enthalten.</div>`}`;
    }

    // ====== Rendering =========================================================
    const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli",
                    "August","September","Oktober","November","Dezember"];
    const WEEKDAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];

    function flag(url) {
      return url
        ? `<img class="flag" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;flag-fallback&quot;></span>'">`
        : `<span class="flag-fallback"></span>`;
    }

    function flagLarge(url) {
      return url
        ? `<img class="mlc-flag" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;mlc-flag-fb&quot;></span>'">`
        : `<span class="mlc-flag-fb"></span>`;
    }

    // Live Match Card: score is the biggest element
    function renderLiveCard(m) {
      const hs = m.homeScore ?? 0, as = m.awayScore ?? 0;
      const phase = matchPhaseLabel(m);
      const minute = m.status ? esc(m.status) : "LIVE";

      // Last event: latest goal if available
      const allGoals = [
        ...(m.homeGoals || []).map(g => ({ ...g, team: m.home })),
        ...(m.awayGoals || []).map(g => ({ ...g, team: m.away })),
      ].filter(g => g.minute != null).sort((a, b) => b.minute - a.minute);
      const last = allGoals[0];
      const lastEventHtml = last
        ? `⚽ ${last.minute}' <strong>${esc(last.name)}</strong> <span style="color:var(--muted)">(${esc(last.team)})</span>${last.penalty ? " <span style='color:var(--muted)'>(E)</span>" : ""}`
        : `<span style="color:var(--line-bright)">–</span>`;

      return `
        <div class="match-live" data-id="${esc(m.id)}" role="button" tabindex="0">
          <div class="mlc-topbar">
            <span class="mlc-phase">${esc(phase)}</span>
            <span class="mlc-status-pill"><span class="mlc-pulse"></span>${minute}</span>
          </div>
          <div class="mlc-body">
            <div class="mlc-team">
              ${flagLarge(m.homeBadge)}
              <span class="mlc-name">${esc(m.home)}</span>
            </div>
            <div class="mlc-score-block">
              <div class="mlc-score">${hs}&thinsp;:&thinsp;${as}</div>
              <div class="mlc-minute">${minute}</div>
            </div>
            <div class="mlc-team away">
              ${flagLarge(m.awayBadge)}
              <span class="mlc-name">${esc(m.away)}</span>
            </div>
          </div>
          <div class="mlc-last-event">${lastEventHtml}</div>
        </div>`;
    }

    function renderMatch(m) {
      const d = m.date;
      const when = d
        ? `<div class="day">${d.getDate()}</div>${WEEKDAYS[d.getDay()]}<br>${pad(d.getHours())}:${pad(d.getMinutes())}`
        : `<div class="day">?</div>offen`;
      const hasScore = m.homeScore != null && m.awayScore != null;
      const homeWin = hasScore && +m.homeScore > +m.awayScore;
      const awayWin = hasScore && +m.awayScore > +m.homeScore;
      const result = m.live
        ? `<div class="score">${m.homeScore ?? 0}:${m.awayScore ?? 0}</div><span class="tag live">● ${esc(m.status) || "LIVE"}</span>`
        : (m.finished && hasScore)
          ? `<div class="score">${m.homeScore}:${m.awayScore}</div><span class="tag ft">Beendet</span>`
          : `<div class="vs">VS</div>`;
      let kindTag;
      if (m.kind === "wm" && m.group) kindTag = `<span class="tag grp">Gruppe ${m.group}</span>`;
      else if (m.kind === "wm")       kindTag = `<span class="tag ko">${esc(m.stage) || "K.-o.-Phase"}</span>`;
      else                            kindTag = `<span class="tag test">Testspiel</span>`;
      const favH = isFav(m.home), favA = isFav(m.away);
      const star = `<span class="fav-star" title="Deutschland">★</span>`;
      const cls = `match ${m.kind === "wm" ? "is-wm" : ""} ${m.live ? "is-live" : ""} ${favH || favA ? "is-fav" : ""}`;
      return `
        <div class="${cls}" data-id="${esc(m.id)}" role="button" tabindex="0">
          <div class="when">${when}</div>
          <div class="teams">
            <div class="team ${homeWin ? "winner" : ""}">${flag(m.homeBadge)}<span>${esc(m.home)}</span>${favH ? star : ""}</div>
            <div class="team ${awayWin ? "winner" : ""}">${flag(m.awayBadge)}<span>${esc(m.away)}</span>${favA ? star : ""}</div>
            <div class="meta">${kindTag}${m.venue ? `<span>📍 ${esc(m.venue)}</span>` : ""}</div>
          </div>
          <div class="result">${result}</div>
          <span class="chevron">›</span>
        </div>`;
    }

    function render() {
      if (currentFilter === "groups") return renderGroups();
      if (currentFilter === "scorers") return renderScorers();

      const now = new Date();
      let matches = allMatches.filter(applyFilter);

      if (!matches.length) {
        $list.innerHTML = `<div class="empty">Keine Spiele für diese Auswahl.</div>`;
        return;
      }

      const live     = matches.filter(m => m.live);
      const upcoming = matches.filter(m => !m.live && !m.finished && (!m.date || m.date >= now));
      const finished = matches.filter(m => !m.live && (m.finished || (m.date && m.date < now && !m.live)));

      let html = "";

      // 1. Live section (always first)
      if (live.length) {
        html += `<div class="section-head live"><span class="sh-live-dot"></span>Live jetzt</div>`;
        html += live.map(renderLiveCard).join("");
      }

      // 2. Upcoming section
      if (upcoming.length) {
        html += `<div class="section-head upcoming">Kommend</div>`;
        let lastMonth = "";
        for (const m of upcoming) {
          const mk = m.date ? `${MONTHS[m.date.getMonth()]} ${m.date.getFullYear()}` : "Termin offen";
          if (mk !== lastMonth) { html += `<div class="month-head">${mk}</div>`; lastMonth = mk; }
          html += renderMatch(m);
        }
      }

      // 3. Finished section
      if (finished.length) {
        html += `<div class="section-head finished">Abgeschlossen</div>`;
        // Show most recent first in finished
        const finishedDesc = [...finished].sort((a, b) => (b.date?.getTime() || 0) - (a.date?.getTime() || 0));
        let lastMonth = "";
        for (const m of finishedDesc) {
          const mk = m.date ? `${MONTHS[m.date.getMonth()]} ${m.date.getFullYear()}` : "–";
          if (mk !== lastMonth) { html += `<div class="month-head">${mk}</div>`; lastMonth = mk; }
          html += renderMatch(m);
        }
      }

      $list.innerHTML = html || `<div class="empty">Keine Spiele für diese Auswahl.</div>`;
    }

    function applyFilter(m) {
      if (searchTerm) {
        const hay = `${m.home} ${m.away} ${m.group ? "gruppe " + m.group : ""}`.toLowerCase();
        if (!hay.includes(searchTerm)) return false;
      }
      switch (currentFilter) {
        case "wm":       return m.kind === "wm";
        case "test":     return m.kind === "test";
        case "live":     return m.live;
        case "upcoming": return !m.finished && !m.live && m.date && m.date >= new Date();
        default:         return true;
      }
    }

    function renderGroups() {
      const groups = computeGroups();
      let keys = Object.keys(groups);
      if (searchTerm) keys = keys.filter(g => `gruppe ${g}`.includes(searchTerm) ||
        groups[g].some(t => t.team.toLowerCase().includes(searchTerm)));
      if (!keys.length) {
        $list.innerHTML = `<div class="empty">Gruppentabellen sind noch nicht verfügbar.<br>
          Sobald Gruppenspiele in den Daten stehen, erscheinen sie hier automatisch.</div>`; return;
      }
      let html = `<div class="legend">Je Gruppe ziehen die <b>ersten beiden</b> ins Sechzehntelfinale ein (zzgl. der acht besten Gruppendritten).</div><div class="groups-grid">`;
      for (const g of keys) {
        const rows = groups[g].map((t, i) => {
          const form = t.form.slice(-5).map(r =>
            `<span class="${r}">${r === "w" ? "S" : r === "d" ? "U" : "N"}</span>`).join("");
          return `<tr class="${i < 2 ? "qualified" : ""} ${isFav(t.team) ? "is-fav" : ""}">
            <td><span class="rankcell">${i + 1}</span></td>
            <td class="t"><span class="team-cell">${flag(t.badge)}<span>${esc(t.team)}${isFav(t.team) ? ' <span class="fav-star">★</span>' : ""}</span></span></td>
            <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
            <td>${t.gf}:${t.ga}</td><td>${t.gf - t.ga > 0 ? "+" : ""}${t.gf - t.ga}</td>
            <td class="pts">${t.pts}</td><td><span class="form">${form}</span></td>
          </tr>`;
        }).join("");
        html += `<div class="group-card"><div class="group-title">🏅 Gruppe ${g}</div>
          <table class="standings"><thead><tr>
            <th></th><th class="t">Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th>
            <th>Tore</th><th>Diff</th><th>Pkt</th><th>Form</th>
          </tr></thead><tbody>${rows}</tbody></table></div>`;
      }
      $list.innerHTML = html + `</div>`;
    }

    function setUpdated() {
      const n = new Date();
      $updated.textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
    }

    // ====== Spiel-Detail (Modal) =============================================
    const $modal = document.getElementById("modal");
    const $modalBody = document.getElementById("modal-body");

    function fullDate(d) {
      if (!d) return "Termin offen";
      return `${WEEKDAYS[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())} Uhr`;
    }
    function goalLine(g) {
      const notes = [];
      if (g.penalty) notes.push("Elfmeter");
      if (g.owngoal) notes.push("Eigentor");
      const note = notes.length ? ` <span class="gnote">(${notes.join(", ")})</span>` : "";
      const min = g.minute != null ? `<span class="min">${g.minute}'</span> ` : "";
      return `<div class="goal">⚽ ${min}${esc(g.name)}${note}</div>`;
    }

    function openMatch(id) {
      const m = allMatches.find(x => String(x.id) === String(id));
      if (!m) return;
      const hasScore = m.homeScore != null && m.awayScore != null;
      const phase = m.kind !== "wm" ? "Testspiel"
        : m.group ? `Gruppe ${m.group}` : (m.stage || "K.-o.-Phase");
      const hg = m.homeGoals || [], ag = m.awayGoals || [];
      const hasGoals = hg.length || ag.length;

      const scoreBlock = hasScore
        ? `<div class="md-result">${m.homeScore} : ${m.awayScore}</div>`
        : `<div class="md-result" style="font-size:1.4rem;color:var(--muted)">${m.date && m.date > new Date() ? "Anstoß " + pad(m.date.getHours()) + ":" + pad(m.date.getMinutes()) : "VS"}</div>`;
      const ht = (m.htScore && hasScore) ? `<div class="md-ht">Halbzeit: ${m.htScore[0]}:${m.htScore[1]}</div>` : "";

      const goalsBlock = hasGoals ? `
        <div class="md-h">Tore</div>
        <div class="goals">
          <div class="side home">${hg.map(goalLine).join("") || '<span class="gnote">–</span>'}</div>
          <div class="side away">${ag.map(goalLine).join("") || '<span class="gnote">–</span>'}</div>
        </div>` : (hasScore ? `<div class="md-h">Tore</div><div class="gnote">Keine Torschützen-Daten.</div>` : "");

      const facts = `
        <div class="md-h">Fakten</div>
        <div class="facts">
          <div class="k">Wettbewerb</div><div class="v">${m.kind === "wm" ? "WM 2026" : "Länderspiel"}</div>
          <div class="k">Phase</div><div class="v">${esc(phase)}</div>
          <div class="k">Anstoß</div><div class="v">${fullDate(m.date)}</div>
          <div class="k">Ort</div><div class="v">${esc(m.venue) || "–"}</div>
          ${hasScore ? `<div class="k">Endstand</div><div class="v">${m.homeScore}:${m.awayScore}</div>` : ""}
          ${ht ? `<div class="k">Halbzeit</div><div class="v">${m.htScore[0]}:${m.htScore[1]}</div>` : ""}
        </div>`;

      const token = ++openToken;
      $modalBody.innerHTML = `
        <div class="md-stage">${esc(phase)}</div>
        <div class="md-meta">${fullDate(m.date)}${m.venue ? " · " + esc(m.venue) : ""}</div>
        <div class="md-score">
          <div class="md-team">${flag(m.homeBadge)}<span>${esc(m.home)}</span></div>
          ${scoreBlock}
          <div class="md-team">${flag(m.awayBadge)}<span>${esc(m.away)}</span></div>
        </div>
        ${ht}
        ${goalsBlock}
        ${facts}
        <div id="espn-extra"></div>`;
      $modal.hidden = false;
      document.body.style.overflow = "hidden";
      loadEspnDetails(m, token);
    }

    // ====== ESPN-Detail =======================================================
    let openToken = 0;

    async function findEspnEvent(m) {
      if (m.espnId) return { id: m.espnId, league: m.espnLeague };
      if (!m.date) return null;
      const league = ESPN_LEAGUE[m.kind] || ESPN_LEAGUE.wm;
      const hc = espnCanon(m.home), ac = espnCanon(m.away);
      for (const off of [0, -1, 1]) {
        const d = new Date(m.date); d.setDate(d.getDate() + off);
        const evs = await espnScoreboard(league, ymd(d));
        const hit = evs.find(e => {
          const cs = e.competitions?.[0]?.competitors || [];
          const names = cs.map(x => espnCanon(x.team?.displayName || x.team?.name));
          return names.includes(hc) && names.includes(ac);
        });
        if (hit) return { id: hit.id, league };
      }
      return null;
    }

    async function loadEspnDetails(m, token) {
      const box = () => document.getElementById("espn-extra");
      const set = html => { if (token === openToken && box()) box().innerHTML = html; };
      set(`<div class="md-h">Aufstellung &amp; Statistik</div><div class="gnote">Lade Live-Daten …</div>`);
      try {
        const ev = await findEspnEvent(m);
        if (!ev) return set(`<div class="md-h">Aufstellung &amp; Statistik</div>
          <div class="md-note">Für dieses Spiel liegen bei ESPN noch keine Daten vor.</div>`);
        const sum = await espnJson(`${ESPN_BASE}/${ev.league}/summary?event=${ev.id}`);
        if (token !== openToken) return;
        const parts = [renderEspnGoals(sum), renderEspnLineups(sum), renderEspnStats(sum)].filter(Boolean);
        set(parts.length ? parts.join("")
          : `<div class="md-h">Aufstellung &amp; Statistik</div>
             <div class="md-note">Aufstellungen &amp; Statistiken erscheinen meist erst ~1 Std. vor Anstoß.</div>`);
      } catch (e) {
        set(`<div class="md-h">Aufstellung &amp; Statistik</div>
          <div class="md-note">ESPN-Daten gerade nicht verfügbar (${esc(e.message)}).</div>`);
      }
    }

    function renderEspnGoals(sum) {
      const teamName = id => (sum.boxscore?.teams || []).find(t => t.team?.id === id)?.team?.displayName || "";
      const evs = (sum.keyEvents || []).filter(e => e.scoringPlay || /goal/i.test(e.type?.text || ""));
      if (!evs.length) return "";
      const rows = evs.map(e => {
        const min = e.clock?.displayValue || e.time?.displayValue || "";
        const pts = e.participants || [];
        const scorer = pts[0]?.athlete?.displayName || e.athlete?.displayName || "";
        const assist = pts[1]?.athlete?.displayName;
        const det = e.penaltyKick ? " (Elfmeter)" : e.ownGoal ? " (Eigentor)" : "";
        const tn = e.team?.displayName || teamName(e.team?.id);
        return `<div class="goal">⚽ <span class="min">${esc(min)}</span> ${esc(scorer)}
          ${tn ? `<span class="gnote">(${esc(tn)})</span>` : ""}${det}
          ${assist ? `<span class="gnote">Vorlage: ${esc(assist)}</span>` : ""}</div>`;
      }).join("");
      return `<div class="md-h">Tore &amp; Vorlagen</div><div class="side">${rows}</div>`;
    }

    function renderEspnLineups(sum) {
      const rs = sum.rosters || [];
      if (!rs.length || !rs.some(r => (r.roster || []).length)) return "";
      const li = p => {
        const num = p.jersey ?? p.athlete?.jersey ?? "";
        const pos = p.position?.abbreviation || p.position?.name || "";
        return `<li><span class="num">${esc(num)}</span>${esc(p.athlete?.displayName || "")}
          <span class="pos">${esc(pos)}</span></li>`;
      };
      const team = r => {
        const pl = r.roster || [];
        const xi = pl.filter(p => p.starter).map(li).join("");
        const bench = pl.filter(p => !p.starter).map(p => esc(p.athlete?.displayName || "")).join(", ");
        return `<div class="af-team">
          <div class="af-team-h">${esc(r.team?.displayName || "")}${r.formation ? ` · <span class="form-txt">${esc(r.formation)}</span>` : ""}</div>
          <ol class="lineup">${xi || "<li>–</li>"}</ol>
          ${bench ? `<div class="af-subs"><b>Bank:</b> ${bench}</div>` : ""}
        </div>`;
      };
      return `<div class="md-h">Startelf</div><div class="af-lineups">${rs.map(team).join("")}</div>`;
    }

    function renderEspnStats(sum) {
      const teams = sum.boxscore?.teams || [];
      if (teams.length < 2) return "";
      const map = t => { const o = {}; (t.statistics || []).forEach(s =>
        o[s.name || s.label] = { label: s.label || s.name, val: s.displayValue ?? s.value }); return o; };
      const A = map(teams[0]), B = map(teams[1]);
      const keys = [...new Set([...Object.keys(A), ...Object.keys(B)])];
      const num = v => { const n = parseFloat(String(v ?? "").replace(/[^\d.]/g, "")); return isNaN(n) ? 0 : n; };
      const rows = keys.map(k => {
        const la = A[k], lb = B[k]; const label = (la || lb).label || k;
        const av = la ? la.val : "–", bv = lb ? lb.val : "–";
        const an = num(av), bn = num(bv), tot = an + bn || 1;
        return `<div class="stat-row">
          <span class="sv">${esc(String(av))}</span>
          <span class="sl">
            <span class="bar"><i style="width:${(an / tot * 100).toFixed(0)}%"></i></span>
            ${esc(label)}
            <span class="bar r"><i style="width:${(bn / tot * 100).toFixed(0)}%"></i></span>
          </span>
          <span class="sv">${esc(String(bv))}</span>
        </div>`;
      }).join("");
      return rows ? `<div class="md-h">Statistik</div><div class="af-stats">${rows}</div>` : "";
    }

    function closeModal() { $modal.hidden = true; document.body.style.overflow = ""; }
    $modal.addEventListener("click", e => { if (e.target.hasAttribute("data-close")) closeModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !$modal.hidden) closeModal(); });

    // ====== Events ============================================================
    // Filter tabs
    document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
      document.querySelector(".tab.active")?.classList.remove("active");
      tab.classList.add("active"); currentFilter = tab.dataset.filter; render();
    }));

    // Search toggle
    const $searchWrap = document.getElementById("searchWrap");
    const $btnSearch = document.getElementById("btnSearch");
    $btnSearch.addEventListener("click", () => {
      const open = $searchWrap.classList.toggle("open");
      $btnSearch.classList.toggle("active", open);
      if (open) setTimeout(() => $search.focus(), 80);
      else { searchTerm = ""; $search.value = ""; render(); }
    });

    // Notification bell (placeholder)
    document.getElementById("btnBell").addEventListener("click", () => {
      document.getElementById("btnBell").classList.toggle("active");
    });

    let searchTimer;
    $search.addEventListener("input", e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { searchTerm = e.target.value.trim().toLowerCase(); render(); }, 200);
    });

    // Click on match card (delegation for both match types)
    $list.addEventListener("click", e => {
      const card = e.target.closest("[data-id]");
      if (card) openMatch(card.dataset.id);
    });
    $list.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const card = e.target.closest("[data-id]");
      if (card) { e.preventDefault(); openMatch(card.dataset.id); }
    });

    // Bottom nav
    document.querySelectorAll(".bnav-item").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".bnav-item").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const nav = btn.dataset.nav;
      if (nav === "matches") { currentFilter = "all"; document.querySelector(".tab.active")?.classList.remove("active"); document.querySelector('[data-filter="all"]').classList.add("active"); render(); }
      else if (nav === "live") { currentFilter = "live"; document.querySelector(".tab.active")?.classList.remove("active"); document.querySelector('[data-filter="live"]').classList.add("active"); render(); }
      else if (nav === "standings") { currentFilter = "groups"; document.querySelector(".tab.active")?.classList.remove("active"); document.querySelector('[data-filter="groups"]').classList.add("active"); render(); }
      // Teams and Profile are placeholders for future features
    }));

    // ====== Start & Auto-Refresh =============================================
    loadAll();
    setInterval(loadAll, REFRESH_MS);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll(); });

    // ====== PWA: Service Worker ==============================================
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => { });
      });
    }
  </script>
</body>
</html>
