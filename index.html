    // ====== Tipps-Tab ============================================================
    const LS_TIPPS = "wm2026-tipps";

    function scoreTipp(tip, m) {
      if (tip.h == null || tip.a == null || !m.finished) return null;
      if (tip.h === m.homeScore && tip.a === m.awayScore) return 2;
      const to = tip.h > tip.a ? 1 : tip.h < tip.a ? -1 : 0;
      const ao = m.homeScore > m.awayScore ? 1 : m.homeScore < m.awayScore ? -1 : 0;
      return to === ao ? 1 : 0;
    }

    function renderTipps() {
      // Nicht neu rendern, während der Nutzer gerade ein Tipp-Feld bearbeitet
      if (document.activeElement?.classList?.contains("tipps-input")) return;
      const tipps = JSON.parse(localStorage.getItem(LS_TIPPS) || "{}");
      const groupMatches = allMatches.filter(m => m.kind === "wm" && m.group).sort((a, b) => (a.date?.getTime() || 0) - (b.date?.getTime() || 0));

      let totalPts = 0, judged = 0;
      for (const m of groupMatches) {
        const s = scoreTipp(tipps[m.id] || {}, m);
        if (s != null) { totalPts += s; judged++; }
      }

      const byGroup = {};
      for (const m of groupMatches) {
        const g = m.group || "?";
        if (!byGroup[g]) byGroup[g] = [];
        byGroup[g].push(m);
      }

      let html = `
        <div class="tipps-header">
          <div class="tipps-score-wrap">
            <div class="tipps-score">${totalPts}</div>
            <div class="tipps-score-label">Punkte gesamt</div>
          </div>
          <div class="tipps-legend">
            <span>✅ Exakt · 2 Pkt.</span>
            <span>🟡 Ausgang · 1 Pkt.</span>
            <span>❌ Falsch · 0 Pkt.</span>
          </div>
        </div>`;

      if (!groupMatches.length) {
        $list.innerHTML = html + `<div class="empty">Keine Gruppenspiele gefunden.</div>`;
        return;
      }

      for (const g of Object.keys(byGroup).sort()) {
        html += `<div class="section-head">Gruppe ${esc(g)}</div>`;
        for (const m of byGroup[g]) {
          const tip = tipps[m.id] || {};
          const locked = m.finished || m.live;
          const pts = scoreTipp(tip, m);
          const badge = pts === 2 ? "✅" : pts === 1 ? "🟡" : pts === 0 ? "❌" : "";
          const gradStyle = cardGradient(m.home, m.away);
          const dateStr = m.date
            ? `${m.date.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})} · ${pad(m.date.getHours())}:${pad(m.date.getMinutes())} Uhr`
            : "Termin offen";
          const statusStr = m.live ? "🔴 Live" : m.finished ? "Abgepfiffen" : "Ausstehend";
          const hFlag = m.homeBadge
            ? `<img class="tipps-flag" src="${esc(m.homeBadge)}" alt="" onerror="this.outerHTML='<span class=&quot;tipps-flag-fb&quot;></span>'">`
            : `<span class="tipps-flag-fb"></span>`;
          const aFlag = m.awayBadge
            ? `<img class="tipps-flag" src="${esc(m.awayBadge)}" alt="" onerror="this.outerHTML='<span class=&quot;tipps-flag-fb&quot;></span>'">`
            : `<span class="tipps-flag-fb"></span>`;
          const inputsHtml = locked
            ? `<span class="tipps-score-disp">${tip.h != null ? tip.h : "–"}</span><span class="tipps-colon">:</span><span class="tipps-score-disp">${tip.a != null ? tip.a : "–"}</span>`
            : `<input class="tipps-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${tip.h != null ? tip.h : ""}" placeholder="–" data-id="${esc(m.id)}" data-side="h"><span class="tipps-colon">:</span><input class="tipps-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${tip.a != null ? tip.a : ""}" placeholder="–" data-id="${esc(m.id)}" data-side="a">`;
          const footerHtml = m.finished && tip.h != null
            ? `<div class="tipps-footer">${badge} Dein Tipp: <strong>${tip.h}:${tip.a}</strong> &nbsp;·&nbsp; Ergebnis: <span class="tipps-real-score">${m.homeScore}:${m.awayScore}</span></div>`
            : "";
          html += `
            <div class="tipps-card${locked ? " locked" : ""}" style="${gradStyle}">
              <div class="tipps-meta">
                <span class="tipps-meta-left">${statusStr}</span>
                <span>${esc(dateStr)}</span>
              </div>
              <div class="tipps-match-row">
                <div class="tipps-side">
                  ${hFlag}
                  <span class="tipps-tname">${esc(m.home)}</span>
                </div>
                <div class="tipps-center">
                  <div class="tipps-inputs">${inputsHtml}</div>
                  ${badge ? `<span class="tipps-badge">${badge}</span>` : ""}
                </div>
                <div class="tipps-side right">
                  ${aFlag}
                  <span class="tipps-tname">${esc(m.away)}</span>
                </div>
              </div>
              ${footerHtml}
            </div>`;
        }
      }

      $list.innerHTML = html;

      $list.querySelectorAll(".tipps-input").forEach(inp => {
        inp.addEventListener("input", () => {
          inp.value = inp.value.replace(/\D/g, "").slice(0, 2);
        });
        inp.addEventListener("change", () => {
          const id = inp.dataset.id;
          const side = inp.dataset.side;
          const val = parseInt(inp.value, 10);
          const cur = JSON.parse(localStorage.getItem(LS_TIPPS) || "{}");
          if (!cur[id]) cur[id] = {};
          cur[id][side] = isNaN(val) || val < 0 ? null : val;
          localStorage.setItem(LS_TIPPS, JSON.stringify(cur));
          // Kein Re-Render: Scroll-Position und Tastatur bleiben erhalten,
          // nur die Gesamtpunktzahl oben wird aktualisiert
          const scoreEl = $list.querySelector(".tipps-score");
          if (scoreEl) {
            let total = 0;
            for (const m of allMatches) {
              if (m.kind !== "wm" || !m.group) continue;
              const s = scoreTipp(cur[m.id] || {}, m);
              if (s != null) total += s;
            }
            scoreEl.textContent = total;
          }
        });
      });
    }

    function setUpdated() {
      const n = new Date();
      $updated.textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
    }

    // ====== Spiel-Detail (Modal) =============================================
    const $modal = document.getElementById("modal");
    const $modalBody = document.getElementById("modal-body");

    function fullDate(d) {
      if (!d) return "Termin offen";
      return `${WEEKDAYS[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())} Uhr`;
    }
    function goalLine(g) {
      const notes = [];
      if (g.penalty) notes.push("Elfmeter");
      if (g.owngoal) notes.push("Eigentor");
      const note = notes.length ? ` <span class="gnote">(${notes.join(", ")})</span>` : "";
      const min = g.minute != null ? `<span class="min">${g.minute}'</span> ` : "";
      return `<div class="goal">⚽ ${min}${esc(g.name)}${note}</div>`;
    }

    function mdsFlag(url) {
      return url
        ? `<img class="mds-team-flag" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;mds-team-flag-fb&quot;></span>'">`
        : `<span class="mds-team-flag-fb"></span>`;
    }

    function standingsImpact(m) {
      if (m.kind !== "wm" || !m.group) return "";
      const groups = computeGroups();
      const grp = groups[m.group]; if (!grp) return "";

      const project = (extraH, extraA) => {
        return grp.map(t => {
          let pts = t.pts, gf = t.gf, ga = t.ga;
          if (t.team === m.home) { pts += extraH[0]; gf += extraH[1]; ga += extraH[2]; }
          if (t.team === m.away) { pts += extraA[0]; gf += extraA[1]; ga += extraA[2]; }
          return { ...t, pts, gf, ga, diff: gf - ga };
        }).sort((a, b) => b.pts - a.pts || b.diff - a.diff || b.gf - a.gf);
      };

      const fmt = rows => rows.slice(0, 4).map((t, i) => {
        const hi = t.team === m.home || t.team === m.away;
        return `<div${hi ? ` style="color:var(--gold-soft)"` : ""}>${i + 1}. ${esc(t.team.length > 10 ? t.team.slice(0, 9) + "…" : t.team)} <strong>${t.pts}P</strong></div>`;
      }).join("");

      const hWin  = project([3,1,0], [0,0,1]);
      const draw  = project([1,0,0], [1,0,0]);
      const aWin  = project([0,0,1], [3,1,0]);

      return `
        <div class="mds-sh">Standings-Impact</div>
        <div class="mds-impact">
          <div class="mds-impact-box">
            <div class="mds-impact-label">Heimsieg</div>
            <div class="mds-impact-row">${fmt(hWin)}</div>
          </div>
          <div class="mds-impact-box">
            <div class="mds-impact-label">Unentschieden</div>
            <div class="mds-impact-row">${fmt(draw)}</div>
          </div>
          <div class="mds-impact-box">
            <div class="mds-impact-label">Auswärtssieg</div>
            <div class="mds-impact-row">${fmt(aWin)}</div>
          </div>
        </div>`;
    }

    function openMatch(id) {
      const m = allMatches.find(x => String(x.id) === String(id));
      if (!m) return;
      const hasScore = m.homeScore != null && m.awayScore != null;
      const phase = m.kind !== "wm" ? "Testspiel"
        : m.group ? `Gruppe ${m.group}` : (m.stage || "K.-o.-Phase");

      // Status chip
      const now = new Date();
      let chipCls = "pre", chipTxt = m.date ? `${pad(m.date.getHours())}:${pad(m.date.getMinutes())} Uhr` : "Geplant";
      if (m.live)     { chipCls = "live"; chipTxt = m.status || "LIVE"; }
      if (m.finished) { chipCls = "ft";   chipTxt = "Abgepfiffen"; }

      // Score display
      const scoreHtml = hasScore
        ? `<div class="mds-main-score">${m.homeScore}&thinsp;:&thinsp;${m.awayScore}</div>`
        : `<div class="mds-main-score" style="font-size:1.6rem;color:var(--muted)">–</div>`;
      const htHtml = m.htScore && hasScore
        ? `<span class="mds-ht">HZ ${m.htScore[0]}:${m.htScore[1]}</span>` : "";

      // Event timeline from openfootball goal data
      const hg = m.homeGoals || [], ag = m.awayGoals || [];
      const allEvs = [
        ...hg.map(g => ({ ...g, side: "home", team: m.home })),
        ...ag.map(g => ({ ...g, side: "away", team: m.away })),
      ].filter(g => g.minute != null).sort((a, b) => a.minute - b.minute);

      const evHtml = allEvs.length ? allEvs.map(g => {
        const icon = g.owngoal ? "⚽" : g.penalty ? "⚽" : "⚽";
        const note = g.owngoal ? " (ET)" : g.penalty ? " (E)" : "";
        return `<div class="mds-ev ${g.side === "away" ? "ev-away" : ""}">
          <span class="mds-ev-min">${g.minute}'</span>
          <span class="mds-ev-icon">${icon}</span>
          <div class="mds-ev-body">
            <div class="mds-ev-name">${esc(g.name)}${note}</div>
            <div class="mds-ev-sub">${esc(g.team)}</div>
          </div>
        </div>`;
      }).join("") : `<div style="color:var(--muted-2);font-size:0.8rem;padding:6px 0">Keine Event-Daten</div>`;

      const facts = `
        <div class="mds-sh">Match-Facts</div>
        <div class="mds-facts">
          <div class="mds-fact"><span class="mds-fact-k">Wettbewerb</span><span class="mds-fact-v">${m.kind === "wm" ? "WM 2026" : "Länderspiel"}</span></div>
          <div class="mds-fact"><span class="mds-fact-k">Phase</span><span class="mds-fact-v">${esc(phase)}</span></div>
          <div class="mds-fact"><span class="mds-fact-k">Anstoß</span><span class="mds-fact-v">${fullDate(m.date)}</span></div>
          <div class="mds-fact"><span class="mds-fact-k">Stadion</span><span class="mds-fact-v">${esc(m.venue) || "–"}</span></div>
          ${tvInfo(m) ? `<div class="mds-fact"><span class="mds-fact-k">📺 TV (DE)</span><span class="mds-fact-v">${esc(tvInfo(m))}</span></div>` : ""}
          ${hasScore ? `<div class="mds-fact"><span class="mds-fact-k">Endstand</span><span class="mds-fact-v">${m.homeScore} : ${m.awayScore}</span></div>` : ""}
          ${m.htScore && hasScore ? `<div class="mds-fact"><span class="mds-fact-k">Halbzeit</span><span class="mds-fact-v">${m.htScore[0]} : ${m.htScore[1]}</span></div>` : ""}
        </div>`;

      const impact = !m.finished && !m.live ? standingsImpact(m) : "";

      const token = ++openToken;
      $modalBody.innerHTML = `
        <div class="mds-header">
          <div class="mds-phase-line">${esc(phase)}</div>
          <div class="mds-meta-line">${fullDate(m.date)}${m.venue ? " · " + esc(m.venue) : ""}</div>
        </div>
        <div class="mds-team-row">
          <div class="mds-team">${mdsFlag(m.homeBadge)}<span class="mds-team-name">${esc(m.home)}</span></div>
          <div class="mds-score-center">
            ${scoreHtml}
            <div class="mds-status-row">
              ${m.live ? `<span class="mds-live-pulse"></span>` : ""}
              <span class="mds-chip ${chipCls}">${chipTxt}</span>
            </div>
            ${htHtml}
          </div>
          <div class="mds-team">${mdsFlag(m.awayBadge)}<span class="mds-team-name">${esc(m.away)}</span></div>
        </div>
        ${allEvs.length ? `<div class="mds-sh">Ereignisse</div><div class="mds-events">${evHtml}</div>` : ""}
        ${impact}
        ${facts}
        <div id="espn-extra"></div>`;
      $modal.hidden = false;
      document.body.style.overflow = "hidden";
      loadEspnDetails(m, token);
    }

    // ====== ESPN-Detail =======================================================
    let openToken = 0;

    async function findEspnEvent(m) {
      if (m.espnId) return { id: m.espnId, league: m.espnLeague };
      if (!m.date) return null;
      const league = ESPN_LEAGUE[m.kind] || ESPN_LEAGUE.wm;
      const hc = espnCanon(m.home), ac = espnCanon(m.away);
      for (const off of [0, -1, 1]) {
        const d = new Date(m.date); d.setDate(d.getDate() + off);
        const evs = await espnScoreboard(league, ymd(d));
        const hit = evs.find(e => {
          const cs = e.competitions?.[0]?.competitors || [];
          const names = cs.map(x => espnCanon(x.team?.displayName || x.team?.name));
          return names.includes(hc) && names.includes(ac);
        });
        if (hit) return { id: hit.id, league };
      }
      return null;
    }

    async function loadEspnDetails(m, token) {
      const box = () => document.getElementById("espn-extra");
      const set = html => { if (token === openToken && box()) box().innerHTML = html; };
      set(`<div class="mds-sh">Live-Daten</div><div style="color:var(--muted-2);font-size:0.8rem;padding:4px 0">Lade ESPN-Daten …</div>`);
      try {
        const ev = await findEspnEvent(m);
        if (!ev) return set(`<div class="mds-sh">Aufstellung &amp; Statistik</div>
          <div class="md-note">Noch keine ESPN-Daten (erscheinen ~1 Std. vor Anstoß).</div>`);
        const sum = await espnJson(`${ESPN_BASE}/${ev.league}/summary?event=${ev.id}`);
        if (token !== openToken) return;

        // Hat das Spiel wirklich begonnen? Tore & Statistiken nur dann zeigen –
        // sonst erscheinen bei noch nicht gespielten (Test-)Spielen Null-Werte.
        const espnState = sum.header?.competitions?.[0]?.status?.type?.state; // pre | in | post
        const futureMatch = m.date && m.date.getTime() > Date.now() && !m.live && !m.finished;
        const started = !futureMatch && (espnState === "in" || espnState === "post" || m.live || m.finished);

        const parts = started
          ? [renderEspnGoals(sum), renderEspnStats(sum), renderEspnLineups(sum)].filter(Boolean)
          : [renderEspnLineups(sum)].filter(Boolean); // vor Anstoß höchstens Aufstellung
        set(parts.length ? parts.join("")
          : `<div class="mds-sh">Aufstellung &amp; Statistik</div>
             <div class="md-note">${started
               ? "Daten erscheinen meist ~1 Std. vor Anstoß bzw. live."
               : "Das Spiel hat noch nicht begonnen – Statistiken folgen ab Anpfiff."}</div>`);
      } catch (e) {
        set(`<div class="mds-sh">Aufstellung &amp; Statistik</div>
          <div class="md-note">ESPN nicht verfügbar (${esc(e.message)}).</div>`);
      }
    }

    function renderEspnGoals(sum) {
      const tName = id => (sum.boxscore?.teams || []).find(t => t.team?.id === id)?.team?.displayName || "";
      const evs = (sum.keyEvents || []).filter(e => e.scoringPlay || /goal/i.test(e.type?.text || ""));
      if (!evs.length) return "";
      const rows = evs.map(e => {
        const min = e.clock?.displayValue || e.time?.displayValue || "";
        const pts = e.participants || [];
        const scorer = pts[0]?.athlete?.displayName || e.athlete?.displayName || "";
        const assist = pts[1]?.athlete?.displayName;
        const det = e.penaltyKick ? " (E)" : e.ownGoal ? " (ET)" : "";
        const tn = e.team?.displayName || tName(e.team?.id);
        return `<div class="mds-ev">
          <span class="mds-ev-min">${esc(min)}</span>
          <span class="mds-ev-icon">⚽</span>
          <div class="mds-ev-body">
            <div class="mds-ev-name">${esc(scorer)}${det}</div>
            <div class="mds-ev-sub">${esc(tn)}${assist ? ` · Vorlage: ${esc(assist)}` : ""}</div>
          </div>
        </div>`;
      }).join("");
      return `<div class="mds-sh">Tore &amp; Vorlagen (ESPN)</div><div class="mds-events">${rows}</div>`;
    }

    function renderEspnLineups(sum) {
      const rs = sum.rosters || [];
      if (!rs.length || !rs.some(r => (r.roster || []).length)) return "";
      // Position → Linie: 0 = Torwart, 1 = Abwehr, 2 = Mittelfeld, 3 = Sturm
      const lineOf = abbr => {
        const a = (abbr || "").toUpperCase();
        if (/^G/.test(a)) return 0;
        if (/^(D|CB|LB|RB|LWB|RWB|SW)/.test(a)) return 1;
        if (/^(F|S|CF|LW|RW|W)/.test(a)) return 3;
        if (/^(M|CM|DM|AM|LM|RM)/.test(a)) return 2;
        return 2;
      };
      const dot = p => {
        const num = p.jersey ?? p.athlete?.jersey ?? "";
        const nm = p.athlete?.displayName || p.athlete?.shortName || "";
        const last = nm.split(" ").slice(-1)[0] || nm;
        const pid = p.athlete?.id;
        const head = p.athlete?.headshot?.href
          || (pid ? `https://a.espncdn.com/i/headshots/soccer/players/full/${pid}.png` : "");
        // Gesicht mit Rückennummer; Bild-Fehler → Nummer bleibt sichtbar
        const face = `
          <span class="pp-wrap">
            <span class="pp-face"><span class="pp-facenum">${esc(num)}</span>${head ? `<img src="${esc(head)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>
            ${num !== "" ? `<span class="pp-numbadge">${esc(num)}</span>` : ""}
          </span>`;
        return `<div class="pp pi-player" role="button" tabindex="0" data-player="${esc(nm)}" title="${esc(nm)} – Infos anzeigen">${face}<span class="pp-name">${esc(last)}</span></div>`;
      };
      const team = r => {
        const xi = (r.roster || []).filter(p => p.starter);
        if (!xi.length) return "";
        const lines = [[], [], [], []];
        xi.forEach(p => lines[lineOf(p.position?.abbreviation || p.position?.name)].push(p));
        const formation = r.formation
          || [lines[1].length, lines[2].length, lines[3].length].filter(Boolean).join("-");
        const rows = [3, 2, 1, 0].map(i => lines[i].length
          ? `<div class="pitch-row">${lines[i].map(dot).join("")}</div>` : "").join("");
        const bench = (r.roster || []).filter(p => !p.starter)
          .map(p => { const n = p.athlete?.displayName || ""; return n
            ? `<span class="pi-player pi-bench" role="button" tabindex="0" data-player="${esc(n)}">${esc(n)}</span>` : ""; })
          .filter(Boolean).join(", ");
        return `<div class="lineup-block">
          <div class="lineup-head"><span class="lineup-team">${esc(r.team?.displayName || "")}</span><span class="lineup-form">${esc(formation)}</span></div>
          <div class="pitch">${rows}</div>
          ${bench ? `<div class="mds-bench"><b>Bank:</b> ${bench}</div>` : ""}
        </div>`;
      };
      return `<div class="mds-sh">Aufstellung</div><div class="lineups-wrap">${rs.map(team).join("")}</div>`;
    }

    function renderEspnStats(sum) {
      const teams = sum.boxscore?.teams || [];
      if (teams.length < 2) return "";
      const map = t => { const o = {}; (t.statistics || []).forEach(s =>
        o[s.name || s.label] = { label: s.label || s.name, val: s.displayValue ?? s.value }); return o; };
      const A = map(teams[0]), B = map(teams[1]);
      const keys = [...new Set([...Object.keys(A), ...Object.keys(B)])];
      const num = v => { const n = parseFloat(String(v ?? "").replace(/[^\d.]/g, "")); return isNaN(n) ? 0 : n; };
      const rows = keys.map(k => {
        const la = A[k], lb = B[k]; const label = (la || lb).label || k;
        const av = la ? la.val : "–", bv = lb ? lb.val : "–";
        const an = num(av), bn = num(bv), tot = an + bn || 1;
        const hPct = (an / tot * 100).toFixed(0), aPct = (bn / tot * 100).toFixed(0);
        return `<div class="mds-stat">
          <span class="mds-sv">${esc(String(av))}</span>
          <div class="mds-smid">
            <div class="mds-sbars">
              <div class="mds-sb-h" style="width:${hPct}%"></div>
              <div class="mds-sb-a" style="width:${aPct}%"></div>
            </div>
            <span class="mds-slabel">${esc(label)}</span>
          </div>
          <span class="mds-sv">${esc(String(bv))}</span>
        </div>`;
      }).join("");
      return rows ? `<div class="mds-sh">Statistiken</div><div class="mds-stats">${rows}</div>` : "";
    }

    function closeModal() { $modal.hidden = true; document.body.style.overflow = ""; }
    $modal.addEventListener("click", e => { if (e.target.hasAttribute("data-close")) closeModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !$modal.hidden) closeModal(); });

    // ====== Events ============================================================
    // Theme toggle (Hell/Dunkel) – Auswahl in localStorage merken
    const $btnTheme = document.getElementById("btnTheme");
    const THEME_KEY = "wm2026-theme";
    function applyTheme(theme) {
      const light = theme === "light";
      document.body.classList.toggle("theme-light", light);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", light ? "#EEF1F6" : "#0F1115");
      if ($btnTheme) $btnTheme.title = light ? "Zu Dunkel wechseln" : "Zu Hell wechseln";
    }
    applyTheme(localStorage.getItem(THEME_KEY) || "dark");
    $btnTheme?.addEventListener("click", () => {
      const next = document.body.classList.contains("theme-light") ? "dark" : "light";
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    // Filter tabs
    document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
      document.querySelector(".tab.active")?.classList.remove("active");
      tab.classList.add("active"); currentFilter = tab.dataset.filter; render();
    }));

    // Search toggle
    const $searchWrap = document.getElementById("searchWrap");
    const $btnSearch = document.getElementById("btnSearch");
    $btnSearch.addEventListener("click", () => {
      const open = $searchWrap.classList.toggle("open");
      $btnSearch.classList.toggle("active", open);
      if (open) setTimeout(() => $search.focus(), 80);
      else { searchTerm = ""; $search.value = ""; render(); }
    });

    // ====== Countdown timer (updates every second) ============================
    function fmtCountdown(ms) {
      if (ms <= 0) return "Jetzt live";
      const s = Math.floor(ms / 1000) % 60;
      const mi = Math.floor(ms / 60000) % 60;
      const h = Math.floor(ms / 3600000) % 24;
      const d = Math.floor(ms / 86400000);
      if (d > 0) return `${d}T ${pad(h)}:${pad(mi)}:${pad(s)}`;
      return `${pad(h)}:${pad(mi)}:${pad(s)}`;
    }
    setInterval(() => {
      const now = Date.now();
      document.querySelectorAll(".muc-countdown[data-kickoff]").forEach(el => {
        const diff = +el.dataset.kickoff - now;
        el.textContent = fmtCountdown(diff);
        el.classList.toggle("soon", diff > 0 && diff < 3_600_000);
      });
    }, 1000);

    // ====== Notification system ===============================================
    const notifications = [];
    const $notifPanel  = document.getElementById("notifPanel");
    const $notifList   = document.getElementById("notifList");
    const $notifClear  = document.getElementById("notifClear");
    const $bellBtn     = document.getElementById("btnBell");
    const $toastArea   = document.getElementById("notifToastArea");

    const NOTIF_META = {
      goal:   { icon: "⚽", cls: "nt-goal",   label: "GOAL" },
      yellow: { icon: "🟨", cls: "nt-yellow", label: "GELBE KARTE" },
      red:    { icon: "🟥", cls: "nt-red",    label: "ROTE KARTE" },
      var:    { icon: "🔵", cls: "nt-var",    label: "VAR CHECK" },
      pen:    { icon: "🟠", cls: "nt-pen",    label: "ELFMETER" },
      lineup:  { icon: "📋", cls: "nt-lineup",  label: "AUFSTELLUNG" },
      kickoff: { icon: "▶️", cls: "nt-kickoff", label: "ANPFIFF" },
      fulltime:{ icon: "⏹",  cls: "nt-ft",      label: "ABPFIFF" },
    };

    function addNotification(type, title, detail, matchId) {
      const meta = NOTIF_META[type] || NOTIF_META.goal;
      const n = { type, title, detail, matchId, meta, time: new Date() };
      notifications.unshift(n);
      if (notifications.length > 30) notifications.pop();
      renderNotifPanel();
      showBellBadge();
      showToast(meta.icon + " " + title);
    }

    function renderNotifCard(n, compact = false) {
      const t = `${pad(n.time.getHours())}:${pad(n.time.getMinutes())}`;
      return `<div class="notif-card ${n.meta.cls}${compact ? " compact" : ""}" data-id="${esc(n.matchId || "")}">
        <div class="ni-icon">${n.meta.icon}</div>
        <div class="ni-body">
          <div class="ni-type">${n.meta.label}</div>
          <div class="ni-title">${esc(n.title)}</div>
          ${n.detail ? `<div class="ni-detail">${esc(n.detail)}</div>` : ""}
        </div>
        <span class="ni-time">${t}</span>
      </div>`;
    }

    function renderNotifPanel() {
      if (!notifications.length) {
        $notifList.innerHTML = `<div class="notif-empty">Keine neuen Benachrichtigungen</div>`;
        return;
      }
      $notifList.innerHTML = notifications.map((n, i) => renderNotifCard(n, i > 2)).join("");
      $notifList.querySelectorAll(".notif-card[data-id]").forEach(card => {
        card.addEventListener("click", () => { if (card.dataset.id) openMatch(card.dataset.id); });
      });
    }

    function showBellBadge() {
      if (!$bellBtn.querySelector(".notif-badge")) {
        const b = document.createElement("span"); b.className = "notif-badge";
        $bellBtn.appendChild(b);
      }
    }
    function clearBellBadge() {
      $bellBtn.querySelector(".notif-badge")?.remove();
    }

    function showToast(text) {
      const el = document.createElement("div"); el.className = "notif-toast";
      el.innerHTML = `<div class="notif-toast-inner">${esc(text)}</div>`;
      $toastArea.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    $notifClear.addEventListener("click", () => {
      notifications.length = 0; renderNotifPanel(); clearBellBadge();
    });

    // Notification bell toggle
    $bellBtn.addEventListener("click", () => {
      const open = $notifPanel.toggleAttribute("hidden") === false;
      // toggleAttribute returns true if attr was added (hidden), false if removed (visible)
      // Actually: if panel was hidden, toggleAttribute removes it → visible
      const isNowVisible = !$notifPanel.hasAttribute("hidden");
      $bellBtn.classList.toggle("active", isNowVisible);
      if (isNowVisible) { clearBellBadge(); }
    });
    // Close panel when clicking outside
    document.addEventListener("click", e => {
      if (!$notifPanel.hasAttribute("hidden") && !$notifPanel.contains(e.target) && e.target !== $bellBtn && !$bellBtn.contains(e.target)) {
        $notifPanel.setAttribute("hidden", ""); $bellBtn.classList.remove("active");
      }
    });

    let searchTimer;
    $search.addEventListener("input", e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { searchTerm = e.target.value.trim().toLowerCase(); render(); }, 200);
    });

    // Click on match card (delegation for both match types)
    $list.addEventListener("click", e => {
      if (e.target.closest("input, .tipps-card")) return; // Tipp-Eingabe öffnet kein Spiel-Detail
      const card = e.target.closest("[data-id]");
      if (card) openMatch(card.dataset.id);
    });
    $list.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      if (e.target.closest("input, .tipps-card")) return;
      const card = e.target.closest("[data-id]");
      if (card) { e.preventDefault(); openMatch(card.dataset.id); }
    });

    // Bottom nav
    document.querySelectorAll(".bnav-item").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".bnav-item").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const nav = btn.dataset.nav;
      const setTab = f => {
        document.querySelector(".tab.active")?.classList.remove("active");
        document.querySelector(`[data-filter="${f}"]`)?.classList.add("active");
      };
      const $tabs = document.querySelector(".filter-tabs");
      if (nav === "matches")        { currentFilter = "all";    setTab("all");    $tabs.style.display = ""; render(); }
      else if (nav === "live")      { currentFilter = "live";   setTab("live");   $tabs.style.display = ""; render(); }
      else if (nav === "standings") { currentFilter = "groups"; setTab("groups"); $tabs.style.display = ""; render(); }
      else if (nav === "tipps")     { currentFilter = "tipps";  document.querySelector(".tab.active")?.classList.remove("active"); $tabs.style.display = "none"; render(); }
      else if (nav === "teams")     { currentFilter = "teams";  document.querySelector(".tab.active")?.classList.remove("active"); $tabs.style.display = "none"; render(); }
      else if (nav === "profile")   { currentFilter = "profile";document.querySelector(".tab.active")?.classList.remove("active"); $tabs.style.display = "none"; render(); }
    }));

    // ====== Start & Auto-Refresh =============================================
    loadAll();
    setInterval(loadAll, REFRESH_MS);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll(); });

    // ====== PWA: Service Worker ==============================================
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => { });
      });
    }
  </script>

  <!-- ============================================================
       SPIELER-INFO POPUP (TheSportsDB) – verbunden mit der Aufstellung
       Tippen auf einen Spieler in der Aufstellung öffnet das Popup.
       ============================================================ -->
  <script>
  (function () {
    const PI_API_KEY = "123"; // TheSportsDB Free-Key
    const PI_BASE = `https://www.thesportsdb.com/api/v1/json/${PI_API_KEY}`;
    const piEsc = s => String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

    // ---------- Styles (nutzt App-Theme-Variablen) ----------
    const piStyle = document.createElement("style");
    piStyle.textContent = `
    .pi-backdrop { position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; transition: opacity .2s ease; }
    .pi-backdrop.pi-open { opacity: 1; }
    .pi-sheet { width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
      background: var(--card, #16181d); color: var(--text, #eee);
      border-radius: 20px 20px 0 0; padding: 14px 20px 28px;
      font-family: "Inter", system-ui, sans-serif;
      transform: translateY(40px); transition: transform .25s ease;
      box-shadow: 0 -8px 30px rgba(0,0,0,.5); }
    .pi-backdrop.pi-open .pi-sheet { transform: translateY(0); }
    .pi-handle { width: 40px; height: 4px; border-radius: 2px;
      background: var(--line-bright, #3a3d45); margin: 4px auto 16px; }
    .pi-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .pi-photo { width: 72px; height: 72px; border-radius: 50%;
      object-fit: cover; object-position: top; background: var(--card-2, #22252c);
      border: 2px solid var(--line, #2e3340); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
    .pi-name { font-family: "Cinzel", serif; font-size: 1.2rem; font-weight: 700; line-height: 1.2; }
    .pi-sub { font-size: .85rem; color: var(--muted, #9aa0ab); margin-top: 3px;
      display: flex; align-items: center; gap: 7px; }
    .pi-sub img { width: 22px; height: 15px; border-radius: 2px; object-fit: cover; }
    .pi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pi-card { background: var(--card-2, #1e2128); border: 1px solid var(--line, #262a33);
      border-radius: 12px; padding: 10px 12px; }
    .pi-card .pi-label { font-size: .7rem; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted-2, #8a909c); margin-bottom: 3px; }
    .pi-card .pi-value { font-size: .95rem; font-weight: 600; }
    .pi-card.pi-wide { grid-column: 1 / -1; }
    .pi-desc { grid-column: 1 / -1; font-size: .85rem; color: var(--muted, #b9bec8);
      line-height: 1.55; max-height: 150px; overflow-y: auto; }
    .pi-close { display: block; width: 100%; margin-top: 18px; padding: 12px;
      border: 1px solid var(--line-bright, #2e3340); border-radius: 12px;
      background: var(--card-2, #2e3340); color: var(--text, #fff);
      font-family: "Inter", sans-serif; font-size: .95rem; font-weight: 600; cursor: pointer; }
    .pi-close:hover { border-color: var(--gold, #e5b94e); }
    .pi-loading, .pi-error { text-align: center; padding: 34px 0; color: var(--muted, #9aa0ab); }
    .pi-spinner { width: 28px; height: 28px; margin: 0 auto 12px;
      border: 3px solid var(--line, #2e3340); border-top-color: var(--gold, #e5b94e);
      border-radius: 50%; animation: pi-spin .8s linear infinite; }
    @keyframes pi-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .pi-spinner { animation-duration: 2s; } }
    `;
    document.head.appendChild(piStyle);

    // ---------- Cache (schont das API-Limit) ----------
    const piCache = {};
    async function piFetchPlayer(idPlayer, name) {
      const cacheKey = idPlayer ? "id:" + idPlayer : "n:" + (name || "").toLowerCase();
      if (piCache[cacheKey]) return piCache[cacheKey];
      const url = idPlayer
        ? `${PI_BASE}/lookupplayer.php?id=${encodeURIComponent(idPlayer)}`
        : `${PI_BASE}/searchplayers.php?p=${encodeURIComponent(name)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("API-Fehler");
      const data = await res.json();
      const player = (data.players || data.player || [])[0];
      if (!player) throw new Error("nicht gefunden");
      piCache[cacheKey] = player;
      return player;
    }

    function piAge(dateBorn) {
      if (!dateBorn) return null;
      const b = new Date(dateBorn), now = new Date();
      let age = now.getFullYear() - b.getFullYear();
      const mm = now.getMonth() - b.getMonth();
      if (mm < 0 || (mm === 0 && now.getDate() < b.getDate())) age--;
      return age >= 0 && age < 60 ? age : null;
    }

    // ---------- Popup anzeigen (global, auch manuell aufrufbar) ----------
    async function showPlayerInfo(idPlayer, name = "") {
      const backdrop = document.createElement("div");
      backdrop.className = "pi-backdrop";
      backdrop.innerHTML = `
        <div class="pi-sheet">
          <div class="pi-handle"></div>
          <div class="pi-loading"><div class="pi-spinner"></div>Lade Spielerdaten…</div>
        </div>`;
      document.body.appendChild(backdrop);
      requestAnimationFrame(() => backdrop.classList.add("pi-open"));

      const close = () => { backdrop.classList.remove("pi-open"); setTimeout(() => backdrop.remove(), 250); };
      backdrop.addEventListener("click", e => { if (e.target === backdrop) close(); });
      document.addEventListener("keydown", function onEsc(ev) {
        if (ev.key === "Escape") { close(); document.removeEventListener("keydown", onEsc); }
      });
      const sheet = backdrop.querySelector(".pi-sheet");

      try {
        const p = await piFetchPlayer(idPlayer, name);
        const age = piAge(p.dateBorn);
        const photo = p.strCutout || p.strThumb || p.strRender || "";
        const desc = p.strDescriptionDE || p.strDescriptionEN || "";
        const born = p.dateBorn ? new Date(p.dateBorn).toLocaleDateString("de-DE") : "–";
        sheet.innerHTML = `
          <div class="pi-handle"></div>
          <div class="pi-head">
            ${photo ? `<img class="pi-photo" src="${piEsc(photo)}" alt="" onerror="this.outerHTML='<div class=&quot;pi-photo&quot;>👤</div>'">`
                    : `<div class="pi-photo">👤</div>`}
            <div>
              <div class="pi-name">${piEsc(p.strPlayer || name)}</div>
              <div class="pi-sub">${piEsc(p.strNationality || "")}${p.strNumber ? " · #" + piEsc(p.strNumber) : ""}</div>
            </div>
          </div>
          <div class="pi-grid">
            <div class="pi-card pi-wide"><div class="pi-label">Verein</div><div class="pi-value">${piEsc(p.strTeam || "–")}</div></div>
            <div class="pi-card"><div class="pi-label">Position</div><div class="pi-value">${piEsc(p.strPosition || "–")}</div></div>
            <div class="pi-card"><div class="pi-label">Alter</div><div class="pi-value">${age !== null ? age + " Jahre" : "–"}</div></div>
            <div class="pi-card"><div class="pi-label">Geboren</div><div class="pi-value">${piEsc(born)}</div></div>
            <div class="pi-card"><div class="pi-label">Größe</div><div class="pi-value">${piEsc(p.strHeight || "–")}</div></div>
            ${desc ? `<div class="pi-card pi-wide"><div class="pi-label">Über</div><div class="pi-desc">${piEsc(desc.slice(0,600))}${desc.length>600?"…":""}</div></div>` : ""}
          </div>
          <button class="pi-close">Schließen</button>`;
        sheet.querySelector(".pi-close").addEventListener("click", close);
      } catch (err) {
        sheet.innerHTML = `
          <div class="pi-handle"></div>
          <div class="pi-error">Keine Daten zu „${piEsc(name)}" gefunden.</div>
          <button class="pi-close">Schließen</button>`;
        sheet.querySelector(".pi-close").addEventListener("click", close);
      }
    }
    window.showPlayerInfo = showPlayerInfo;

    // ---------- Mit der Aufstellung verbinden (Event-Delegation) ----------
    const piTrigger = el => {
      const name = el?.dataset?.player;
      if (name) showPlayerInfo(null, name);
    };
    document.addEventListener("click", e => {
      const el = e.target.closest(".pi-player[data-player]");
      if (el) { e.stopPropagation(); piTrigger(el); }
    });
    document.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const el = e.target.closest?.(".pi-player[data-player]");
      if (el) { e.preventDefault(); e.stopPropagation(); piTrigger(el); }
    });
  })();
  </script>

  <!-- ============================================================
       MATCH-MITTEILUNGEN (TheSportsDB) – verbunden mit dem
       bestehenden Benachrichtigungsfeld (Glocke + Toasts).
       Meldet: 📋 Aufstellung · ▶️ Anpfiff · 🟥 Rote Karten · ⏹ Abpfiff
       Tore meldet die App bereits selbst (detectGoals) – hier deshalb
       standardmäßig AUS, sonst kämen Tor-Meldungen doppelt.
       ============================================================ -->
  <script>
  (function () {
    const MW_API_KEY = "123";
    const MW_BASE = `https://www.thesportsdb.com/api/v1/json/${MW_API_KEY}`;
    const MW_LEAGUE_ID = "4429";           // FIFA World Cup
    const MW_POLL_MS = 60000;              // alle 60 Sekunden prüfen
    const MW_LINEUP_WINDOW_MIN = 75;       // Aufstellung ab 75 Min. vor Anpfiff
    const MW_NOTIFY_GOALS = false;         // App meldet Tore schon selbst

    // ---------- Brücke zum bestehenden Benachrichtigungsfeld ----------
    // addNotification(type, title, detail, matchId) aus der Haupt-App.
    // Typ-Mapping: redcard→red, Rest hat eigene NOTIF_META-Einträge.
    const MW_TYPE = { goal: "goal", redcard: "red", lineup: "lineup",
                      kickoff: "kickoff", fulltime: "fulltime" };

    // Spiel in der App wiederfinden → Tippen auf die Mitteilung
    // öffnet das Spiel-Detail
    function mwFindMatchId(homeName, awayName) {
      const c = s => (s || "").trim().toLowerCase();
      const h = c(homeName), a = c(awayName);
      const hit = (typeof allMatches !== "undefined" ? allMatches : []).find(m =>
        (c(m.home) === h && c(m.away) === a) || (c(m.home) === a && c(m.away) === h));
      return hit ? hit.id : "";
    }

    // Schlaf-Modus respektieren: nur Spiele mit dem Lieblingsteam melden
    function mwAllowed(ev) {
      try {
        if (typeof sleepMode !== "undefined" && sleepMode) {
          const fav = (typeof FAV_TEAM !== "undefined" ? FAV_TEAM : "").toLowerCase();
          return [ev.strHomeTeam, ev.strAwayTeam]
            .some(t => (t || "").toLowerCase() === fav);
        }
      } catch { /* im Zweifel melden */ }
      return true;
    }

    function mwNotify(mwType, title, text, ev) {
      if (ev && !mwAllowed(ev)) return;
      const type = MW_TYPE[mwType] || "goal";
      const matchId = ev ? mwFindMatchId(ev.strHomeTeam, ev.strAwayTeam) : "";
      if (typeof addNotification === "function") {
        addNotification(type, title, text, matchId); // Feld + Toast + Glocke
      }
      mwBrowserNotify(title, text);
    }

    // Browser-Benachrichtigung (nur bei erteilter Erlaubnis,
    // auf dem iPhone nur als installierte PWA ab iOS 16.4)
    function mwBrowserNotify(title, text) {
      if (!("Notification" in window)) return;
      if (Notification.permission === "granted") {
        try { new Notification(title, { body: text, icon: "icon-192.png" }); }
        catch (e) { /* mobil ggf. nicht erlaubt – ignorieren */ }
      }
    }

    // ---------- Watcher-Logik ----------
    const MatchWatcher = (() => {
      let state = JSON.parse(localStorage.getItem("mw_state") || "{}");
      let timer = null;
      const save = () => localStorage.setItem("mw_state", JSON.stringify(state));

      const scoreText = ev =>
        `${ev.strHomeTeam} ${ev.intHomeScore ?? 0} : ${ev.intAwayScore ?? 0} ${ev.strAwayTeam}`;

      async function fetchTodayEvents() {
        const today = new Date().toISOString().slice(0, 10);
        const res = await fetch(`${MW_BASE}/eventsday.php?d=${today}&l=${MW_LEAGUE_ID}`);
        if (!res.ok) return [];
        const data = await res.json();
        return data.events || [];
      }

      // Rote Karten über die Timeline (liefert der Free-Key nicht immer –
      // dann wird still übersprungen)
      async function checkRedCards(ev, prev) {
        try {
          const res = await fetch(`${MW_BASE}/lookuptimeline.php?id=${ev.idEvent}`);
          if (!res.ok) return prev.redCards || 0;
          const data = await res.json();
          const reds = (data.timeline || []).filter(t =>
            (t.strTimeline || "").toLowerCase().includes("card") &&
            (t.strTimelineDetail || "").toLowerCase().includes("red"));
          if (reds.length > (prev.redCards || 0)) {
            const last = reds[reds.length - 1];
            mwNotify("redcard", "Rote Karte!",
              `${last.strPlayer || "Spieler"} (${last.strTeam || ""}) – ${ev.strHomeTeam} vs. ${ev.strAwayTeam}`, ev);
          }
          return reds.length;
        } catch { return prev.redCards || 0; }
      }

      async function checkLineup(ev, prev) {
        if (prev.lineupNotified) return true;
        try {
          const res = await fetch(`${MW_BASE}/lookuplineup.php?id=${ev.idEvent}`);
          if (!res.ok) return false;
          const data = await res.json();
          if (data.lineup && data.lineup.length > 0) {
            mwNotify("lineup", "Aufstellung ist da!",
              `${ev.strHomeTeam} vs. ${ev.strAwayTeam}${ev.strTime ? " – Anstoß " + ev.strTime.slice(0,5) + " Uhr" : ""}`, ev);
            return true;
          }
        } catch { /* ignorieren */ }
        return false;
      }

      const minutesUntilKickoff = ev =>
        ev.strTimestamp ? (new Date(ev.strTimestamp) - new Date()) / 60000 : Infinity;

      const isLive = ev => ["1H","2H","HT","ET","LIVE","P"]
        .some(x => (ev.strStatus || "").toUpperCase().includes(x));
      const isFinished = ev => ["FT","AET","PEN","FINISHED","MATCH FINISHED"]
        .some(x => (ev.strStatus || "").toUpperCase().includes(x));

      async function tick() {
        let events = [];
        try { events = await fetchTodayEvents(); }
        catch { return; } // Netzfehler: nächste Runde abwarten

        for (const ev of events) {
          const key = ev.idEvent;
          const prev = state[key] || {};
          const next = { ...prev };
          const mins = minutesUntilKickoff(ev);

          // 📋 Aufstellung (im Zeitfenster vor Anpfiff)
          if (!prev.lineupNotified && mins > 0 && mins <= MW_LINEUP_WINDOW_MIN) {
            next.lineupNotified = await checkLineup(ev, prev);
          }

          // ▶️ Anpfiff
          if (isLive(ev) && !prev.kickoffNotified) {
            mwNotify("kickoff", "Anpfiff!", `${ev.strHomeTeam} vs. ${ev.strAwayTeam}`, ev);
            next.kickoffNotified = true;
          }

          // ⚽ Tor (standardmäßig aus – siehe MW_NOTIFY_GOALS)
          const score = `${ev.intHomeScore ?? ""}:${ev.intAwayScore ?? ""}`;
          if (MW_NOTIFY_GOALS && isLive(ev) && prev.score && score !== prev.score && score !== ":") {
            mwNotify("goal", "TOOOR!", scoreText(ev), ev);
          }
          if (score !== ":") next.score = score;

          // 🟥 Rote Karten (nur bei Live-Spielen)
          if (isLive(ev)) next.redCards = await checkRedCards(ev, prev);

          // ⏹ Abpfiff
          if (isFinished(ev) && !prev.finishedNotified) {
            mwNotify("fulltime", "Abpfiff", "Endstand: " + scoreText(ev), ev);
            next.finishedNotified = true;
          }

          state[key] = next;
        }
        save();
      }

      return {
        start() {
          if ("Notification" in window && Notification.permission === "default") {
            Notification.requestPermission();
          }
          tick();
          timer = setInterval(tick, MW_POLL_MS);
        },
        stop() { clearInterval(timer); timer = null; }
      };
    })();

    window.MatchWatcher = MatchWatcher;
    MatchWatcher.start();
  })();
  </script>
