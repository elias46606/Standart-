      if (/\bfinal\b|finale/.test(s) && !/semi|quarter|halb|viertel/.test(s)) return "Finale";
      if (/semi|halbfinale/.test(s)) return "Halbfinale";
      if (/quarter|viertelfinale/.test(s)) return "Viertelfinale";
      if (/round of 16|last 16|achtelfinale/.test(s)) return "Achtelfinale";
      if (/round of 32|sechzehntel/.test(s)) return "Sechzehntelfinale";
      return null;
    }

    // ====== openfootball parsen ===============================================
    const teamName = t => typeof t === "string" ? t : (t?.name || t?.key || "");
    const teamCode = t => typeof t === "object" ? (t.code || t.fifa || "") : "";

    function parseKickoff(dateStr, timeStr) {
      if (!dateStr) return null;
      if (!timeStr) return new Date(`${dateStr}T00:00:00`);
      const m = String(timeStr).match(/(\d{1,2}):(\d{2})\s*(?:UTC\s*([+-]\d{1,2})(?::?(\d{2}))?)?/i);
      if (!m) return new Date(`${dateStr}T00:00:00`);
      const hh = m[1].padStart(2, "0"), mm = m[2];
      if (m[3] != null) {
        const sign = m[3][0];
        const oh = String(Math.abs(parseInt(m[3], 10))).padStart(2, "0");
        const om = (m[4] || "00").padStart(2, "0");
        return new Date(`${dateStr}T${hh}:${mm}:00${sign}${oh}:${om}`);
      }
      return new Date(`${dateStr}T${hh}:${mm}:00`);
    }

    function parseOpenFootball(data) {
      let list = [];
      if (Array.isArray(data.matches)) list = data.matches.map(m => ({ ...m }));
      else if (Array.isArray(data.rounds))
        list = data.rounds.flatMap(r => (r.matches || []).map(m => ({ ...m, round: m.round || r.name })));
      else return [];

      return list.map((m, i) => {
        const group = parseGroup(m.group);
        const stage = group ? null : detectStage(m.round || m.group);
        const h = teamName(m.team1), a = teamName(m.team2);
        const hc = teamCode(m.team1), ac = teamCode(m.team2);
        let hs = null, as = null;
        if (m.score && Array.isArray(m.score.ft)) { hs = m.score.ft[0]; as = m.score.ft[1]; }
        else if (m.score1 != null && m.score2 != null) { hs = m.score1; as = m.score2; }
        const date = parseKickoff(m.date, m.time);
        const finished = hs != null && as != null;
        const norm = arr => (Array.isArray(arr) ? arr : []).map(g => ({
          name: g.name || g.player || "", minute: g.minute ?? g.offset ?? null,
          penalty: !!g.penalty, owngoal: !!(g.owngoal || g.og), assist: g.assist || null,
        }));
        return {
          id: "of-" + (m.num ?? `${m.date}-${h}-${a}-${i}`), name: `${h} – ${a}`,
          home: h, away: a, homeBadge: flagUrl(hc, h), awayBadge: flagUrl(ac, a),
          homeScore: hs, awayScore: as, date,
          htScore: (m.score && Array.isArray(m.score.ht)) ? m.score.ht : null,
          homeGoals: norm(m.goals1), awayGoals: norm(m.goals2),
          venue: (m.ground || m.stadium?.name || m.city || ""),
          status: "", live: false, finished, kind: "wm", group, stage,
          round: m.round || "",
        };
      });
    }

    // ====== ESPN ==============================================================
    const espnNorm = s => String(s || "").toLowerCase().normalize("NFD")
      .replace(/[̀-ͯ]/g, "").replace(/[^a-z]/g, "");
    const ESPN_ALIAS = {
      unitedstates: "usa", usa: "usa",
      korearepublic: "southkorea", southkorea: "southkorea",
      iriran: "iran", iran: "iran",
      cotedivoire: "ivorycoast", ivorycoast: "ivorycoast",
      caboverde: "capeverde", capeverde: "capeverde",
      czechrepublic: "czechia", czechia: "czechia",
      turkey: "turkiye", turkiye: "turkiye",
      congodr: "drcongo", drcongo: "drcongo",
    };
    const espnCanon = n => { const x = espnNorm(n); return ESPN_ALIAS[x] || x; };
    const ymd = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;

    async function espnJson(url) {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }
    async function espnScoreboard(league, yyyymmdd) {
      try {
        const d = await espnJson(`${ESPN_BASE}/${league}/scoreboard${yyyymmdd ? "?dates=" + yyyymmdd : ""}`);
        return d.events || [];
      } catch { return []; }
    }

    function normalizeESPN(ev, kind) {
      const c = ev.competitions?.[0]; if (!c) return null;
      const cs = c.competitors || [];
      const home = cs.find(x => x.homeAway === "home") || cs[0];
      const away = cs.find(x => x.homeAway === "away") || cs[1];
      if (!home?.team || !away?.team) return null;
      const st = c.status || ev.status || {};
      const state = st.type?.state;
      const hName = home.team.displayName || home.team.name || "";
      const aName = away.team.displayName || away.team.name || "";
      const hs = home.score != null ? parseInt(home.score, 10) : null;
      const as = away.score != null ? parseInt(away.score, 10) : null;
      return {
        id: "espn-" + ev.id, espnId: ev.id, espnLeague: ESPN_LEAGUE[kind] || ESPN_LEAGUE.test,
        name: `${hName} – ${aName}`, home: hName, away: aName,
        homeBadge: flagUrl("", hName) || home.team.logo || "",
        awayBadge: flagUrl("", aName) || away.team.logo || "",
        homeScore: state === "pre" ? null : hs, awayScore: state === "pre" ? null : as,
        date: ev.date ? new Date(ev.date) : null,
        venue: c.venue?.fullName || "",
        status: st.type?.shortDetail || st.type?.description || "",
        live: state === "in", finished: state === "post",
        kind, group: null, stage: null, homeGoals: [], awayGoals: [], htScore: null,
      };
    }

    const inWindow = m => m.date && m.date >= WINDOW_START && m.date <= WINDOW_END;

    // ====== Laden =============================================================
    async function loadWM() {
      for (const url of WM_SOURCES) {
        try {
          const data = await fetchJSON(url, 1);
          const parsed = parseOpenFootball(data);
          if (parsed.length) return parsed;
        } catch { }
      }
      return [];
    }
    async function loadTests() {
      const evs = await espnScoreboard(ESPN_LEAGUE.test);
      return evs.map(e => normalizeESPN(e, "test")).filter(Boolean);
    }
    // Live-/Tagesdaten der WM von ESPN – openfootball ist nur der statische
    // Spielplan und kennt weder Live-Status noch Zwischenstände
    async function loadWMLive() {
      const evs = await espnScoreboard(ESPN_LEAGUE.wm);
      return evs.map(e => normalizeESPN(e, "wm")).filter(Boolean);
    }

    async function loadAll() {
      try {
        const [wm, tests, wmLive] = await Promise.all([loadWM(), loadTests(), loadWMLive()]);

        // ESPN-Livedaten in den Spielplan einspielen (Match über Teamnamen
        // in beliebiger Heim/Auswärts-Reihenfolge, Anstoß ±30 Std.)
        const near = (a, b) => a != null && b != null && Math.abs(a - b) < 30 * 36e5;
        for (const le of wmLive) {
          const hit = wm.find(m =>
            near(m.date?.getTime(), le.date?.getTime()) && (
              (espnCanon(m.home) === espnCanon(le.home) && espnCanon(m.away) === espnCanon(le.away)) ||
              (espnCanon(m.home) === espnCanon(le.away) && espnCanon(m.away) === espnCanon(le.home))));
          if (hit) {
            const sw = espnCanon(hit.home) !== espnCanon(le.home); // vertauschte Seiten?
            hit.live = le.live; hit.status = le.status;
            hit.espnId = le.espnId; hit.espnLeague = le.espnLeague;
            const hs = sw ? le.awayScore : le.homeScore;
            const as = sw ? le.homeScore : le.awayScore;
            if (hs != null) hit.homeScore = hs;
            if (as != null) hit.awayScore = as;
            if (le.finished) hit.finished = true;
            if (!hit.venue && le.venue) hit.venue = le.venue;
          } else {
            wm.push(le); // Spiel fehlt im openfootball-Plan → trotzdem anzeigen
          }
        }

        let merged = wm.concat(tests);
        if (!merged.length) throw new Error("Keine Daten verfügbar");

        merged = merged.filter(m => m.kind === "wm" ? (!m.date || inWindow(m)) : inWindow(m));
        const seen = new Set();
        merged = merged.filter(m => m.id && !seen.has(m.id) && seen.add(m.id));
        merged.sort((a, b) => (a.date?.getTime() || Infinity) - (b.date?.getTime() || Infinity));

        const map = {};
        for (const m of merged) if (m.kind === "wm" && m.group) { map[m.home] = m.group; map[m.away] = m.group; }
        for (const m of merged) if (m.kind === "wm" && !m.group && !m.stage)
          m.group = map[m.home] || map[m.away] || null;

        detectGoals(merged);
        allMatches = merged; teamGroup = map;
        localStorage.setItem(CACHE_KEY, JSON.stringify(
          merged.map(s => ({ ...s, date: s.date ? s.date.toISOString() : null }))));
        render(); setUpdated();
        updatePhaseLabel();
      } catch (err) {
        const c = loadCache();
        if (c) { allMatches = c; render(); $currentPhase.textContent = "OFFLINE · CACHE"; }
        else { $list.innerHTML = `<div class="error">⚠️ Spiele konnten nicht geladen werden.<br>(${esc(err.message)})</div>`; $currentPhase.textContent = "FEHLER"; }
      }
    }
    // Konfetti-Animation (3 s), reines Canvas/JS – fällt von oben, mobil-tauglich.
    let _confettiActive = false;
    function launchConfetti() {
      if (_confettiActive) return;
      _confettiActive = true;

      const cv = document.createElement("canvas");
      cv.className = "confetti-canvas";
      document.body.appendChild(cv);
      const ctx = cv.getContext("2d");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const resize = () => {
        cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
        cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };
      resize();
      window.addEventListener("resize", resize);

      const colors = ["#D8B964", "#F0D68F", "#34D399", "#3B82F6", "#EC4899", "#FF4D5E", "#FFFFFF"];
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const W = () => innerWidth;
      // Partikelanzahl an Bildschirmbreite koppeln (mobil weniger)
      const COUNT = reduce ? 40 : Math.round(Math.min(180, Math.max(80, W() / 4)));
      const parts = Array.from({ length: COUNT }).map(() => ({
        x: Math.random() * W(),
        y: -20 - Math.random() * innerHeight * 0.5,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        vy: 2.2 + Math.random() * 3.2,
        vx: -1.2 + Math.random() * 2.4,
        rot: Math.random() * Math.PI,
        vr: -0.18 + Math.random() * 0.36,
        color: colors[(Math.random() * colors.length) | 0],
      }));

      const DURATION = 3000;
      const start = performance.now();
      let raf;
      const frame = now => {
        const t = now - start;
        ctx.clearRect(0, 0, cv.width, cv.height);
        // letzte 600 ms ausblenden
        ctx.globalAlpha = t > DURATION - 600 ? Math.max(0, (DURATION - t) / 600) : 1;
        for (const p of parts) {
          p.x += p.vx; p.y += p.vy; p.rot += p.vr;
          p.vx += (Math.random() - 0.5) * 0.06; // leichtes Flattern
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        if (t < DURATION) { raf = requestAnimationFrame(frame); }
        else { cleanup(); }
      };
      const cleanup = () => {
        cancelAnimationFrame(raf);
        window.removeEventListener("resize", resize);
        cv.remove();
        _confettiActive = false;
      };
      raf = requestAnimationFrame(frame);
    }

    // Tor-Erkennung + Sieg-Erkennung: vergleicht Spielstände/Status zwischen zwei
    // Aktualisierungen. Tor → Benachrichtigung; Live→Abpfiff mit Sieg des
    // Lieblingsteams → Konfetti.
    let _goalSnap = null, _liveSnap = null;
    function detectGoals(matches) {
      const snap = new Map();
      const liveSnap = new Map();
      for (const m of matches) {
        if (m.homeScore == null || m.awayScore == null) continue;
        snap.set(m.id, `${m.homeScore}-${m.awayScore}`);
      }
      for (const m of matches) liveSnap.set(m.id, !!m.live);

      if (_goalSnap && notifyGoals) {
        for (const m of matches) {
          if (!m.live) continue;
          const cur = snap.get(m.id), prev = _goalSnap.get(m.id);
          if (!cur || !prev || cur === prev) continue;
          const [ph, pa] = prev.split("-").map(Number);
          const [ch, ca] = cur.split("-").map(Number);
          if (ch + ca > ph + pa) {
            const fav = isFav(m.home) || isFav(m.away);
            // Schlaf-Modus: nur Benachrichtigungen für Lieblingsteam in Verlängerung/ET
            if (sleepMode) {
              if (!fav) continue;
              const min = parseInt(m.status) || 0;
              const inET = min > 90 || /ET|AET|extra|verlängerung/i.test(m.status || "");
              if (!inET) continue;
            }
            const scorer = ch > ph ? m.home : m.away;
            addNotification("goal",
              `${m.home} ${ch}:${ca} ${m.away}`,
              `${fav ? "★ " : ""}Tor für ${scorer}${m.status ? " · " + m.status : ""}`,
              m.id);
          }
        }
      }

      // Live → Abpfiff und Lieblingsteam hat gewonnen → Konfetti
      if (_liveSnap) {
        for (const m of matches) {
          const wasLive = _liveSnap.get(m.id);
          if (!wasLive || m.live || !m.finished) continue;
          const hs = m.homeScore, as = m.awayScore;
          if (hs == null || as == null) continue;
          const favWon = (isFav(m.home) && hs > as) || (isFav(m.away) && as > hs);
          if (favWon) {
            const winner = hs > as ? m.home : m.away;
            addNotification("goal", `${m.home} ${hs}:${as} ${m.away}`,
              `🎉 ${winner} hat gewonnen!`, m.id);
            launchConfetti();
          }
        }
      }

      _goalSnap = snap;
      _liveSnap = liveSnap;
    }

    function loadCache() {
      try {
        const raw = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        return raw ? raw.map(m => ({ ...m, date: m.date ? new Date(m.date) : null })) : null;
      } catch { return null; }
    }

    // ====== Phase Label =======================================================
    function updatePhaseLabel() {
      const now = new Date();
      const live = allMatches.filter(m => m.live);
      if (live.length) {
        const phases = [...new Set(live.map(m => matchPhaseLabel(m)))];
        $currentPhase.textContent = phases[0] || "Live";
        return;
      }
      // Find the most recent or next WM match to determine phase
      const wmMatches = allMatches.filter(m => m.kind === "wm" && m.date);
      const recent = wmMatches.filter(m => m.finished).slice(-3);
      const upcoming = wmMatches.filter(m => !m.finished && !m.live && m.date >= now).slice(0, 3);
      const candidates = [...recent, ...upcoming];
      if (!candidates.length) { $currentPhase.textContent = "WM 2026"; return; }
      // Prefer a stage label (KO) over group
      for (const m of candidates) {
        if (m.stage) { $currentPhase.textContent = m.stage; return; }
      }
      const hasGroup = candidates.some(m => m.group);
      if (hasGroup) { $currentPhase.textContent = "Gruppenphase"; return; }
      $currentPhase.textContent = "WM 2026";
    }

    function matchPhaseLabel(m) {
      if (m.stage) return m.stage;
      if (m.group) return `Gruppe ${m.group}`;
      if (m.kind === "test") return "Testspiel";
      return "WM 2026";
    }

    // Fallback-Map: Spieltag je Match-ID aus Datums-Reihenfolge innerhalb der Gruppe
    // (4er-Gruppe → 6 Spiele, 2 pro Spieltag). Memoisiert pro allMatches-Referenz.
    let _mdMap = null, _mdMapSrc = null;
    function matchdayMap() {
      if (_mdMap && _mdMapSrc === allMatches) return _mdMap;
      const byGroup = {};
      for (const m of allMatches) {
        if (m.kind === "wm" && m.group && !m.stage) (byGroup[m.group] ||= []).push(m);
      }
      const map = {};
      for (const g of Object.keys(byGroup)) {
        const list = byGroup[g].slice().sort((a, b) =>
          (a.date?.getTime() || Infinity) - (b.date?.getTime() || Infinity));
        const perMd = Math.max(1, Math.round(list.length / 3)); // 6 → 2 pro Spieltag
        list.forEach((m, i) => { map[m.id] = Math.floor(i / perMd) + 1; });
      }
      _mdMap = map; _mdMapSrc = allMatches;
      return map;
    }

    // Spieltag-Nummer (1–3) eines Gruppenspiels: zuerst aus round-Feld, sonst Fallback
    function groupMatchday(m) {
      if (m.kind !== "wm" || !m.group) return null;
      const r = (m.round || "").toLowerCase();
      let mm = r.match(/(?:matchday|spieltag|fixtures?|md|round)\s*(\d+)/);
      if (!mm) mm = r.match(/\b([1-3])\b/);
      if (mm) return parseInt(mm[1], 10);
      const md = matchdayMap()[m.id];
      return md && md <= 3 ? md : null;
    }

    // Zwischenüberschrift für einen Match-Block in der Matches-Liste
    function sectionSubHead(m) {
      if (m.kind === "wm" && m.group) {
        const md = groupMatchday(m);
        return md ? { key: `md-${md}`, label: `${md}. Spieltag`, sub: "Gruppenphase" } : null;
      }
      if (m.kind === "wm" && m.stage) {
        return { key: `st-${m.stage}`, label: m.stage, sub: "K.-o.-Phase" };
      }
      return null;
    }

    // HTML für eine Zwischenüberschrift: Spieltag/Phase (WM) oder Monat (sonst)
    function sectionHeadHtml(sh, m, fallbackMonth) {
      if (sh) {
        return `<div class="matchday-head">
          <span class="md-num">${esc(sh.label)}</span>
          <span class="md-sub">${esc(sh.sub)}</span>
        </div>`;
      }
      const mk = m.date ? `${MONTHS[m.date.getMonth()]} ${m.date.getFullYear()}` : fallbackMonth;
      return `<div class="month-head">${mk}</div>`;
    }

    // ====== Gruppentabellen ===================================================
    function computeGroups() {
      const groups = {};
      const ensure = (g, name, badge) => {
        groups[g] = groups[g] || {};
        groups[g][name] = groups[g][name] ||
          { team: name, badge: badge || "", p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[] };
        if (badge && !groups[g][name].badge) groups[g][name].badge = badge;
        return groups[g][name];
      };
      for (const m of allMatches) if (m.kind === "wm" && m.group) {
        ensure(m.group, m.home, m.homeBadge); ensure(m.group, m.away, m.awayBadge);
      }
      // Live-Tabelle: laufende Spiele zählen mit aktuellem Zwischenstand mit –
      // so sieht man während des Spiels, wer gerade vorn liegt
      const counted = allMatches.filter(m => m.kind === "wm" && m.group
        && (m.finished || m.live) && m.homeScore != null && m.awayScore != null)
        .sort((a, b) => (a.date?.getTime() || 0) - (b.date?.getTime() || 0));
      for (const m of counted) {
        const h = ensure(m.group, m.home, m.homeBadge), a = ensure(m.group, m.away, m.awayBadge);
        const hs = +m.homeScore, as = +m.awayScore;
        h.p++; a.p++; h.gf += hs; h.ga += as; a.gf += as; a.ga += hs;
        if (hs > as) { h.w++; a.l++; h.pts += 3; }
        else if (hs < as) { a.w++; h.l++; a.pts += 3; }
        else { h.d++; a.d++; h.pts++; a.pts++; }
        if (m.live) {
          // Live-Markierung statt Form-Eintrag (Spiel ist noch nicht vorbei)
          h.live = { score: `${hs}:${as}`, status: m.status };
          a.live = { score: `${as}:${hs}`, status: m.status };
        } else {
          const r = hs > as ? ["w", "l"] : hs < as ? ["l", "w"] : ["d", "d"];
          h.form.push(r[0]); a.form.push(r[1]);
        }
      }
      const out = {};
      for (const g of Object.keys(groups).sort())
        out[g] = Object.values(groups[g]).sort((x, y) =>
          y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || x.team.localeCompare(y.team));
      return out;
    }

    // ====== Torschützenliste ==================================================
    function computeScorers() {
      const map = {};
      const add = (g, team, badge) => {
        if (!g.name || g.owngoal) return;
        const key = g.name + "|" + team;
        const s = map[key] || (map[key] = { name: g.name, team, badge, goals: 0, pens: 0, assists: 0 });
        s.goals++; if (g.penalty) s.pens++;
      };
      const addAssist = (g, team, badge) => {
        if (!g.assist) return;
        const key = g.assist + "|" + team;
        const s = map[key] || (map[key] = { name: g.assist, team, badge, goals: 0, pens: 0, assists: 0 });
        s.assists++;
      };
      for (const m of allMatches) {
        if (m.kind !== "wm") continue;
        (m.homeGoals || []).forEach(g => { add(g, m.home, m.homeBadge); addAssist(g, m.home, m.homeBadge); });
        (m.awayGoals || []).forEach(g => { add(g, m.away, m.awayBadge); addAssist(g, m.away, m.awayBadge); });
      }
      return Object.values(map).sort((a, b) =>
        b.goals - a.goals || b.assists - a.assists || a.name.localeCompare(b.name));
    }

    function renderScorers() {
      let list = computeScorers();
      if (searchTerm) list = list.filter(s =>
        s.name.toLowerCase().includes(searchTerm) || s.team.toLowerCase().includes(searchTerm));
      const anyAssist = list.some(s => s.assists > 0);
      if (!list.length) {
        $list.innerHTML = `<div class="empty">Noch keine Tore.<br>
          Die Torschützenliste füllt sich automatisch, sobald gespielt wird.</div>`;
        return;
      }
      const rows = list.slice(0, 100).map((s, i) => `
        <tr>
          <td><span class="rankcell">${i + 1}</span></td>
          <td class="t"><span class="team-cell">${flag(s.badge)}<span>${esc(s.name)}${isFav(s.team) ? ' <span class="fav-star">★</span>' : ""}</span></span></td>
          <td class="t" style="color:var(--muted)">${esc(s.team)}</td>
          <td class="g">${s.goals}</td>
          <td>${s.pens || ""}</td>
          <td>${anyAssist ? (s.assists || "") : "–"}</td>
        </tr>`).join("");
      $list.innerHTML = `<div class="scorers"><table class="scorers-tbl">
        <thead><tr><th></th><th class="t">Spieler</th><th class="t">Team</th>
          <th>Tore</th><th>11m</th><th>Vorlagen</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
        ${anyAssist ? "" : `<div class="legend" style="margin-top:12px">Vorlagen sind in der freien Datenquelle nicht enthalten.</div>`}`;
    }

    // ====== Rendering =========================================================
    const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli",
                    "August","September","Oktober","November","Dezember"];
    const WEEKDAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];

    function flag(url) {
      return url
        ? `<img class="flag" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;flag-fallback&quot;></span>'">`
        : `<span class="flag-fallback"></span>`;
    }

    function flagLarge(url) {
      return url
        ? `<img class="mlc-flag" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;mlc-flag-fb&quot;></span>'">`
        : `<span class="mlc-flag-fb"></span>`;
    }

    // ---- Live card helpers ---------------------------------------------------

    function liveCardState(m) {
      const statusText = (m.status || "").toUpperCase();
      // VAR keyword in status
      if (/\bVAR\b/.test(statusText)) return "state-var";
      // Red card keyword in status (ESPN shortDetail can say "Red Card" etc.)
      if (/RED\s*CARD|RC\b/.test(statusText)) return "state-redcard";
      // Score changed since last render → goal flash
      const key = m.id;
      const curr = `${m.homeScore ?? ""}-${m.awayScore ?? ""}`;
      const prev = _prevScores.get(key);
      _prevScores.set(key, curr);
      if (prev !== undefined && prev !== curr) return "state-goal";
      return "";
    }

    function buildTimeline(m) {
      // Collect all events from existing goal data
      const evs = [];
      const pushGoal = (g, side) => {
        if (g.minute == null) return;
        const cls  = g.owngoal ? "ev-og" : g.penalty ? "ev-pen" : "ev-goal";
        const icon = g.owngoal ? "⚽🔴" : "⚽";
        const suffix = g.owngoal ? " ET" : g.penalty ? " E" : "";
        evs.push({ minute: g.minute, side, cls, icon, label: suffix, name: g.name });
      };
      (m.homeGoals || []).forEach(g => pushGoal(g, "home"));
      (m.awayGoals  || []).forEach(g => pushGoal(g, "away"));

      // liveEvents may exist on ESPN-enriched matches in future; handle if present
      for (const e of (m.liveEvents || [])) {
        if (e.minute == null) continue;
        const typeMap = { yellow:"ev-yellow", red:"ev-red", sub:"ev-sub", var:"ev-var" };
        const iconMap = { yellow:"🟨", red:"🟥", sub:"🔄", var:"🔵" };
        const t = e.type || "";
        evs.push({ minute: e.minute, side: e.side || "", cls: typeMap[t] || "ev-sub",
          icon: iconMap[t] || "•", label: "", name: e.name || "" });
      }

      evs.sort((a, b) => a.minute - b.minute);

      if (!evs.length) return "";

      const chips = evs.map(e =>
        `<span class="tl-ev ${e.cls}" title="${esc(e.name)}">${e.icon} ${e.minute}'${e.label}</span>`
      ).join("");
      return `<div class="mlc-timeline">${chips}</div>`;
    }

    // Live Match Card: score is the dominant element
    function renderLiveCard(m) {
      const hs = m.homeScore ?? 0, as = m.awayScore ?? 0;
      const phase = matchPhaseLabel(m);
      const minute = m.status ? esc(m.status) : "LIVE";
      const state  = liveCardState(m);

      // Right side of topbar: VAR badge or normal status pill
      const isVar = state === "state-var";
      const statusRight = isVar
        ? `<span class="mlc-var-badge">🔵 VAR</span>`
        : `<span class="mlc-status-pill"><span class="mlc-pulse"></span>${minute}</span>`;

      // Last goal event summary (below score body)
      const allGoals = [
        ...(m.homeGoals || []).map(g => ({ ...g, team: m.home })),
        ...(m.awayGoals || []).map(g => ({ ...g, team: m.away })),
      ].filter(g => g.minute != null).sort((a, b) => b.minute - a.minute);
      const last = allGoals[0];
      const lastEventHtml = last
        ? `⚽ ${last.minute}' <strong>${esc(last.name)}</strong><span style="color:var(--muted)"> · ${esc(last.team)}</span>${last.penalty ? `<span style="color:var(--muted-2)"> (E)</span>` : ""}`
        : `<span style="color:var(--muted-2)">Kein Tor</span>`;

      const timeline = buildTimeline(m);

      return `
        <div class="match-live ${state}" data-id="${esc(m.id)}" role="button" tabindex="0" style="${cardGradient(m.home,m.away)}">
          <div class="mlc-topbar">
            <span class="mlc-phase">${esc(phase)}</span>
            ${nightBadge(m)}${statusRight}
          </div>
          <div class="mlc-body">
            <div class="mlc-team">
              ${flagLarge(m.homeBadge)}
              <span class="mlc-name">${esc(m.home)}</span>
            </div>
            <div class="mlc-score-block">
              <div class="mlc-score">${hs}&thinsp;:&thinsp;${as}</div>
              <div class="mlc-minute">${minute}</div>
            </div>
            <div class="mlc-team away">
              ${flagLarge(m.awayBadge)}
              <span class="mlc-name">${esc(m.away)}</span>
            </div>
          </div>
          ${timeline || `<div class="mlc-last-event">${lastEventHtml}</div>`}
          ${tvInfo(m) ? `<div class="mlc-tv">${tvBadge(m)}</div>` : ""}
        </div>`;
    }

    function flagMed(url) {
      return url
        ? `<img class="muc-flag" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;muc-flag-fb&quot;></span>'">`
        : `<span class="muc-flag-fb"></span>`;
    }
    function flagSm(url, cls = "mfc-tflag", fb = "mfc-tflag-fb") {
      return url
        ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;${fb}&quot;></span>'">`
        : `<span class="${fb}"></span>`;
    }

    function renderUpcomingCard(m) {
      const d = m.date;
      const phase = matchPhaseLabel(m);
      const favH = isFav(m.home), favA = isFav(m.away);
      const timeStr = d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : "–:––";
      const dateStr = d ? `${WEEKDAYS[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}` : "Termin offen";
      const kickoffMs = d ? d.getTime() : null;

      let kindTag = "";
      if (m.kind === "wm" && m.group) kindTag = `<span class="tag grp" style="margin-left:4px">Gruppe ${m.group}</span>`;
      else if (m.kind === "wm")       kindTag = `<span class="tag ko" style="margin-left:4px">${esc(m.stage) || "WM"}</span>`;
      else                            kindTag = `<span class="tag test" style="margin-left:4px">Testspiel</span>`;

      return `
        <div class="match-upcoming ${favH || favA ? "is-fav" : ""}" data-id="${esc(m.id)}" role="button" tabindex="0" style="${cardGradient(m.home,m.away)}">
          <div class="muc-topbar">
            <span class="muc-phase">${esc(phase)}</span>
            ${nightBadge(m)}${kindTag}
          </div>
          <div class="muc-body">
            <div class="muc-team">
              ${flagMed(m.homeBadge)}
              <span class="muc-name">${esc(m.home)}${favH ? " ★" : ""}</span>
            </div>
            <div class="muc-center">
              <div class="muc-time">${timeStr}</div>
              <div class="muc-date">${dateStr}</div>
              <div class="muc-vs">vs</div>
              ${kickoffMs ? `<div class="muc-countdown" data-kickoff="${kickoffMs}">…</div>` : ""}
            </div>
            <div class="muc-team">
              ${flagMed(m.awayBadge)}
              <span class="muc-name">${esc(m.away)}${favA ? " ★" : ""}</span>
            </div>
          </div>
          ${m.venue || tvInfo(m) ? `<div class="muc-footer">${m.venue ? "📍 " + esc(m.venue) : ""}${m.venue && tvInfo(m) ? " · " : ""}${tvBadge(m)}</div>` : ""}
        </div>`;
    }

    function renderFinishedCard(m) {
      const d = m.date;
      const hs = +(m.homeScore), as = +(m.awayScore);
      const homeWin = hs > as, awayWin = as > hs, draw = hs === as;
      const resCls = homeWin ? "res-home" : awayWin ? "res-away" : "res-draw";
      const phase = matchPhaseLabel(m);
      const favH = isFav(m.home), favA = isFav(m.away);

      // Result bar widths: home share of "dominance"
      const tot = hs + as || 1;
      const hPct = homeWin ? Math.max(55, (hs / tot * 100).toFixed(0)) : draw ? 50 : Math.min(45, (hs / tot * 100).toFixed(0));
      const barHtml = homeWin
        ? `<div class="mfc-bar-h" style="width:${hPct}%"></div><div class="mfc-bar-a" style="flex:1"></div>`
        : awayWin
        ? `<div class="mfc-bar-h" style="flex:1"></div><div class="mfc-bar-a" style="width:${100 - hPct}%"></div>`
        : `<div class="mfc-bar-d" style="flex:1"></div>`;

      const dateStr = d ? `${d.getDate()}. ${MONTHS[d.getMonth()]}` : "";

      return `
        <div class="match-finished ${resCls} ${favH || favA ? "is-fav" : ""}" data-id="${esc(m.id)}" role="button" tabindex="0" style="${cardGradient(m.home,m.away)}">
          <div class="mfc-header">
            <span class="mfc-phase">${esc(phase)}${dateStr ? " · " + dateStr : ""}</span>
            ${nightBadge(m)}<span class="mfc-ft">FT</span>
          </div>
          <div class="mfc-body">
            <div class="mfc-team home">
              ${flagSm(m.homeBadge)}
              <span class="mfc-tname ${homeWin ? "winner" : awayWin ? "" : ""}">${esc(m.home)}${favH ? " ★" : ""}</span>
            </div>
            <div class="mfc-score-block">
              <div class="mfc-score">${hs} : ${as}</div>
            </div>
            <div class="mfc-team away">
              ${flagSm(m.awayBadge)}
              <span class="mfc-tname ${awayWin ? "winner" : ""}">${esc(m.away)}${favA ? " ★" : ""}</span>
            </div>
          </div>
          <div class="mfc-result-bar">${barHtml}</div>
          <div class="mfc-footer">
            <span class="mfc-venue">${m.venue ? "📍 " + esc(m.venue) : ""}</span>
            <button class="mfc-stats-btn">Statistiken →</button>
          </div>
        </div>`;
    }

    // Keep for fallback (live cards in non-"all" filter views)
    function renderMatch(m) {
      if (m.live) return renderLiveCard(m);
      if (m.finished) return renderFinishedCard(m);
      return renderUpcomingCard(m);
    }

    function render() {
      if (currentFilter === "groups") return renderGroups();
      if (currentFilter === "scorers") return renderScorers();
      if (currentFilter === "teams") return renderBracket();
      if (currentFilter === "profile") return renderProfile();
      if (currentFilter === "tipps") return renderTipps();

      const now = new Date();
      let matches = allMatches.filter(applyFilter);

      if (!matches.length) {
        $list.innerHTML = `<div class="empty">Keine Spiele für diese Auswahl.</div>`;
        return;
      }

      const live     = matches.filter(m => m.live);
      const upcoming = matches.filter(m => !m.live && !m.finished && (!m.date || m.date >= now));
      const finished = matches.filter(m => !m.live && (m.finished || (m.date && m.date < now && !m.live)));

      let html = "";

      // 1. Live section (always first)
      if (live.length) {
        html += `<div class="section-head live"><span class="sh-live-dot"></span>Live jetzt</div>`;
        html += live.map(renderLiveCard).join("");
      }

      // 2. Upcoming section
      if (upcoming.length) {
        html += `<div class="section-head upcoming">Kommend</div>`;
        let lastKey = "";
        for (const m of upcoming) {
          const sh = sectionSubHead(m);
          const key = sh ? sh.key : (m.date ? `mo-${m.date.getFullYear()}-${m.date.getMonth()}` : "offen");
          if (key !== lastKey) { html += sectionHeadHtml(sh, m, "Termin offen"); lastKey = key; }
          html += renderUpcomingCard(m);
        }
      }

      // 3. Finished section
      if (finished.length) {
        html += `<div class="section-head finished">Abgeschlossen</div>`;
        const finishedDesc = [...finished].sort((a, b) => (b.date?.getTime() || 0) - (a.date?.getTime() || 0));
        let lastKey = "";
        for (const m of finishedDesc) {
          const sh = sectionSubHead(m);
          const key = sh ? sh.key : (m.date ? `mo-${m.date.getFullYear()}-${m.date.getMonth()}` : "offen");
          if (key !== lastKey) { html += sectionHeadHtml(sh, m, "–"); lastKey = key; }
          html += renderFinishedCard(m);
        }
      }

      $list.innerHTML = html || `<div class="empty">Keine Spiele für diese Auswahl.</div>`;
    }

    function applyFilter(m) {
      if (searchTerm) {
        const hay = `${m.home} ${m.away} ${m.group ? "gruppe " + m.group : ""}`.toLowerCase();
        if (!hay.includes(searchTerm)) return false;
      }
      switch (currentFilter) {
        case "wm":       return m.kind === "wm";
        case "test":     return m.kind === "test";
        case "live":     return m.live;
        case "upcoming": return !m.finished && !m.live && m.date && m.date >= new Date();
        default:         return true;
      }
    }

    function renderGroups() {
      const groups = computeGroups();
      let keys = Object.keys(groups);
      if (searchTerm) keys = keys.filter(g => `gruppe ${g}`.includes(searchTerm) ||
        groups[g].some(t => t.team.toLowerCase().includes(searchTerm)));
      if (!keys.length) {
        $list.innerHTML = `<div class="empty">Gruppentabellen sind noch nicht verfügbar.<br>
          Sobald Gruppenspiele in den Daten stehen, erscheinen sie hier automatisch.</div>`; return;
      }
      let html = `<div class="legend">Je Gruppe ziehen die <b>ersten beiden</b> ins Sechzehntelfinale ein (zzgl. der acht besten Gruppendritten).</div><div class="groups-grid">`;
      for (const g of keys) {
        const groupLive = groups[g].some(t => t.live);
        const rows = groups[g].map((t, i) => {
          const form = t.form.slice(-5).map(r =>
            `<span class="${r}">${r === "w" ? "S" : r === "d" ? "U" : "N"}</span>`).join("");
          const liveChip = t.live
            ? `<span class="live-chip" title="läuft gerade: ${esc(t.live.status || "Live")}"><span class="live-chip-dot"></span>${esc(t.live.score)}</span>`
            : "";
          return `<tr class="${i < 2 ? "qualified" : ""} ${isFav(t.team) ? "is-fav" : ""} ${t.live ? "live-row" : ""}">
            <td class="r"><span class="rankcell">${i + 1}</span></td>
            <td class="t"><span class="team-cell">${flag(t.badge)}<span>${esc(t.team)}${isFav(t.team) ? ' <span class="fav-star">★</span>' : ""}</span>${liveChip}</span></td>
            <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
            <td>${t.gf}:${t.ga}</td><td>${t.gf - t.ga > 0 ? "+" : ""}${t.gf - t.ga}</td>
            <td class="pts">${t.pts}</td><td><span class="form">${form}</span></td>
          </tr>`;
        }).join("");
        html += `<div class="group-card"><div class="group-title">🏅 Gruppe ${g}${groupLive ? ' <span class="group-live-tag"><span class="live-chip-dot"></span>LIVE-TABELLE</span>' : ""}</div>
          <div class="standings-wrap"><table class="standings"><thead><tr>
            <th class="r"></th><th class="t">Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th>
            <th>Tore</th><th>Diff</th><th>Pkt</th><th>Form</th>
          </tr></thead><tbody>${rows}</tbody></table></div></div>`;
      }
      $list.innerHTML = html + `</div>`;
    }

    // ====== Teams: FIFA-Weltrangliste (live) =====================================
    let _fifaCache = null;
    let _fifaIsLive = false;

    // Ländercodes → deutsche Namen
    const TEAM_DE = {
      ARG:"Argentinien", ESP:"Spanien",     FRA:"Frankreich",  ENG:"England",
      POR:"Portugal",    NED:"Niederlande", BRA:"Brasilien",   BEL:"Belgien",

      IDN:"Indonesien",  THA:"Thailand",    CHN:"China",       IND:"Indien",

    // Fallback: FIFA-Weltrangliste (Stand: Juni 2025)
    const _fifaFallback = [
      {code:"ARG",pts:1893},{code:"ESP",pts:1876},{code:"FRA",pts:1859},
      {code:"ENG",pts:1830},{code:"POR",pts:1790},{code:"BEL",pts:1769},

      {code:"JPN",pts:1624},{code:"DEN",pts:1616},{code:"SUI",pts:1613},
      {code:"AUT",pts:1607},{code:"TUR",pts:1602},{code:"IRN",pts:1599},

    // Parst ESPN-Rankings-Antwort in einheitliches Format
    function _parseEspnRanks(d) {
      const ranks = d?.rankings?.[0]?.ranks || d?.rankings?.ranks
                 || d?.ranks || d?.items || [];
      if (ranks.length < 10) return null;
      const list = ranks.map((r, i) => {
        const code = (r.team?.abbreviation || r.abbreviation || "").toUpperCase();
        const engName = r.team?.displayName || r.team?.name || r.displayName || code;
        return { code, name: TEAM_DE[code] || engName, pts: Math.round(r.points || r.value || 0), rank: r.current ?? i+1 };
      }).filter(t => t.code && t.code.length >= 2);
      return list.length >= 10 ? list : null;
    }

    // Parst FIFA-API-Antwort (direkt oder via Proxy)
    function _parseFifaRanks(raw) {
      const arr = raw?.Ranking || raw?.ranking || raw?.data?.Ranking || [];
      if (arr.length < 10) return null;
      const list = arr.map((r, i) => {
        const code = (r.CountryCode || r.FIFA3letterCode || r.countryCode || r.iso3 || "").toUpperCase();
        const engName = r.CountryName || r.countryName || r.name || code;
        return { code, name: TEAM_DE[code] || engName, pts: Math.round(r.Points || r.TotalPoints || r.points || 0), rank: r.Rank || r.rank || i+1 };
      }).filter(t => t.code && t.code.length >= 2);
      return list.length >= 10 ? list : null;
    }

    async function loadFifaRanking() {
      if (_fifaCache) return _fifaCache;

      // Versuch 1: ESPN direkt (mehrere URL-Varianten)
      const espnUrls = [
        "https://site.api.espn.com/apis/site/v2/sports/soccer/rankings?limit=100",
        "https://site.web.api.espn.com/apis/site/v2/sports/soccer/rankings?limit=100",
        "https://site.api.espn.com/apis/site/v2/sports/soccer/rankings",
      ];
      for (const url of espnUrls) {
        try {
          const parsed = _parseEspnRanks(await espnJson(url));
          if (parsed) { _fifaCache = parsed; _fifaIsLive = true; return parsed; }
        } catch {}
      }

      // Versuch 2: FIFA-API via allorigins.win CORS-Proxy
      try {
        const fifaTarget = "https://api.fifa.com/api/v3/rankings/FIFA?locale=en&count=100&home=1";
        const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(fifaTarget);
        const wrap = await espnJson(proxyUrl);
        const raw = typeof wrap?.contents === "string" ? JSON.parse(wrap.contents) : wrap?.contents;
        const parsed = _parseFifaRanks(raw);
        if (parsed) { _fifaCache = parsed; _fifaIsLive = true; return parsed; }
      } catch {}

      // Versuch 3: FIFA-API via corsproxy.io
      try {
        const fifaTarget = "https://api.fifa.com/api/v3/rankings/FIFA?locale=en&count=100&home=1";
        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(fifaTarget);
        const r = await fetch(proxyUrl);
        if (r.ok) {
          const parsed = _parseFifaRanks(await r.json());
          if (parsed) { _fifaCache = parsed; _fifaIsLive = true; return parsed; }
        }
      } catch {}

      // Fallback: statische Daten (Juni 2025)
      _fifaCache = _fifaFallback;
      _fifaIsLive = false;
      return _fifaCache;
    }

    async function renderTeams() {
      if (!_fifaCache) {
        $list.innerHTML = `<div class="loading"><div class="spinner"></div>Weltrangliste wird geladen…</div>`;
      }
      const all = await loadFifaRanking();
      // wenn zwischenzeitlich Tab gewechselt wurde, nicht überschreiben
      if (currentFilter !== "teams") return;
      let list = searchTerm
        ? all.filter(t => t.name.toLowerCase().includes(searchTerm.toLowerCase()) || t.code.toLowerCase().includes(searchTerm.toLowerCase()))
        : all;
      if (!list.length) {
        $list.innerHTML = `<div class="empty">Kein Team gefunden.</div>`; return;
      }
      const rows = list.map(t => {
        const url = flagUrl(t.code, t.name);
        const flagHtml = url
          ? `<img class="rank-flag" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;rank-flag-fb&quot;></span>'">`
          : `<span class="rank-flag-fb"></span>`;
        const fav = t.code === "GER" || t.name === "Deutschland";
        return `<div class="rank-row ${t.rank <= 3 ? "top3" : ""} ${fav ? "is-fav" : ""}">
          <span class="rank-pos">${t.rank}</span>
          ${flagHtml}
          <span class="rank-name">${esc(t.name)}${fav ? ' <span class="fav-star">★</span>' : ""}</span>
          <span class="rank-pts">${t.pts > 0 ? t.pts : "–"}<span>Pkt</span></span>
        </div>`;
      }).join("");
      const badge = _fifaIsLive
        ? `<span class="rank-live-badge">Live</span>`
        : `<span class="rank-src-badge">Juni 2025</span>`;
      $list.innerHTML = `<div class="section-head">FIFA-Weltrangliste ${badge}</div>
        <div class="rank-intro">Aktuelle Platzierung der Nationalmannschaften nach FIFA-Punkten.</div>
        <div class="rank-list">${rows}</div>`;
    }

    // ====== Turnierbaum (K.-o.-Phase) ========================================
    const KO_ORDER = ["Sechzehntelfinale", "Achtelfinale", "Viertelfinale", "Halbfinale", "Spiel um Platz 3", "Finale"];

    function bracketCard(m) {
      const hs = m.homeScore, as = m.awayScore;
      const done = hs != null && as != null;
      const row = (name, badge, score, win, fav) => `
        <div class="br-team${win ? " win" : ""}${fav ? " fav" : ""}">
          ${badge ? `<img class="br-flag" src="${esc(badge)}" alt="" onerror="this.style.display='none'">` : `<span class="br-flag-fb"></span>`}
          <span class="br-name">${esc(name || "—")}</span>
          <span class="br-score">${score != null ? score : ""}</span>
        </div>`;
      return `<div class="br-match" data-id="${esc(m.id)}" role="button" tabindex="0">
        ${row(m.home, m.homeBadge, hs, done && hs > as, isFav(m.home))}
        ${row(m.away, m.awayBadge, as, done && as > hs, isFav(m.away))}
      </div>`;
    }

    function bracketSkeleton() {
      const layout = [["Viertelfinale", 4], ["Halbfinale", 2], ["Finale", 1]];
      const cols = layout.map(([s, n]) => {
        const slots = Array.from({ length: n }).map(() =>
          `<div class="br-match skel">
            <div class="br-team"><span class="br-flag-fb"></span><span class="br-name">—</span></div>
            <div class="br-team"><span class="br-flag-fb"></span><span class="br-name">—</span></div>
          </div>`).join("");
        return `<div class="br-col"><div class="br-col-title">${s}</div>${slots}</div>`;
      }).join("");
      return `<div class="bracket-scroll"><div class="bracket">${cols}</div></div>`;
    }

    function renderBracket() {
      const ko = allMatches.filter(m => m.kind === "wm" && m.stage);
      const byStage = {};
      for (const m of ko) (byStage[m.stage] ||= []).push(m);
      const stages = KO_ORDER.filter(s => byStage[s]);

      if (!stages.length) {
        $list.innerHTML = `<div class="section-head">Turnierbaum</div>
          <div class="bracket-empty">🗺️ Der Turnierbaum wird mit dem Beginn der K.-o.-Phase gefüllt.<br>Aktuell läuft die Gruppenphase.</div>
          ${bracketSkeleton()}`;
        return;
      }

      const cols = stages.map(s => {
        const games = byStage[s].slice().sort((a, b) => (a.date?.getTime() || 0) - (b.date?.getTime() || 0));
        return `<div class="br-col"><div class="br-col-title">${esc(s)}</div>${games.map(bracketCard).join("")}</div>`;
      }).join("");

      $list.innerHTML = `<div class="section-head">Turnierbaum</div>
        <div class="rank-intro">Der Weg ins Finale – tippe ein Spiel für Details.</div>
        <div class="bracket-scroll"><div class="bracket">${cols}</div></div>`;
      $list.querySelectorAll(".br-match[data-id]").forEach(c =>
        c.addEventListener("click", () => openMatch(c.dataset.id)));
    }

    // ====== Profile: Login + Einstellungen ===================================
    // Einzigartige WM-Teams (Name + Flagge) für die Favoriten-Auswahl
    function wmTeams() {
      const m = new Map();
      for (const x of allMatches) {
        if (x.kind !== "wm") continue;
        if (x.home && !m.has(x.home)) m.set(x.home, x.homeBadge);
        if (x.away && !m.has(x.away)) m.set(x.away, x.awayBadge);
      }
      // Platzhalter wie "1A", "2B", "W3", "L4", "TBD" herausfiltern
      const isNation = (name, badge) => {
        if (!name || name.length < 3) return false;
        if (/^\d+[A-L]$|^[A-L]\d+$|^[WL]\d+$|^TBD$/i.test(name.trim())) return false;
        return !!(badge || NAME2ISO[name.trim().toLowerCase()]);
      };
      let list = [...m].filter(([n, b]) => isNation(n, b)).map(([name, badge]) => ({ name, badge }));
      if (!list.length) list = _fifaFallback.map(t => ({ name: t.name, badge: flagUrl(t.code, t.name) }));
      return list.sort((a, b) => a.name.localeCompare(b.name));
    }

    function favFlag(name) {
      const t = wmTeams().find(x => x.name === name);
      const url = t?.badge || flagUrl("", name);
      return url
        ? `<img class="rank-flag" src="${esc(url)}" alt="" onerror="this.style.display='none'">`
        : `<span class="rank-flag-fb"></span>`;
    }
