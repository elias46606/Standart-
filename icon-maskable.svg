<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0%"  stop-color="#1b1e29"/>
      <stop offset="55%" stop-color="#0d0e14"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f9ecaf"/>
      <stop offset="34%"  stop-color="#ebcb6d"/>
      <stop offset="66%"  stop-color="#cda545"/>
      <stop offset="100%" stop-color="#a87f2c"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#fff8dc" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f0d68f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#cda545" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="52%">
      <stop offset="0%"   stop-color="#ebcb6d" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ebcb6d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="196" r="185" fill="url(#glow)"/><g transform="translate(256 262) scale(0.78) translate(-256 -256)">

  <!-- Pokal, zentral und dominant -->
  <g>
    <!-- Henkel -->
    <path d="M 188 118 C 142 130 142 188 192 192"
          fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round"/>
    <path d="M 324 118 C 370 130 370 188 320 192"
          fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round"/>
    <!-- Schale -->
    <path d="M 184 104
             C 184 178 212 220 256 230
             C 300 220 328 178 328 104 Z"
          fill="url(#gold)"/>
    <!-- Glanzlicht -->
    <path d="M 206 112
             C 207 162 226 198 250 214
             C 240 184 234 146 234 112 Z"
          fill="url(#goldShine)"/>
    <!-- Stiel -->
    <rect x="244" y="228" width="24" height="44" fill="url(#gold)"/>
    <!-- Sockel -->
    <path d="M 208 300 L 218 272 L 294 272 L 304 300 Z" fill="url(#gold)"/>
    <rect x="198" y="300" width="116" height="22" rx="7" fill="url(#gold)"/>
  </g>

  <!-- Farbakzent-Bogen der Gastgeber (USA-Blau · Mexiko-Grün · Kanada-Rot) -->
  <g fill="none" stroke-width="16" stroke-linecap="round">
    <path d="M 150 372 A 132 132 0 0 1 256 338" stroke="#2b6cff"/>
    <path d="M 256 338 A 132 132 0 0 1 318 356" stroke="#17a14b"/>
    <path d="M 318 356 A 132 132 0 0 1 362 372" stroke="#e23744"/>
  </g>

  <!-- "26" -->
  <text x="256" y="476"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="104" font-weight="700" letter-spacing="3"
        fill="#f2f5fb" text-anchor="middle">26</text>

</g></svg>