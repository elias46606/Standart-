name: Seiten auf GitHub Pages veröffentlichen

on:
  push:
    branches:
      - claude/sharp-einstein-tf9ppn
    paths:
      - 'klarheit/**'
      - 'wm-spiele.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Es soll immer nur ein Deployment gleichzeitig laufen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: klarheit/package-lock.json

      - name: Klarheit-Abhängigkeiten installieren
        working-directory: klarheit
        run: npm ci

      - name: Klarheit bauen
        working-directory: klarheit
        run: npm run build

      - name: Pages-Verzeichnis zusammenstellen
        run: |
          mkdir -p _site/klarheit
          # Fußball-Seite behält die Haupt-Adresse (/Standart-/ und /Standart-/wm-spiele.html)
          cp wm-spiele.html _site/wm-spiele.html
          cp wm-spiele.html _site/index.html
          # Klarheit bekommt eine eigene Unter-Adresse (/Standart-/klarheit/)
          cp -r klarheit/dist/. _site/klarheit/

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
