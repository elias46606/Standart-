name: Klarheit auf GitHub Pages veröffentlichen

on:
  push:
    branches:
      - claude/sharp-einstein-tf9ppn
    paths:
      - 'klarheit/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Es soll immer nur ein Deployment gleichzeitig laufen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: klarheit/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: klarheit
        run: npm ci

      - name: App bauen
        working-directory: klarheit
        run: npm run build

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build-Ergebnis als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: klarheit/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
