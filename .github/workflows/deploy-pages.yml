name: WM-App auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: GitHub Pages konfigurieren (auf Actions-Modus stellen)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Web-Dateien zusammenstellen
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js _site/ 2>/dev/null || true
          cp *.png *.svg _site/ 2>/dev/null || true
          cp himmel.html _site/ 2>/dev/null || true
          cp -r css _site/ 2>/dev/null || true
          cp -r crypto-dashboard _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
