<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WM 2026 &amp; Testspiele – Live</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --card: #131a2e;
      --card-hover: #1b2540;
      --line: #243150;
      --text: #eef2ff;
      --muted: #93a0c0;
      --accent: #3ea6ff;
      --gold: #ffcc33;
      --live: #ff4757;
      --green: #2ed573;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -10%, #16224a 0%, var(--bg) 60%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      padding: 24px 16px 64px;
    }

    .wrap { max-width: 920px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 28px; }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    h1 .ball { font-size: 1.1em; }

    .subtitle { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .tab:hover { background: var(--card-hover); color: var(--text); }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #06101f;
      font-weight: 600;
    }

    input[type="search"] {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      min-width: 180px;
      flex: 1 1 180px;
      max-width: 280px;
    }
    input[type="search"]::placeholder { color: var(--muted); }
    input[type="search"]:focus { outline: none; border-color: var(--accent); }

    .month-head {
      margin: 24px 0 10px;
      color: var(--gold);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: capitalize;
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
    }

    .match {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 76px 1fr auto;
      gap: 14px;
      align-items: center;
      transition: background 0.15s, transform 0.15s;
    }
    .match:hover { background: var(--card-hover); transform: translateY(-1px); }

    .when { text-align: center; font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
    .when .day { font-size: 1.25rem; font-weight: 700; color: var(--text); }

    .teams { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .team {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.98rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .team.winner { font-weight: 700; }
    .team img { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
    .badge-fallback {
      width: 20px; height: 20px; border-radius: 4px;
      background: var(--line); flex-shrink: 0;
    }
    .meta { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }

    .result { text-align: right; min-width: 64px; }
    .score {
      font-size: 1.35rem; font-weight: 800; letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }
    .vs { color: var(--muted); font-size: 0.95rem; }
    .tag {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 5px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .tag.live { background: var(--live); color: #fff; animation: pulse 1.4s infinite; }
    .tag.ft { background: var(--line); color: var(--muted); }
    .tag.wm { background: rgba(255,204,51,0.15); color: var(--gold); }
    .tag.test { background: rgba(62,166,255,0.15); color: var(--accent); }

    .league-line { display: flex; gap: 6px; flex-wrap: wrap; }

    .empty, .loading, .error {
      text-align: center;
      color: var(--muted);
      padding: 48px 16px;
      font-size: 0.95rem;
    }
    .error { color: #ff8a8a; }
    .spinner {
      width: 28px; height: 28px; margin: 0 auto 14px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 36px; }
    footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 520px) {
      .match { grid-template-columns: 60px 1fr auto; gap: 10px; padding: 12px; }
      .team { font-size: 0.9rem; }
      .score { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span class="ball">⚽</span> WM 2026 &amp; Testspiele</h1>
      <div class="subtitle">Alle Spiele der Weltmeisterschaft und internationale Freundschaftsspiele</div>
      <div class="status-bar">
        <span class="dot"></span>
        <span id="status">Lade Spiele…</span>
      </div>
    </header>

    <div class="controls">
      <div class="tabs">
        <button class="tab active" data-filter="all">Alle</button>
        <button class="tab" data-filter="wm">WM 2026</button>
        <button class="tab" data-filter="test">Testspiele</button>
        <button class="tab" data-filter="live">Live</button>
        <button class="tab" data-filter="upcoming">Kommend</button>
      </div>
      <input type="search" id="search" placeholder="Team suchen…" autocomplete="off">
    </div>

    <div id="list">
      <div class="loading"><div class="spinner"></div>Spiele werden geladen…</div>
    </div>

    <footer>
      Daten von <a href="https://www.thesportsdb.com" target="_blank" rel="noopener">TheSportsDB</a> ·
      Aktualisiert sich automatisch alle 60&nbsp;Sekunden ·
      Letzte Aktualisierung: <span id="updated">–</span>
    </footer>
  </div>

  <script>
    // ====== Konfiguration ======================================================
    // Kostenloser Test-API-Schlüssel von TheSportsDB. Für mehr Anfragen einen
    // eigenen (kostenlosen) Schlüssel auf thesportsdb.com holen und hier eintragen.
    const API_KEY = "123";
    const BASE = `https://www.thesportsdb.com/api/v1/json/${API_KEY}`;

    const SEASON_YEAR = new Date().getFullYear(); // aktuelles Jahr für Testspiele
    const SOURCES = [
      { id: "4429", season: "2026", kind: "wm",   label: "WM 2026" },          // FIFA World Cup
      { id: "4562", season: String(SEASON_YEAR), kind: "test", label: "Testspiel" }, // International Friendlies
    ];

    const REFRESH_MS = 60_000;          // Auto-Refresh-Intervall
    const CACHE_KEY = "wm-spiele-cache"; // letzte erfolgreiche Daten

    // ====== Status ============================================================
    let allMatches = [];
    let currentFilter = "all";
    let searchTerm = "";

    const $list = document.getElementById("list");
    const $status = document.getElementById("status");
    const $updated = document.getElementById("updated");
    const $search = document.getElementById("search");

    // ====== Daten laden =======================================================
    async function fetchJSON(url, tries = 3) {
      for (let i = 0; i < tries; i++) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error("HTTP " + res.status);
          return await res.json();
        } catch (err) {
          if (i === tries - 1) throw err;
          await new Promise(r => setTimeout(r, 1000 * (i + 1))); // Backoff
        }
      }
    }

    function normalize(ev, source) {
      const ts = ev.strTimestamp ? new Date(ev.strTimestamp.replace(" ", "T") + "Z")
               : ev.dateEvent ? new Date(ev.dateEvent + "T" + (ev.strTime || "00:00:00") + "Z")
               : null;
      const status = (ev.strStatus || "").trim();
      const finished = /finish|ft|aet|full|after/i.test(status) ||
                       (ev.intHomeScore != null && ev.intAwayScore != null && !isLiveStatus(status) && ts && ts < new Date());
      const live = isLiveStatus(status);
      return {
        id: ev.idEvent,
        name: ev.strEvent,
        home: ev.strHomeTeam,
        away: ev.strAwayTeam,
        homeBadge: ev.strHomeTeamBadge || "",
        awayBadge: ev.strAwayTeamBadge || "",
        homeScore: ev.intHomeScore,
        awayScore: ev.intAwayScore,
        date: ts,
        round: ev.intRound,
        venue: ev.strVenue || "",
        status,
        live,
        finished,
        kind: source.kind,
        league: source.label,
      };
    }

    function isLiveStatus(s) {
      if (!s) return false;
      return /^(1h|2h|ht|et|live|in play|\d{1,3}'?)$/i.test(s.trim());
    }

    async function loadAll() {
      try {
        const results = await Promise.allSettled(
          SOURCES.map(src =>
            fetchJSON(`${BASE}/eventsseason.php?id=${src.id}&s=${src.season}`)
              .then(data => (data.events || []).map(ev => normalize(ev, src)))
          )
        );

        let merged = [];
        let anyOk = false;
        results.forEach(r => {
          if (r.status === "fulfilled") { merged = merged.concat(r.value); anyOk = true; }
        });

        if (!anyOk) throw new Error("Keine Quelle erreichbar");

        // Duplikate (gleiche idEvent) entfernen
        const seen = new Set();
        merged = merged.filter(m => m.id && !seen.has(m.id) && seen.add(m.id));

        // chronologisch sortieren (Spiele ohne Datum ans Ende)
        merged.sort((a, b) => (a.date?.getTime() || Infinity) - (b.date?.getTime() || Infinity));

        allMatches = merged;
        localStorage.setItem(CACHE_KEY, JSON.stringify(merged.map(serialize)));
        render();
        setUpdated();
        $status.textContent = `${allMatches.length} Spiele geladen`;
      } catch (err) {
        // Auf Cache zurückfallen, damit die Seite nie leer ist
        const cached = loadCache();
        if (cached.length) {
          allMatches = cached;
          render();
          $status.textContent = "Offline – zeige gespeicherte Daten";
        } else {
          $list.innerHTML = `<div class="error">⚠️ Spiele konnten nicht geladen werden.<br>
            Bitte später erneut versuchen. (${err.message})</div>`;
          $status.textContent = "Fehler beim Laden";
        }
      }
    }

    function serialize(m) { return { ...m, date: m.date ? m.date.toISOString() : null }; }
    function loadCache() {
      try {
        const raw = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
        return raw.map(m => ({ ...m, date: m.date ? new Date(m.date) : null }));
      } catch { return []; }
    }

    // ====== Filter & Suche ====================================================
    function applyFilter(m) {
      if (searchTerm) {
        const hay = `${m.home} ${m.away} ${m.name}`.toLowerCase();
        if (!hay.includes(searchTerm)) return false;
      }
      switch (currentFilter) {
        case "wm":       return m.kind === "wm";
        case "test":     return m.kind === "test";
        case "live":     return m.live;
        case "upcoming": return !m.finished && !m.live && m.date && m.date >= new Date();
        default:         return true;
      }
    }

    // ====== Rendering =========================================================
    const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli",
                    "August","September","Oktober","November","Dezember"];
    const WEEKDAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];

    function render() {
      const matches = allMatches.filter(applyFilter);
      if (!matches.length) {
        $list.innerHTML = `<div class="empty">Keine Spiele für diese Auswahl.</div>`;
        return;
      }

      let html = "";
      let lastMonth = "";
      for (const m of matches) {
        const monthKey = m.date ? `${MONTHS[m.date.getMonth()]} ${m.date.getFullYear()}` : "Termin offen";
        if (monthKey !== lastMonth) {
          html += `<div class="month-head">${monthKey}</div>`;
          lastMonth = monthKey;
        }
        html += renderMatch(m);
      }
      $list.innerHTML = html;
    }

    function renderMatch(m) {
      const d = m.date;
      const when = d
        ? `<div class="day">${d.getDate()}</div>${WEEKDAYS[d.getDay()]}<br>${pad(d.getHours())}:${pad(d.getMinutes())}`
        : `<div class="day">?</div>offen`;

      const hasScore = m.homeScore != null && m.awayScore != null;
      const homeWin = hasScore && +m.homeScore > +m.awayScore;
      const awayWin = hasScore && +m.awayScore > +m.homeScore;

      const result = m.live
        ? `<div class="score">${m.homeScore ?? 0}:${m.awayScore ?? 0}</div><span class="tag live">● ${m.status || "Live"}</span>`
        : m.finished && hasScore
          ? `<div class="score">${m.homeScore}:${m.awayScore}</div><span class="tag ft">Beendet</span>`
          : `<div class="vs">vs</div>`;

      const kindTag = m.kind === "wm"
        ? `<span class="tag wm">WM 2026</span>`
        : `<span class="tag test">Testspiel</span>`;

      return `
        <div class="match">
          <div class="when">${when}</div>
          <div class="teams">
            <div class="team ${homeWin ? "winner" : ""}">${badge(m.homeBadge)}<span>${esc(m.home)}</span></div>
            <div class="team ${awayWin ? "winner" : ""}">${badge(m.awayBadge)}<span>${esc(m.away)}</span></div>
            <div class="meta league-line">${kindTag}${m.venue ? `<span>${esc(m.venue)}</span>` : ""}</div>
          </div>
          <div class="result">${result}</div>
        </div>`;
    }

    function badge(url) {
      return url
        ? `<img src="${esc(url)}/tiny" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;badge-fallback&quot;></span>'">`
        : `<span class="badge-fallback"></span>`;
    }

    function pad(n) { return String(n).padStart(2, "0"); }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function setUpdated() {
      const now = new Date();
      $updated.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} Uhr`;
    }

    // ====== Events ============================================================
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelector(".tab.active")?.classList.remove("active");
        tab.classList.add("active");
        currentFilter = tab.dataset.filter;
        render();
      });
    });

    let searchTimer;
    $search.addEventListener("input", e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchTerm = e.target.value.trim().toLowerCase();
        render();
      }, 200);
    });

    // ====== Start & Auto-Refresh =============================================
    loadAll();
    setInterval(loadAll, REFRESH_MS);
    // Beim Zurückkehren auf den Tab sofort aktualisieren
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) loadAll();
    });
  </script>
</body>
</html>
