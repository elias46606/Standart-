<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himmel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      font-family: sans-serif;
      color: white;
    }

    h1 {
      margin-bottom: 24px;
      font-size: 2rem;
      letter-spacing: 2px;
    }

    .sky {
      width: 800px;
      max-width: 95vw;
      height: 450px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      background: linear-gradient(
        to bottom,
        #0d1b4b 0%,
        #1a3a8f 20%,
        #2e6fbc 45%,
        #87ceeb 70%,
        #ffd580 85%,
        #ff8c42 100%
      );
    }

    /* Sun */
    .sun {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7aa, #ffcc00, #ff8c00);
      box-shadow: 0 0 40px 20px rgba(255, 200, 50, 0.6);
    }

    /* Clouds */
    .cloud {
      position: absolute;
      background: white;
      border-radius: 50px;
      opacity: 0.85;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    .cloud-1 {
      width: 120px;
      height: 40px;
      top: 80px;
      left: 60px;
    }
    .cloud-1::before {
      width: 60px;
      height: 60px;
      top: -30px;
      left: 20px;
    }
    .cloud-1::after {
      width: 40px;
      height: 40px;
      top: -20px;
      left: 60px;
    }

    .cloud-2 {
      width: 160px;
      height: 50px;
      top: 130px;
      right: 80px;
      opacity: 0.75;
    }
    .cloud-2::before {
      width: 70px;
      height: 70px;
      top: -35px;
      left: 30px;
    }
    .cloud-2::after {
      width: 50px;
      height: 50px;
      top: -25px;
      left: 90px;
    }

    .cloud-3 {
      width: 100px;
      height: 35px;
      top: 60px;
      right: 200px;
      opacity: 0.6;
    }
    .cloud-3::before {
      width: 45px;
      height: 45px;
      top: -22px;
      left: 15px;
    }
    .cloud-3::after {
      width: 35px;
      height: 35px;
      top: -15px;
      left: 55px;
    }

    /* Stars */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40%;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.3; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Der Himmel</h1>
  <div class="sky">
    <div class="stars" id="stars"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="sun"></div>
  </div>

  <script>
    // Generate random stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 60; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      const size = Math.random() * 3 + 1;
      star.style.width  = size + 'px';
      star.style.height = size + 'px';
      star.style.top    = Math.random() * 100 + '%';
      star.style.left   = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 2 + 's';
      star.style.animationDuration = (Math.random() * 2 + 1) + 's';
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
